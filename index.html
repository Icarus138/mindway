<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>Mindway</title>
<meta name="description" content="Mindway — système cognitif anti-procrastination. Capture spontanée, MIT, état d'esprit, plans If-Then. 100% local, sans backend."/>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#080A0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mindway">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   MINDWAY v2 — Cognitive organization journal
   Guard-exact palette · DM Mono · mobile-first · no emojis
============================================================ */
:root {
  /* ============================================================
     CHARTE GRAPHIQUE v3.3 — Inspirée de Guard_vX
     Base gris-bleu nuit · Ombres BLANCHES (pas violettes)
     6 atomes : noir · surface · blanc-haut · gris · accent · signal
     Les essentiels ressortent par luminescence blanche neutre.
  ============================================================ */
  --bg:#0F1115;          /* 1. Gris-bleu nuit (Guard bg0) */
  --bg-card:#16191f;     /* 2. Surface élevée (Guard bg2) */
  --bg-2:#121518;        /* lift 1 (bg1) */
  --bg-3:#1a1e26;        /* lift 2 (bg3) */
  --bg-4:#1e232c;        /* lift 3 (bg4) */

  --border:rgba(255,255,255,.045);
  --border-hi:rgba(255,255,255,.09);
  --border-lo:rgba(255,255,255,.022);

  /* Texte — palette Guard, neutre */
  --t1:rgba(230,230,230,.92);     /* 3. Blanc-haut */
  --t2:rgba(138,144,158,.85);     /* 4. Gris-bleu mid */
  --t3:rgba(107,114,128,.7);
  --t4:rgba(80,86,98,.7);

  /* Accent neutre — blanc (plus aucun violet dans l'UI hors states spécifiques)
     Le bleu-violet reste pour le hover de la carte cognitive uniquement (CSS local). */
  --accent:rgba(230,232,238,.92);
  --violet:rgba(230,232,238,.92);
  --vio-d:rgba(230,232,238,.05);
  --vio-b:rgba(230,232,238,.12);

  /* Signal chaud — ambre Guard désaturé */
  --signal:#b8923a;
  --be:#b8923a;       --be-d:rgba(184,146,58,.09);
  --amber:#b8923a;    --amb-d:rgba(184,146,58,.09); --amb-b:rgba(184,146,58,.16);

  /* Sémantique Win/Loss — Guard's muted greens/roses */
  --win:#5a9e7a;     --win-d:rgba(90,158,122,.09);  --win-b:rgba(90,158,122,.16);
  --loss:#9e5a5a;    --loss-d:rgba(158,90,90,.09);  --loss-b:rgba(158,90,90,.16);  --loss-l:#b87070;

  --font:'DM Mono','SF Mono','Fira Code',monospace;
  --r:6px; --rl:10px; --tr:140ms ease;

  /* ── OMBRES BLANCHES — la signature lumineuse de Guard ── */
  --neon-violet:rgba(255,255,255,.18); --neon-teal:rgba(255,255,255,.14); --neon-amber:rgba(255,255,255,.12);
  --neon-red:rgba(255,255,255,.1);     --neon-blue:rgba(255,255,255,.16);
  --glow-v:drop-shadow(0 0 6px rgba(255,255,255,.18)) drop-shadow(0 0 14px rgba(200,210,255,.06));
  --glow-t:drop-shadow(0 0 5px rgba(255,255,255,.14));
  --glow-a:drop-shadow(0 0 5px rgba(255,255,255,.12));
  --glow-r:drop-shadow(0 0 4px rgba(255,255,255,.1));
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
/* v3.18 — Mobile readability bump : 14→18 px sur mobile (<768px) + 16px desktop.
   Toutes les `.XXrem` se multiplient automatiquement (les éléments en pixels
   absolus comme cellules calendrier restent inchangés).
   Le design original a été calibré à 14px ; +28% de gain de lecture sur tel. */
html{font-size:14px;-webkit-text-size-adjust:100%;}
@media (max-width:768px){
  /* v3.18d — pas de bump global. Texte de base reste 14px comme desktop.
     On corrige UNIQUEMENT les classes franchement illisibles (tab labels
     6.72px, CTA 7px) sans grossir tout le contenu. */
  /* html font-size reste 14px (hérité). */

  /* Tab labels : 6.72 → 11px (le minimum pour lire en marchant) */
  .tab-btn span{font-size:.72rem!important;letter-spacing:.04em;}
  /* CTA principaux (mots-clés d'action) : 7-7.28 → 11-12px */
  .friction-plan-cta,.ifthen-other-cta,.ins-cta,.nm-cta,
  .guided-trigger-link,.fbtn{font-size:.7rem!important;letter-spacing:.04em;}
  /* Info bubble : tactile mais visuel sobre */
  .info-bubble{width:22px!important;height:22px!important;font-size:.62rem!important;}
  /* v3.18 — Tooltip mobile : reste dans le viewport (pas de débordement gauche)
     en ancrant à gauche via left:0 + transform:0 + max-width raisonnable. */
  .info-bubble[data-tip]:hover::after,.info-bubble[data-tip]:focus::after{
    font-size:.78rem!important;
    left:auto!important;
    right:auto!important;
    transform:none!important;
    max-width:min(280px,calc(100vw - 40px))!important;
    width:max-content;
    /* Ancre près du bouton sans dépasser */
    inset-inline-start:0;
  }
  .info-bubble[data-tip]:hover::before,.info-bubble[data-tip]:focus::before{left:12px!important;transform:translateY(2px)!important;}

  /* v3.18 Phase 2 — Tap targets : >=44×44 minimum iOS HIG.
     On utilise un ::before transparent qui élargit la zone tactile sans
     changer le rendu visuel. */
  .mbtn{min-width:44px;min-height:44px;font-size:.86rem!important;}
  .tpill{min-height:38px;padding:8px 14px!important;font-size:.78rem!important;}
  .tchk,.tdel{position:relative;}
  .tchk::before,.tdel::before{content:'';position:absolute;inset:-12px;}
  .fbtn{min-height:38px;padding:0 14px!important;}
  .friction-plan-cta,.ifthen-other-cta,.ins-cta,.nm-cta,.guided-trigger-link{min-height:38px;padding:9px 14px!important;}
  .guided-trigger-link{display:inline-flex;align-items:center;}
  .add-btn{min-height:44px;font-size:.78rem!important;}

  /* v3.18 — Layout fixes mobile : adapter le header de carte MIT pour ne pas
     pousser les boutons sur une autre ligne. */
  .mit-hero-head{flex-wrap:wrap;gap:6px;}
  .mit-hero-date{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;}
  /* Le sous-titre nav peut wrap proprement, mais sur 2 lignes ça pousse la date — masque la sous-ligne */
  .nav-sub{display:none;}
  /* Friction line : empêche le ? de wrapper seul */
  .mit-hero .friction-line,.mit-hero [class*="friction"]{display:flex;align-items:flex-start;gap:6px;flex-wrap:wrap;}
}
body{background:#080A0F;color:var(--t1);font-family:var(--font);font-weight:300;min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased;}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");background-size:200px;pointer-events:none;z-index:0;opacity:.52;}
body::after{content:'';position:fixed;top:-30vh;left:50%;transform:translateX(-50%);width:65vw;height:60vh;background:radial-gradient(ellipse,rgba(255,255,255,.025) 0%,transparent 70%);pointer-events:none;z-index:0;}
::-webkit-scrollbar{width:2px;} ::-webkit-scrollbar-track{background:transparent;} ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.06);border-radius:2px;}
.app{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100dvh;}

/* NAV */
/* v3.18 — Safe-area iOS : nav respecte le notch / Dynamic Island en mode standalone. */
.nav{display:flex;align-items:center;justify-content:space-between;padding:env(safe-area-inset-top,0) 18px 0;min-height:calc(50px + env(safe-area-inset-top,0));background:rgba(8,10,15,.96);border-bottom:1px solid var(--border);backdrop-filter:blur(18px);position:sticky;top:0;z-index:100;}
.nav::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:40%;height:1px;background:linear-gradient(to right,transparent,rgba(255,255,255,.18),transparent);pointer-events:none;}
.nav-brand{display:flex;align-items:center;gap:9px;}
.nav-logo{width:19px;height:19px;stroke:var(--t1);fill:none;stroke-width:1.4;stroke-linecap:round;flex-shrink:0;filter:drop-shadow(0 0 4px rgba(255,255,255,.18));}
.nav-name{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--t1);}
.nav-sub{font-size:.48rem;letter-spacing:.08em;color:var(--t3);}
.nav-date{font-size:.54rem;color:var(--t3);text-align:right;line-height:1.5;}

/* TAB BAR — 4 tabs */
.tab-bar{display:flex;align-items:stretch;position:fixed;bottom:0;left:0;right:0;height:54px;background:rgba(8,10,15,.97);border-top:1px solid var(--border);backdrop-filter:blur(20px);z-index:100;padding-bottom:env(safe-area-inset-bottom,0);}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;border:none;background:none;color:var(--t3);font-family:var(--font);font-size:.48rem;letter-spacing:.1em;text-transform:uppercase;transition:color var(--tr);}
.tab-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;}
.tab-btn.on{color:var(--violet);}
.tab-btn.on svg{stroke:var(--violet);}

/* PAGES */
.main{flex:1;padding-bottom:calc(66px + env(safe-area-inset-bottom,0));}
.page{display:none;padding:15px 14px;max-width:680px;margin:0 auto;}
.page.on{display:block;}

/* DATE HEADER */
.dh{margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border-lo);}
.dh-dow{font-size:.52rem;letter-spacing:.16em;text-transform:uppercase;color:var(--t3);margin-bottom:2px;}
.dh-full{font-size:.82rem;color:var(--t1);}

/* QUOTE STRIP */
.qs{background:linear-gradient(135deg,rgba(255,255,255,.04) 0%,var(--bg-card) 80%);border:1px solid rgba(255,255,255,.1);border-left:2px solid rgba(255,255,255,.22);border-radius:var(--rl);padding:13px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:flex-start;transition:filter 250ms ease,border-color 250ms ease;}
.qs:hover{filter:drop-shadow(0 0 6px rgba(255,255,255,.14));border-color:rgba(255,255,255,.22);}
.qs-icon svg{width:11px;height:11px;fill:rgba(210,214,222,.55);}
.qs-text{font-size:.74rem;line-height:1.75;color:rgba(225,230,240,.88);font-style:italic;}
.qs-auth{font-size:.58rem;color:rgba(180,188,200,.65);margin-top:5px;letter-spacing:.02em;}

/* CONCEPT HINT */
.hint-wrap{margin-top:5px;padding:6px 10px;background:rgba(255,255,255,.018);border-left:2px solid var(--border);border-radius:0 var(--r) var(--r) 0;font-size:.6rem;color:var(--t2);line-height:1.65;}
.hint-btn{background:none;border:1px solid var(--border);border-radius:50%;color:var(--t3);width:14px;height:14px;font-family:var(--font);font-size:.48rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;margin-left:5px;flex-shrink:0;transition:all var(--tr);}
.hint-btn:hover{border-color:var(--violet);color:var(--violet);}

/* CHECK-IN */
.ci-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--rl);margin-bottom:12px;overflow:hidden;}
.ci-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;cursor:pointer;user-select:none;}
.ci-hdr-l{display:flex;align-items:center;gap:7px;}
.ci-hdr-ico{width:12px;height:12px;stroke:var(--t3);fill:none;stroke-width:1.4;stroke-linecap:round;}
.ci-hdr-lbl{font-size:.55rem;letter-spacing:.12em;text-transform:uppercase;color:var(--t2);}
.ci-tags-prev{display:flex;gap:3px;}
.ci-tp{font-size:.48rem;padding:1px 6px;border-radius:20px;background:var(--vio-d);color:var(--violet);border:1px solid rgba(91,110,232,.18);}
.chevron{width:12px;height:12px;stroke:var(--t3);fill:none;stroke-width:1.4;stroke-linecap:round;transition:transform var(--tr);}
.ci-card.open .chevron{transform:rotate(180deg);}
.ci-body{display:none;padding:0 12px 12px;}
.ci-card.open .ci-body{display:block;}
.ci-sep{height:1px;background:var(--border-lo);margin-bottom:10px;}
.mrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.mlbl{font-size:.57rem;color:var(--t2);width:108px;flex-shrink:0;}
.mbtns{display:flex;gap:3px;}
.mbtn{width:25px;height:25px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--t3);font-family:var(--font);font-size:.57rem;cursor:pointer;transition:all var(--tr);}
.mbtn.on{background:rgba(255,255,255,.05);border-color:rgba(230,232,238,.45);color:rgba(230,232,238,.92);}
.tags-lbl{font-size:.5rem;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin:9px 0 5px;}
.tags-row{display:flex;flex-wrap:wrap;gap:4px;}
.tpill{font-size:.52rem;padding:2px 7px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--t3);cursor:pointer;transition:all var(--tr);font-family:var(--font);}
.tpill.on{background:rgba(255,255,255,.04);border-color:rgba(230,232,238,.34);color:rgba(230,232,238,.88);}
.note-ta{width:100%;margin-top:9px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:var(--r);padding:7px 9px;font-family:var(--font);font-size:.62rem;font-weight:300;color:var(--t1);resize:none;min-height:48px;line-height:1.6;}
.note-ta:focus{outline:none;border-color:rgba(91,110,232,.24);}

/* SECTION HEADERS */
.sec-h{display:flex;align-items:center;gap:6px;margin-bottom:7px;}
.sec-h svg{width:10px;height:10px;stroke:var(--t3);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;}
.sec-lbl{font-size:.52rem;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);}
.sec-cnt{font-size:.5rem;color:var(--t4);margin-left:auto;}

/* TASK CARDS */
.tsec{margin-bottom:14px;}
.tcard{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);padding:8px 10px;margin-bottom:4px;display:flex;gap:8px;align-items:flex-start;transition:border-color var(--tr),opacity var(--tr);}
.tcard.done{opacity:.36;}
.tcard.mit{border-color:rgba(195,150,90,.18);background:rgba(195,150,90,.018);}
.tcard.mit.done{opacity:.33;}
.tchk{width:16px;height:16px;flex-shrink:0;margin-top:1px;border:1px solid var(--border);border-radius:50%;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--tr);}
.tchk svg{width:8px;height:8px;stroke:transparent;fill:none;stroke-width:2.5;stroke-linecap:round;transition:stroke var(--tr);}
.tcard.done .tchk{background:var(--win-d);border-color:var(--win);}
.tcard.done .tchk svg{stroke:var(--win);}
.tcard.mit .tchk{border-color:rgba(195,150,90,.32);}
.tcard.mit.done .tchk{background:var(--amb-d);border-color:var(--amber);}
.tcard.mit.done .tchk svg{stroke:var(--amber);}
.tbody{flex:1;min-width:0;}
.tinp{width:100%;background:transparent;border:none;border-bottom:1px solid transparent;font-family:var(--font);font-size:.67rem;font-weight:300;color:var(--t1);outline:none;line-height:1.5;transition:border-color var(--tr);}
.tinp:focus{border-color:var(--border);}
.tcard.done .tinp{text-decoration:line-through;color:var(--t3);}
.tmeta{display:flex;align-items:center;gap:5px;margin-top:4px;}
.tdot{width:4px;height:4px;border-radius:50%;flex-shrink:0;}
.tdot.MIT{background:var(--amber);} .tdot.SECONDARY{background:rgba(91,110,232,.55);} .tdot.MICRO{background:var(--t4);}
.tbadge{font-size:.5rem;padding:1px 5px;border-radius:3px;background:rgba(255,255,255,.03);color:var(--t4);border:1px solid var(--border-lo);}
.tcap{font-size:.5rem;color:var(--t3);letter-spacing:.04em;padding:3px 6px;border:1px dashed var(--border-lo);border-radius:3px;background:transparent;cursor:default;font-family:var(--font);white-space:nowrap;}
.budget-line{margin-top:8px;padding-top:7px;border-top:1px solid var(--border-lo);display:flex;justify-content:space-between;align-items:center;font-size:.54rem;color:var(--t3);letter-spacing:.04em;}
.budget-line strong{color:var(--t1);font-weight:400;}
.budget-line.over strong{color:rgba(195,150,90,.9);}
.tsort-hint{font-size:.48rem;color:var(--t4);margin-bottom:5px;letter-spacing:.06em;}
.tctrl{display:flex;gap:3px;flex-shrink:0;align-items:center;}
.iusel{background:transparent;border:1px solid var(--border-lo);border-radius:3px;color:var(--t3);font-family:var(--font);font-size:.5rem;padding:2px 3px;cursor:pointer;}
.iusel:focus{outline:none;}
.tdel{background:none;border:none;cursor:pointer;color:var(--t3);display:flex;align-items:center;padding:2px;transition:color var(--tr);}
.tdel:hover{color:var(--loss);}
.tdel svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;}
.mit-empty{border:1px dashed rgba(195,150,90,.16);border-radius:var(--r);padding:18px 12px;text-align:center;cursor:pointer;background:rgba(195,150,90,.01);transition:border-color var(--tr);margin-bottom:4px;}
.mit-empty:hover{border-color:rgba(195,150,90,.3);}
.mit-empty-ico{width:19px;height:19px;stroke:var(--t4);fill:none;stroke-width:1;stroke-linecap:round;margin:0 auto 6px;display:block;}
.mit-empty-txt{font-size:.6rem;color:var(--t3);}
.mit-empty-sub{font-size:.52rem;color:var(--t4);margin-top:2px;line-height:1.5;}
.add-btn{width:100%;padding:7px 10px;background:transparent;border:1px dashed var(--border);border-radius:var(--r);color:var(--t3);font-family:var(--font);font-size:.56rem;cursor:pointer;text-align:left;display:flex;align-items:center;gap:5px;transition:all var(--tr);}
.add-btn:hover{border-color:var(--border-hi);color:var(--t2);}
.add-btn svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;}

/* SCORE CARD */
.score-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--rl);padding:12px;margin-top:5px;}
.score-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.score-lbl{font-size:.5rem;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);}
.sbadge{font-size:.5rem;letter-spacing:.07em;text-transform:uppercase;padding:2px 8px;border-radius:20px;}
.sb-win{color:var(--win);background:var(--win-d);border:1px solid rgba(91,110,232,.12);}
.sb-opt{color:var(--violet);background:var(--vio-d);border:1px solid rgba(91,110,232,.12);}
.sb-part{color:var(--be);background:var(--be-d);border:1px solid rgba(195,150,90,.12);}
.sb-go{color:var(--t3);background:transparent;border:1px solid var(--border);}
.sb-af{color:var(--amber);background:var(--amb-d);border:1px solid rgba(195,150,90,.16);}
.score-bar-bg{background:rgba(255,255,255,.04);border-radius:2px;height:3px;margin-bottom:6px;}
.score-bar{height:100%;border-radius:2px;transition:width .4s ease;}
.score-bar.win{background:var(--win);} .score-bar.opt{background:var(--violet);} .score-bar.part,.score-bar.go{background:var(--be);} .score-bar.af{background:var(--amber);}
.score-nums{display:flex;justify-content:space-between;font-size:.54rem;color:var(--t3);margin-bottom:7px;}
.score-msg{font-size:.63rem;color:var(--t2);line-height:1.65;padding:7px 10px;border-radius:var(--r);border-left:2px solid;}
.sm-win{border-color:var(--win);background:var(--win-d);} .sm-opt{border-color:var(--violet);background:var(--vio-d);} .sm-part{border-color:var(--be);background:var(--be-d);} .sm-af{border-color:var(--amber);background:var(--amb-d);} .sm-go{border-color:var(--t4);background:rgba(255,255,255,.01);}
.rec-row{display:flex;align-items:center;gap:7px;margin-top:8px;padding-top:7px;border-top:1px solid var(--border-lo);}
.rec-lbl{font-size:.52rem;color:var(--t3);}
.rec-dots{display:flex;gap:3px;}
.rec-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.04);border:1px solid var(--border);}
.rec-dot.f{background:var(--violet);border-color:var(--violet);}
.rec-note{font-size:.5rem;color:var(--t3);}

/* IF THEN */
.ifthen-strip{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--rl);margin-bottom:12px;overflow:hidden;}
.ifthen-strip-hdr{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;cursor:pointer;user-select:none;}
.ifthen-strip-hdr-l{display:flex;align-items:center;gap:7px;}
.ifthen-strip-hdr-ico{width:12px;height:12px;stroke:var(--t3);fill:none;stroke-width:1.4;stroke-linecap:round;}
.ifthen-strip-lbl{font-size:.55rem;letter-spacing:.12em;text-transform:uppercase;color:var(--t2);}
.ifthen-strip-body{display:none;padding:0 12px 12px;}
.ifthen-strip.open .ifthen-strip-body{display:block;}
.ifthen-strip.open .chevron2{transform:rotate(180deg);}
.chevron2{width:12px;height:12px;stroke:var(--t3);fill:none;stroke-width:1.4;stroke-linecap:round;transition:transform var(--tr);}
.strat-act-card{background:rgba(255,255,255,.018);border:1px solid var(--border-lo);border-radius:var(--r);padding:8px 10px;margin-bottom:5px;}
.strat-act-card.used{border-color:rgba(91,110,232,.22);background:var(--vio-d);}
.sa-trigger{font-size:.6rem;color:var(--t2);margin-bottom:2px;}
.sa-trigger em{font-style:italic;color:var(--t1);}
.sa-response{font-size:.58rem;color:var(--violet);margin-bottom:6px;}
.sa-ctrl{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.sa-activate{font-size:.52rem;padding:3px 8px;background:transparent;border:1px solid rgba(91,110,232,.22);color:var(--violet);border-radius:20px;cursor:pointer;font-family:var(--font);transition:all var(--tr);}
.sa-activate:hover{background:var(--vio-d);}
.sa-eff-lbl{font-size:.5rem;color:var(--t3);}
.eff-btns{display:flex;gap:2px;}
.eff-btn{width:22px;height:22px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--t3);font-family:var(--font);font-size:.5rem;cursor:pointer;transition:all var(--tr);}
.eff-btn.on{background:var(--vio-d);border-color:var(--violet);color:var(--violet);}
.sa-helped{font-size:.5rem;padding:2px 7px;border:1px solid var(--border);background:transparent;color:var(--t3);border-radius:20px;cursor:pointer;font-family:var(--font);transition:all var(--tr);}
.sa-helped.on{background:var(--win-d);border-color:rgba(91,110,232,.2);color:var(--win);}
.no-strat-note{font-size:.6rem;color:var(--t3);text-align:center;padding:12px;line-height:1.6;}

/* SI-ALORS PAGE */
.strat-lib-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;margin-bottom:5px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.strat-lib-body{flex:1;min-width:0;}
.strat-lib-trigger{font-size:.62rem;color:var(--t2);margin-bottom:2px;}
.strat-lib-trigger em{font-style:italic;color:var(--t1);}
.strat-lib-response{font-size:.6rem;color:var(--violet);}
.strat-lib-meta{font-size:.5rem;color:var(--t3);margin-top:4px;}
.strat-del{background:none;border:none;cursor:pointer;color:var(--t3);flex-shrink:0;display:flex;align-items:center;padding:3px;transition:color var(--tr);}
.strat-del:hover{color:var(--loss);}
.strat-del svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;}
.add-strat-form{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--rl);padding:13px;margin-top:12px;}
.add-strat-lbl{font-size:.52rem;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:5px;display:block;}
.strat-inp{width:100%;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:var(--r);padding:7px 9px;font-family:var(--font);font-size:.64rem;font-weight:300;color:var(--t1);outline:none;margin-bottom:8px;}
.strat-inp:focus{border-color:rgba(91,110,232,.24);}
.strat-add-btn{padding:6px 14px;background:var(--vio-d);border:1px solid rgba(91,110,232,.22);color:var(--violet);border-radius:20px;cursor:pointer;font-family:var(--font);font-size:.58rem;transition:all var(--tr);}
.explain-card{background:var(--bg-card);border:1px solid var(--border-lo);border-radius:var(--rl);padding:12px;margin-bottom:14px;}
.explain-title{font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:7px;}
.explain-txt{font-size:.64rem;line-height:1.72;color:var(--t2);}

/* HISTORY */
.frow{display:flex;gap:5px;margin-bottom:12px;}
.fbtn{font-size:.54rem;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--t3);cursor:pointer;font-family:var(--font);transition:all var(--tr);}
.fbtn.on{background:rgba(255,255,255,.04);border-color:rgba(230,232,238,.4);color:rgba(230,232,238,.92);}
.hcard{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;margin-bottom:5px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:border-color var(--tr);}
.hcard:hover{border-color:var(--border-hi);}
.hdate{font-size:.62rem;color:var(--t1);margin-bottom:2px;}
.hmeta{font-size:.52rem;color:var(--t3);display:flex;align-items:center;gap:6px;margin-bottom:3px;}
.hdot{width:4px;height:4px;border-radius:50%;flex-shrink:0;}
.hright{text-align:right;flex-shrink:0;}
.hpct{font-size:.74rem;font-weight:500;}

/* DASHBOARD */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:16px;}
.kpi-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);padding:10px;}
.kpi-lbl{font-size:.48rem;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:4px;}
.kpi-val{font-size:1.25rem;font-weight:500;color:var(--t1);line-height:1;margin-bottom:2px;}
.kpi-sub{font-size:.52rem;color:var(--t3);}

/* INSIGHT CARDS */
.ins-sec-lbl{font-size:.52rem;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);margin-bottom:7px;}
.ins-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--rl);padding:12px;margin-bottom:8px;}
.ins-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
.ins-title{font-size:.62rem;color:var(--t1);}
.ins-n{font-size:.5rem;color:var(--t4);}
.ins-txt{font-size:.63rem;line-height:1.72;color:var(--t2);margin-bottom:7px;}
.ins-bar-row{display:flex;gap:5px;align-items:center;margin-bottom:4px;}
.ib-lbl{font-size:.5rem;color:var(--t3);width:50px;text-align:right;flex-shrink:0;}
.ib-track{flex:1;background:rgba(255,255,255,.04);border-radius:2px;height:4px;}
.ib-fill{height:100%;border-radius:2px;transition:width .5s ease;}
.ib-val{font-size:.54rem;color:var(--t2);width:28px;flex-shrink:0;}
.ins-q{margin-top:9px;padding:7px 10px;background:linear-gradient(135deg,rgba(255,255,255,.035) 0%,transparent 100%);border-left:1px solid rgba(255,255,255,.16);border-radius:0 4px 4px 0;font-size:.59rem;font-style:italic;color:rgba(220,225,235,.7);line-height:1.65;}
.ins-q-auth{font-size:.5rem;color:rgba(190,196,210,.55);margin-top:3px;}
.tag-chips{display:flex;flex-wrap:wrap;gap:4px;margin:5px 0;}
.tc-win{font-size:.54rem;padding:2px 7px;border-radius:20px;background:rgba(255,255,255,.05);color:rgba(230,232,238,.85);border:1px solid rgba(230,232,238,.18);}
/* tc-loss : ambre désaturé — signal "à travailler" sans agressivité (jamais de rouge) */
.tc-loss{font-size:.54rem;padding:2px 7px;border-radius:20px;background:rgba(195,150,90,.06);color:rgba(210,180,140,.82);border:1px solid rgba(195,150,90,.24);}
.tc-loss::before{content:"○ ";color:rgba(195,150,90,.55);font-size:.5rem;letter-spacing:0;margin-right:1px;}
.tc-cnt{opacity:.5;}

/* PATTERN MAP */
.pmap{display:flex;flex-direction:column;gap:5px;}
.pmap-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.pmap-node{padding:4px 8px;border-radius:var(--r);font-size:.54rem;flex-shrink:0;}
.pmap-cause{background:rgba(255,255,255,.03);border:1px solid var(--border);color:var(--t2);}
.pmap-arrow{font-size:.6rem;color:var(--t4);}
.pmap-eff-pos{background:var(--win-d);border:1px solid rgba(91,110,232,.14);color:var(--win);}
.pmap-eff-neg{background:var(--loss-d);border:1px solid rgba(150,158,172,.1);color:rgba(215,130,110,.72);}
.pmap-pct{font-size:.5rem;color:var(--t3);padding:2px 6px;background:rgba(255,255,255,.03);border-radius:20px;}

/* DONUT CHART */
/* v3.13 — Donut compact, aéré, aligné avec le reste du dashboard */
.donut-wrap{display:flex;gap:22px;align-items:center;padding:4px 0 6px;}
.donut-wrap svg{max-width:110px;flex-shrink:0;}
.donut-legend{display:flex;flex-direction:column;gap:7px;flex:1;font-size:.58rem;}
.donut-legend .dl-item{display:flex;align-items:center;gap:8px;color:var(--t2);transition:color 160ms ease;}
.donut-legend .dl-item:hover{color:var(--t1);}
.donut-legend .dl-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
.donut-legend .dl-val{margin-left:auto;color:var(--t1);font-variant-numeric:tabular-nums;letter-spacing:.04em;}
.dl-item{display:flex;align-items:center;gap:5px;font-size:.52rem;color:var(--t2);}
.dl-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.dl-val{font-size:.5rem;color:var(--t3);margin-left:auto;}

/* IMPACT DIST */
.imp-bar{margin-bottom:7px;}
.imp-bar-hdr{display:flex;justify-content:space-between;margin-bottom:3px;}
.imp-bar-lbl{font-size:.54rem;color:var(--t2);}
.imp-bar-val{font-size:.52rem;color:var(--t3);}
.imp-bar-track{background:rgba(255,255,255,.04);border-radius:2px;height:4px;}
.imp-bar-fill{height:100%;border-radius:2px;transition:width .5s;}

/* CALENDAR */
.cal-wrap{margin-bottom:16px;}
.cal-lbl{font-size:.52rem;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);margin-bottom:8px;}
.cal-grid{display:flex;gap:3px;flex-wrap:wrap;}
.ccell{width:23px;height:23px;border-radius:4px;cursor:pointer;transition:opacity var(--tr);border:1px solid transparent;}

/* Barres verticales du score — alignées 1:1 avec le calendrier au-dessus */
.score-bars{display:grid;grid-template-columns:repeat(30,1fr);gap:2px;width:100%;height:54px;margin-top:6px;align-items:end;}
.sb-col{height:100%;display:flex;align-items:flex-end;justify-content:center;}
.sb-fill{width:100%;border-radius:2px 2px 1px 1px;background:linear-gradient(180deg,rgba(230,232,238,.62) 0%,rgba(230,232,238,.18) 100%);transition:filter 180ms ease,height 320ms cubic-bezier(.25,.65,.3,1);min-height:3px;}
.sb-fill.on{background:linear-gradient(180deg,rgba(90,158,122,.88) 0%,rgba(90,158,122,.28) 100%);}
.sb-col:hover .sb-fill{filter:brightness(1.25);}
.sb-empty{width:100%;height:3px;background:rgba(255,255,255,.04);border-radius:1px;align-self:flex-end;}
.ccell:hover{opacity:.75;}
.ccell.empty{background:rgba(255,255,255,.024);border-color:var(--border-lo);}
/* v3.13 — calendrier neutralisé : blanc/doré (jamais de violet) */
.ccell.winning{background:rgba(230,232,238,.22);} .ccell.optimized{background:rgba(210,180,120,.22);} .ccell.partial{background:rgba(195,150,90,.18);} .ccell.ongoing{background:rgba(255,255,255,.05);}
.ccell.istoday{border-color:var(--border-hi) !important;}
.cal-leg{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;}
.cl-item{display:flex;align-items:center;gap:4px;}
.cl-dot{width:7px;height:7px;border-radius:2px;}
.cl-txt{font-size:.48rem;color:var(--t3);}

/* SPARKLINE */
.spark-wrap{margin-bottom:16px;}
.spark-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
.spark-lbl{font-size:.52rem;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);}
.spark-cur{font-size:.64rem;color:rgba(230,232,238,.85);}

/* OVERLAY */
.overlay{position:fixed;inset:0;z-index:200;background:rgba(2,3,9,.97);display:none;flex-direction:column;animation:ov-in .16s ease;}
.overlay.open{display:flex;}
@keyframes ov-in{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.ov-hdr{display:flex;align-items:center;justify-content:space-between;padding:0 14px;height:50px;border-bottom:1px solid var(--border);background:rgba(8,10,15,.98);flex-shrink:0;}
.ov-title{font-size:.6rem;letter-spacing:.1em;color:var(--t2);}
.ov-close{background:none;border:none;cursor:pointer;color:var(--t3);display:flex;align-items:center;}
.ov-close svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;}
.ov-body{flex:1;overflow-y:auto;padding:14px;max-width:680px;margin:0 auto;width:100%;}

/* MISC */
.toast{position:fixed;bottom:68px;left:50%;transform:translateX(-50%) translateY(8px);background:rgba(10,13,22,.97);border:1px solid var(--border-hi);border-radius:20px;padding:6px 14px;font-size:.58rem;color:var(--t1);z-index:300;opacity:0;transition:all .18s ease;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.demo-bar{background:rgba(91,110,232,.05);border:1px solid rgba(91,110,232,.1);border-radius:var(--r);padding:6px 10px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.demo-txt{font-size:.54rem;color:var(--t3);}
.demo-rst{font-size:.54rem;color:var(--loss);background:none;border:none;cursor:pointer;font-family:var(--font);text-decoration:underline;}
.empty-st{text-align:center;padding:36px 20px;color:var(--t3);font-size:.6rem;line-height:1.9;}
.sec-title{font-size:.52rem;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);margin-bottom:6px;}
.section-sep{height:1px;background:var(--border-lo);margin:14px 0;}
.pgrav-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--rl);padding:14px 12px;margin-bottom:8px;}
.pgrav-sub{font-size:.52rem;color:var(--t3);letter-spacing:.04em;margin-bottom:6px;}
.pgrav-leg{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;}
.pgrav-ins{border-top:1px solid var(--border-lo);margin-top:10px;padding-top:9px;}
.pgrav-ins-line{font-size:.6rem;color:var(--t2);line-height:1.7;margin-bottom:5px;padding-left:10px;position:relative;}
.pgrav-ins-line::before{content:'·';color:var(--t3);position:absolute;left:0;}
/* Map tooltip */
.cmap-tt{background:rgba(6,8,16,.97);border:1px solid rgba(255,255,255,.07);border-radius:6px;padding:9px 11px;font-family:var(--font);font-size:.58rem;color:var(--t1);line-height:1.6;max-width:260px;margin:6px auto 0;display:none;backdrop-filter:blur(8px);}
.cmap-tt.show{display:block;}
.cmap-tt-lbl{font-size:.6rem;color:var(--t1);margin-bottom:2px;}
.cmap-tt-short{font-size:.54rem;color:var(--violet);margin-bottom:5px;}
.cmap-tt-full{font-size:.56rem;color:var(--t3);}
/* Map legend collapsible */
.pgrav-leg-wrap{margin-top:8px;}
.pgrav-leg-toggle{background:none;border:none;color:var(--t3);font-family:var(--font);font-size:.54rem;letter-spacing:.06em;cursor:pointer;padding:0;display:flex;align-items:center;gap:4px;}
.pgrav-leg-toggle:hover{color:var(--t2);}
.pgrav-leg-body{display:none;margin-top:7px;font-size:.57rem;color:var(--t3);line-height:1.7;border-top:1px solid var(--border-lo);padding-top:7px;}
.pgrav-leg-body.open{display:block;}
/* Depth system */
.depth-1{filter:drop-shadow(0 0 6px rgba(255,255,255,.3));}
.depth-2{filter:drop-shadow(0 0 3px rgba(255,255,255,.18));}
.depth-3{opacity:.75;}
.depth-4{opacity:.42;filter:blur(.4px);}
/* Timeline */
.tl-toggles{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
.tl-tog{background:none;border:1px solid var(--border);border-radius:3px;padding:3px 8px;font-family:var(--font);font-size:.52rem;color:var(--t4);cursor:pointer;letter-spacing:.05em;transition:color .15s,border-color .15s;}
.tl-tog.on{color:var(--mc,var(--t2));}
.tl-tt{background:rgba(6,8,16,.97);border:1px solid rgba(255,255,255,.07);border-radius:6px;padding:9px 11px;font-family:var(--font);margin-top:8px;backdrop-filter:blur(8px);}
/* Cognitive map: STATIC by /autoplan principle — no pulsing nodes, no orbital floating. */
@keyframes qBr{0%,100%{opacity:.88;transform:translateY(0)}50%{opacity:1;transform:translateY(-2.5px)}}
@media (prefers-reduced-motion: no-preference){
  .qs{animation:qBr 14s ease-in-out infinite;transform-origin:center;}
}
/* Neon flow utility */
.neon-flow{transition:all 220ms ease;}
.neon-flow:hover,.neon-flow:active{transform:translateY(-1px) scale(1.012);filter:var(--glow-v);}
/* Cognitive map node hover */
/* Cognitive map — monochrome au repos, glow révélateur au hover (v3.8.4) */
.cog-nd{cursor:pointer;transition:filter 260ms ease;}
.cog-nd[data-active="0"]{pointer-events:auto;}
.cog-nd[data-active="1"][data-tint="cool"]:hover{filter:drop-shadow(0 0 6px rgba(91,110,232,.55)) drop-shadow(0 0 14px rgba(91,110,232,.22)) brightness(1.12);}
.cog-nd[data-active="1"][data-tint="warm"]:hover{filter:drop-shadow(0 0 6px rgba(210,120,80,.55)) drop-shadow(0 0 14px rgba(210,120,80,.22)) brightness(1.12);}
.cog-nd[data-active="1"][data-tint="neutral"]:hover{filter:drop-shadow(0 0 6px rgba(255,255,255,.35)) brightness(1.15);}
.cog-nd[data-active="0"]:hover{filter:brightness(1.18);}
/* Antifragile ring chauffe à l'orange au hover du parent */
.cog-nd[data-tint="warm"]:hover .af-ring{stroke:rgba(210,120,80,.85);transition:stroke 260ms ease;}
.ccore{cursor:pointer;transition:filter 200ms ease;}
.ccore:hover{filter:brightness(1.1);}
/* Insight card subtle hover */
.ins-card{transition:border-color 200ms ease;}
.ins-card:hover{border-color:rgba(91,110,232,.08);}
/* Dashboard layout — hierarchy */
.dash-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.dash-row.main{grid-template-columns:1.2fr .8fr;}
@media(max-width:640px){.dash-row,.dash-row.main{grid-template-columns:1fr;}}
/* KPI strip compact */
.kpi-strip{display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap;}
.kpi-pill{flex:1;min-width:68px;background:var(--bg-card);border:1px solid var(--border-lo);border-radius:var(--r);padding:6px 8px;text-align:center;}
.kpi-pill-val{font-size:.82rem;color:var(--t1);line-height:1.1;}
.kpi-pill-lbl{font-size:.48rem;color:var(--t4);margin-top:2px;letter-spacing:.08em;text-transform:uppercase;}
/* Dashboard quote card */
.dash-quote{background:linear-gradient(140deg,rgba(255,255,255,.05) 0%,rgba(8,10,15,.96) 100%);border:1px solid rgba(255,255,255,.12);border-left:2px solid rgba(255,255,255,.28);border-radius:var(--rl);padding:18px 16px 14px;position:relative;overflow:hidden;min-height:130px;display:flex;flex-direction:column;justify-content:space-between;transition:border-color 220ms ease,box-shadow 220ms ease;box-shadow:0 0 40px -20px rgba(255,255,255,.06);}
.dash-quote:hover{border-color:rgba(255,255,255,.24);box-shadow:0 0 56px -20px rgba(255,255,255,.14);}
.dash-quote::after{content:'';position:absolute;top:-30px;right:-30px;width:140px;height:140px;background:radial-gradient(circle,rgba(255,255,255,.05) 0%,transparent 70%);pointer-events:none;}
.dq-mark{font-size:3.4rem;line-height:1;color:rgba(210,214,222,.32);font-family:Georgia,serif;position:absolute;top:4px;left:12px;user-select:none;}
.dq-body{padding-left:2px;margin-top:18px;flex:1;}
.dq-text{font-size:.82rem;line-height:1.8;color:rgba(228,232,242,.94);font-style:italic;font-weight:300;}
.dq-author{font-size:.62rem;color:rgba(180,188,200,.78);margin-top:9px;letter-spacing:.04em;}
.dq-pattern{font-size:.48rem;color:var(--t4);margin-top:3px;letter-spacing:.08em;text-transform:uppercase;border-top:1px solid var(--border-lo);padding-top:5px;}
/* Pattern mini-cards */
.patt-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
/* Patterns mentaux — ambre désaturé en accord avec le reste du dashboard (v3.16) */
.patt-card{background:var(--bg-card);border:1px solid var(--border-lo);border-radius:var(--r);padding:10px;transition:border-color 200ms ease;}
.patt-card:hover{border-color:rgba(195,150,90,.16);}
/* v3.17b — pictos Patterns mentaux uniformes en gris (plus d'ambre). */
.patt-icon{width:21px;height:21px;margin-bottom:6px;display:block;stroke:rgba(230,232,238,.6);opacity:.92;}
.patt-lbl{font-size:.58rem;color:var(--t2);line-height:1.45;margin-bottom:3px;}
.patt-val{font-size:.74rem;color:rgba(225,210,180,.86);margin-bottom:5px;letter-spacing:.01em;}
.patt-bar-wrap{height:3px;background:rgba(255,255,255,.04);border-radius:2px;margin-bottom:5px;overflow:hidden;}
.patt-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,rgba(195,150,90,.2),rgba(195,150,90,.55)) !important;}
.patt-sub{font-size:.52rem;color:var(--t3);line-height:1.5;}
/* Cognitive card — height dictated by content (was min-height:380px) */
.cognitive-dash{min-height:0;}
/* Timeline dots */
.tl-dot{pointer-events:none;}

/* ============================================================
   V3.1 — Action-first hierarchy (P0)
============================================================ */
/* Pattern strip — Level 2, sits above MIT when a pattern is detected */
.pattern-strip{display:flex;align-items:center;gap:8px;padding:7px 11px;margin-bottom:10px;background:rgba(91,110,232,.025);border:1px solid var(--border-lo);border-left:2px solid rgba(91,110,232,.28);border-radius:0 var(--r) var(--r) 0;font-size:.56rem;color:var(--t2);letter-spacing:.04em;}
.pattern-strip-lbl{font-size:.48rem;color:var(--t3);letter-spacing:.14em;text-transform:uppercase;}
.pattern-strip-val{color:var(--t1);}

/* MIT hero — the Level-1 action surface */
.mit-hero{background:linear-gradient(180deg,rgba(91,110,232,.045) 0%,var(--bg-card) 90%);border:1px solid rgba(91,110,232,.14);border-radius:var(--rl);padding:14px 14px 12px;margin-bottom:14px;position:relative;transition:border-color 300ms ease,box-shadow 300ms ease;}
.mit-hero[data-friction="medium"]{border-color:rgba(255,255,255,.16);box-shadow:0 0 60px -32px rgba(255,255,255,.22);}
.mit-hero[data-friction="high"]{border-color:rgba(255,255,255,.22);box-shadow:0 0 80px -28px rgba(255,255,255,.32),0 0 24px -12px rgba(200,210,255,.12);}
.mit-hero-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;}
.mit-hero-lbl{font-size:.5rem;letter-spacing:.16em;text-transform:uppercase;color:var(--t3);}
.mit-hero-date{font-size:.5rem;color:var(--t4);letter-spacing:.04em;}
.mit-hero-empty{padding:14px 4px 8px;text-align:left;cursor:pointer;}
.mit-hero-empty-q{font-size:.78rem;color:var(--t1);line-height:1.5;margin-bottom:6px;}
.mit-hero-empty-sub{font-size:.55rem;color:var(--t3);line-height:1.55;}

/* ════════════════════════════════════════════════════════════
   Guided Brain Dump — modal flow (v3.11)
   Sober, dark, mobile-first. No emojis. Subtle animations.
════════════════════════════════════════════════════════════ */
.guided-overlay{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.66);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center;padding:0;animation:guided-fadein .32s ease;}
.guided-overlay.open{display:flex;}
@media(min-width:540px){.guided-overlay{align-items:center;padding:24px;}}
.guided-modal{width:100%;max-width:520px;background:#16191f;border:1px solid rgba(255,255,255,.08);border-radius:18px 18px 0 0;padding:22px 20px 26px;box-shadow:0 -8px 60px -20px rgba(255,255,255,.06),0 -24px 80px -40px rgba(0,0,0,.6);position:relative;max-height:92vh;overflow-y:auto;animation:guided-slide .42s cubic-bezier(.2,.7,.3,1);}
@media(min-width:540px){.guided-modal{border-radius:14px;padding:26px 24px 28px;}}
@keyframes guided-fadein{from{opacity:0}to{opacity:1}}
@keyframes guided-slide{from{transform:translateY(28px);opacity:0}to{transform:translateY(0);opacity:1}}
.guided-close{position:absolute;top:14px;right:14px;width:24px;height:24px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--t3);cursor:pointer;font-family:var(--font);font-size:.7rem;line-height:1;display:flex;align-items:center;justify-content:center;transition:all 180ms ease;}
.guided-close:hover{color:var(--t1);border-color:var(--border-hi);}
.guided-eyebrow{font-size:.5rem;letter-spacing:.16em;text-transform:uppercase;color:var(--t3);margin-bottom:10px;}
.guided-title{font-size:.94rem;color:rgba(235,238,245,.92);line-height:1.42;margin-bottom:8px;font-weight:400;}
.guided-sub{font-size:.64rem;color:var(--t2);line-height:1.65;margin-bottom:18px;}
.guided-input-row{display:flex;gap:8px;margin-bottom:10px;}
.guided-input{flex:1;background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:8px;padding:11px 13px;font-family:var(--font);font-size:.72rem;color:rgba(235,238,245,.92);font-weight:300;transition:border-color 180ms ease;}
.guided-input:focus{outline:none;border-color:rgba(235,238,245,.32);background:rgba(255,255,255,.04);}
.guided-input::placeholder{color:var(--t4);font-style:italic;}
.guided-add-btn{padding:0 14px;border-radius:8px;border:1px solid rgba(235,238,245,.22);background:rgba(255,255,255,.04);color:rgba(235,238,245,.88);font-family:var(--font);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:all 180ms ease;}
.guided-add-btn:hover{background:rgba(255,255,255,.08);border-color:rgba(235,238,245,.36);}
.guided-drafts{display:flex;flex-direction:column;gap:5px;margin-bottom:18px;max-height:32vh;overflow-y:auto;padding-right:3px;}
.guided-task-row{display:flex;align-items:center;gap:10px;padding:9px 12px;background:rgba(255,255,255,.025);border:1px solid var(--border-lo);border-radius:7px;font-size:.66rem;color:var(--t1);animation:guided-row-in .26s ease;}
@keyframes guided-row-in{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}
.guided-task-row-idx{font-size:.5rem;color:var(--t4);min-width:14px;text-align:right;letter-spacing:.04em;}
.guided-task-row-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.guided-task-row-del{background:none;border:none;color:var(--t4);cursor:pointer;padding:2px 4px;font-family:var(--font);font-size:.7rem;line-height:1;transition:color 160ms ease;}
.guided-task-row-del:hover{color:rgba(195,150,90,.8);}
.guided-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
.guided-btn{flex:1;min-width:90px;padding:11px 14px;font-family:var(--font);font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;border-radius:8px;cursor:pointer;transition:all 180ms ease;border:1px solid var(--border);background:transparent;color:var(--t2);}
.guided-btn:hover{border-color:rgba(235,238,245,.28);color:var(--t1);}
.guided-btn.primary{background:rgba(235,238,245,.08);border-color:rgba(235,238,245,.32);color:rgba(235,238,245,.94);}
.guided-btn.primary:hover{background:rgba(235,238,245,.14);border-color:rgba(235,238,245,.48);}
.guided-btn.ghost{flex:0 0 auto;background:transparent;border:none;color:var(--t3);padding:11px 8px;}
.guided-btn.ghost:hover{color:var(--t2);}
.guided-progress{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:.5rem;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);}
.guided-progress-bar{flex:1;height:2px;background:rgba(255,255,255,.05);border-radius:1px;overflow:hidden;}
.guided-progress-fill{height:100%;background:rgba(235,238,245,.4);transition:width 280ms ease;}

/* Step 2 — clarification chips */
.guided-clarify-task{background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:9px;padding:13px 14px;margin-bottom:14px;}
.guided-clarify-title{font-size:.78rem;color:rgba(235,238,245,.94);line-height:1.4;margin-bottom:13px;}
.guided-chip-group{margin-bottom:14px;}
.guided-chip-lbl{font-size:.5rem;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline;}
.guided-chip-lbl-val{color:var(--t1);text-transform:none;letter-spacing:0;font-size:.58rem;}
.guided-chips{display:flex;gap:5px;flex-wrap:wrap;}
.guided-chip{flex:1;min-width:62px;padding:9px 8px;font-family:var(--font);font-size:.56rem;color:var(--t3);background:transparent;border:1px solid var(--border);border-radius:7px;cursor:pointer;transition:all 160ms ease;text-align:center;}
.guided-chip:hover{border-color:var(--border-hi);color:var(--t2);}
.guided-chip.on{background:rgba(235,238,245,.06);border-color:rgba(235,238,245,.36);color:rgba(235,238,245,.94);}
.guided-chip-sub{display:block;font-size:.46rem;color:var(--t4);margin-top:2px;letter-spacing:.04em;}

/* Step 3 — MIT choice list */
.guided-mit-help{font-size:.58rem;color:var(--t3);line-height:1.6;margin-bottom:12px;font-style:italic;}
.guided-mit-list{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;max-height:46vh;overflow-y:auto;padding-right:3px;}
.guided-mit-card{display:flex;align-items:center;gap:11px;padding:11px 13px;background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:9px;cursor:pointer;transition:all 180ms ease;text-align:left;}
.guided-mit-card:hover{background:rgba(255,255,255,.05);border-color:rgba(235,238,245,.24);}
.guided-mit-card.top{border-color:rgba(235,238,245,.22);background:rgba(235,238,245,.04);box-shadow:0 0 24px -12px rgba(255,255,255,.18);}
.guided-mit-body{flex:1;min-width:0;}
.guided-mit-title{font-size:.7rem;color:var(--t1);line-height:1.4;margin-bottom:4px;}
.guided-mit-meta{font-size:.5rem;color:var(--t3);letter-spacing:.04em;display:flex;gap:10px;flex-wrap:wrap;}
.guided-mit-score{font-size:.64rem;color:rgba(235,238,245,.85);font-variant-numeric:tabular-nums;padding:4px 9px;border-radius:6px;border:1px solid var(--border-hi);background:rgba(255,255,255,.03);letter-spacing:.04em;}
.guided-mit-card.top .guided-mit-score{color:rgba(235,238,245,.96);border-color:rgba(235,238,245,.32);}

/* Step 4 — mood quick check */
.guided-mood-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;font-size:.62rem;color:var(--t2);}
.guided-mood-lbl{color:var(--t2);}
.guided-mood-btns{display:flex;gap:4px;}
.guided-mood-btn{width:27px;height:27px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--t3);font-family:var(--font);font-size:.58rem;cursor:pointer;transition:all 160ms ease;}
.guided-mood-btn.on{background:rgba(235,238,245,.06);border-color:rgba(235,238,245,.42);color:rgba(235,238,245,.94);}

/* Intro pill in Today (the "Clarifier ta journée ?" prompt) */
.guided-invite{background:linear-gradient(135deg,rgba(255,255,255,.04),rgba(8,10,15,.96));border:1px solid rgba(255,255,255,.12);border-left:2px solid rgba(255,255,255,.32);border-radius:var(--rl);padding:13px 14px;margin-bottom:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;animation:guided-row-in .4s ease;}
.guided-invite-text{flex:1;min-width:140px;}
.guided-invite-q{font-size:.7rem;color:rgba(235,238,245,.88);line-height:1.45;}
.guided-invite-sub{font-size:.52rem;color:var(--t3);margin-top:3px;letter-spacing:.04em;}
.guided-invite-actions{display:flex;gap:6px;}
.guided-invite-btn{padding:7px 12px;font-family:var(--font);font-size:.52rem;letter-spacing:.1em;text-transform:uppercase;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--t2);cursor:pointer;transition:all 160ms ease;}
.guided-invite-btn:hover{color:var(--t1);border-color:rgba(235,238,245,.28);}
.guided-invite-btn.primary{background:rgba(235,238,245,.06);border-color:rgba(235,238,245,.3);color:rgba(235,238,245,.94);}
.guided-invite-btn.primary:hover{background:rgba(235,238,245,.12);}

/* Permanent "Clarifier" link */
.guided-trigger-link{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--border);border-radius:20px;padding:5px 11px;font-family:var(--font);font-size:.52rem;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);cursor:pointer;transition:all 160ms ease;}
.guided-trigger-link:hover{color:var(--t1);border-color:rgba(235,238,245,.28);}

/* Friction signal — single line under MIT, only when friction detected */
.friction-line{margin-top:11px;padding-top:9px;border-top:1px solid var(--border-lo);font-size:.58rem;color:var(--t2);line-height:1.6;letter-spacing:.02em;}
.friction-line strong{color:rgba(190,140,90,.85);font-weight:300;}
.friction-line.high strong{color:rgba(195,150,90,.82);}

/* Suggested If-Then plan — appears inline when friction is high */
.friction-plan{margin-top:8px;padding:8px 10px;background:rgba(91,110,232,.04);border:1px solid rgba(91,110,232,.14);border-radius:var(--r);}
.friction-plan-trig{font-size:.56rem;color:var(--t2);margin-bottom:3px;}
.friction-plan-trig em{color:var(--t1);font-style:italic;}
.friction-plan-resp{font-size:.6rem;color:var(--violet);margin-bottom:6px;line-height:1.5;}
.friction-plan-cta{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;font-family:var(--font);font-size:.5rem;letter-spacing:.12em;text-transform:uppercase;color:var(--violet);background:transparent;border:1px solid rgba(91,110,232,.28);border-radius:20px;cursor:pointer;transition:all 180ms ease;}
.friction-plan-cta:hover{background:var(--vio-d);border-color:rgba(91,110,232,.5);}

/* v3.17f — Choisir un autre plan dans la bibliothèque (depuis Today) */
.ifthen-other{margin-top:10px;}
.ifthen-other summary{font-size:.54rem;letter-spacing:.06em;color:var(--t3);cursor:pointer;padding:4px 0;list-style:none;display:inline-flex;align-items:center;gap:6px;transition:color 160ms ease;}
.ifthen-other summary::-webkit-details-marker{display:none;}
.ifthen-other summary::before{content:'+';display:inline-block;width:14px;height:14px;line-height:13px;text-align:center;border:1px solid var(--border-hi);border-radius:50%;font-size:.62rem;color:var(--t2);transition:transform 180ms ease;}
.ifthen-other[open] summary::before{content:'−';}
.ifthen-other summary:hover{color:var(--t1);}
.ifthen-other-list{margin-top:8px;display:flex;flex-direction:column;gap:6px;}
.ifthen-other-item{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:8px 10px;background:rgba(255,255,255,.02);border:1px solid var(--border-lo);border-radius:var(--r);transition:border-color 180ms ease;}
.ifthen-other-item:hover{border-color:rgba(91,110,232,.22);}
.ifthen-other-text{flex:1;min-width:0;}
.ifthen-other-trig{font-size:.54rem;color:var(--t2);line-height:1.4;}
.ifthen-other-trig em{color:var(--t1);font-style:italic;}
.ifthen-other-resp{font-size:.55rem;color:var(--violet);line-height:1.45;margin-top:3px;}
.ifthen-other-cta{flex-shrink:0;background:transparent;border:1px solid var(--border-hi);color:var(--t2);font-family:var(--font);font-size:.5rem;letter-spacing:.08em;padding:5px 10px;border-radius:14px;cursor:pointer;transition:all 180ms ease;}
.ifthen-other-cta:hover{border-color:rgba(91,110,232,.45);color:var(--violet);background:rgba(91,110,232,.05);}

/* Primary action CTA — one per view, attached to MIT */
.mit-cta-row{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border-lo);}
.mit-cta{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;font-family:var(--font);font-size:.54rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(220,222,235,.92);background:rgba(91,110,232,.14);border:1px solid rgba(91,110,232,.32);border-radius:var(--r);cursor:pointer;transition:all 200ms ease;}
.mit-cta:hover{background:rgba(91,110,232,.22);border-color:rgba(91,110,232,.52);}
.mit-cta svg{width:9px;height:9px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;}
.mit-cta-note{font-size:.5rem;color:var(--t3);letter-spacing:.04em;}

/* Compact mood — 2 quick rows always visible, rest behind toggle */
.mood-compact{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--rl);padding:10px 12px;margin-bottom:12px;}
.mood-compact-hdr{display:flex;align-items:center;gap:7px;margin-bottom:8px;}
.mood-compact-hdr-lbl{font-size:.52rem;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);}
.mood-quick-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;}
.mood-quick-lbl{font-size:.56rem;color:var(--t2);}
.mood-more-toggle{margin-top:8px;padding-top:8px;border-top:1px solid var(--border-lo);background:none;border:none;color:var(--t3);font-family:var(--font);font-size:.5rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:5px;width:100%;justify-content:space-between;}
.mood-more-toggle:hover{color:var(--t2);}
.mood-more{display:none;padding-top:8px;}
.mood-compact.open .mood-more{display:block;}
.mood-compact.open .mood-more-toggle .chevron{transform:rotate(180deg);}

/* Quote footer — demoted from top to bottom */
.quote-footer{margin-top:20px;padding:14px 14px 12px;border-top:1px solid var(--border);background:linear-gradient(180deg,transparent,rgba(91,110,232,.04));border-radius:0 0 var(--rl) var(--rl);font-size:.7rem;line-height:1.75;color:rgba(225,230,240,.78);font-style:italic;text-align:center;}
.quote-footer-auth{display:block;margin-top:6px;color:rgba(155,170,220,.65);font-style:normal;font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;}

/* Analytics segmented bar — Activité vs impact (v3.9) */
.seg-bar{display:flex;height:8px;border-radius:3px;overflow:hidden;background:rgba(255,255,255,.04);margin:10px 0 6px;}
.seg-bar-cell{position:relative;transition:filter 220ms ease,opacity 220ms ease;}
/* v3.17 — dégradé inter-segments continu (Fort clair → Moyen mid → Faible ambre).
   Les couleurs de fin de chaque segment matchent les couleurs de début du suivant
   pour effacer visuellement les frontières. */
.seg-bar-cell.high{background:linear-gradient(90deg,rgba(230,232,238,.78) 0%,rgba(190,196,210,.7) 100%);}
.seg-bar-cell.mid {background:linear-gradient(90deg,rgba(190,196,210,.7) 0%,rgba(195,160,110,.62) 100%);}
.seg-bar-cell.low {background:linear-gradient(90deg,rgba(195,160,110,.62) 0%,rgba(205,160,95,.92) 100%);}
.seg-bar-cell:hover{filter:brightness(1.15);}
.seg-legend{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:6px;font-family:var(--font);font-size:.54rem;letter-spacing:.04em;}
.seg-legend-item{display:flex;align-items:center;gap:5px;color:var(--t2);}
.seg-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
.seg-dot.high{background:rgba(220,224,232,.88);}
.seg-dot.mid {background:rgba(145,152,164,.78);}
.seg-dot.low {background:rgba(195,150,90,.82);}
.seg-pct{color:var(--t3);margin-left:auto;font-variant-numeric:tabular-nums;}

/* Patterns comparison cards — high vs low state with delta (v3.9) */
.pcomp{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--rl);padding:11px 12px;margin-bottom:6px;transition:border-color 200ms ease;}
.pcomp:hover{border-color:rgba(255,255,255,.14);}
.pcomp-hdr{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.pcomp-title{font-size:.66rem;color:var(--t1);letter-spacing:.02em;}
.pcomp-n{margin-left:auto;font-size:.5rem;color:var(--t4);letter-spacing:.06em;}
.pcomp-delta{font-size:.5rem;padding:1px 6px;border-radius:10px;letter-spacing:.04em;font-variant-numeric:tabular-nums;border:1px solid var(--border-hi);background:rgba(255,255,255,.03);color:var(--t2);}
.pcomp-delta.pos{color:rgba(235,238,245,.92);border-color:rgba(235,238,245,.32);background:rgba(235,238,245,.06);}
.pcomp-delta.neg{color:rgba(210,180,120,.92);border-color:rgba(195,150,90,.34);background:rgba(195,150,90,.06);}
.pcomp-rows{display:flex;flex-direction:column;gap:4px;margin-top:5px;}
.pcomp-row{display:grid;grid-template-columns:54px 1fr 38px;align-items:center;gap:8px;font-size:.54rem;color:var(--t3);letter-spacing:.04em;}
.pcomp-row-lbl{text-transform:uppercase;letter-spacing:.1em;color:var(--t4);}
.pcomp-row-track{height:5px;border-radius:2px;background:rgba(255,255,255,.04);overflow:hidden;}
.pcomp-row-fill{height:100%;transition:filter 200ms ease;}
.pcomp[data-tint="cool"] .pcomp-row.high .pcomp-row-fill{background:linear-gradient(90deg,rgba(210,214,222,.32),rgba(235,238,245,.6));}
.pcomp[data-tint="cool"] .pcomp-row.low  .pcomp-row-fill{background:rgba(210,214,222,.22);}
.pcomp[data-tint="warm"] .pcomp-row.high .pcomp-row-fill{background:linear-gradient(90deg,rgba(210,214,222,.35),rgba(195,150,90,.7));}
.pcomp[data-tint="warm"] .pcomp-row.low  .pcomp-row-fill{background:rgba(210,214,222,.22);}
.pcomp-row-val{text-align:right;color:var(--t2);font-variant-numeric:tabular-nums;}
.pcomp-row.high .pcomp-row-val{color:var(--t1);}
.pcomp-insight{font-size:.55rem;color:var(--t2);line-height:1.55;margin-top:7px;letter-spacing:.02em;}
.pcomp-insight strong{color:var(--t1);font-weight:500;}

/* If-Then autonomous section (v3.7) — separated from MIT-hero */
.ifthen-section{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--rl);padding:12px 14px;margin-bottom:14px;}
.ifthen-section-hdr{display:flex;align-items:center;gap:7px;margin-bottom:10px;}
.ifthen-section-hdr svg{width:11px;height:11px;stroke:var(--t3);}
.ifthen-section-lbl{font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--t2);}
.ifthen-count-pill{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:.5rem;padding:2px 4px 2px 9px;border-radius:20px;background:rgba(255,255,255,.04);color:var(--t1);border:1px solid rgba(230,232,238,.18);letter-spacing:.02em;}
.ifthen-count-pill strong{font-weight:500;}
.ifthen-undo{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;border:1px solid var(--border-hi);background:transparent;color:var(--t2);font-family:var(--font);font-size:.7rem;line-height:1;cursor:pointer;padding:0;transition:all 160ms ease;margin-left:2px;}
.ifthen-undo:hover{border-color:rgba(195,150,90,.5);color:rgba(195,150,90,.92);background:rgba(195,150,90,.06);}
.ifthen-empty{font-size:.58rem;color:var(--t3);line-height:1.6;padding:6px 0;font-style:italic;}

/* Info bubbles — discreet rule reminders per section (v3.6) */
.info-bubble{position:relative;display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border-radius:50%;border:1px solid var(--border-hi);background:transparent;color:var(--t3);font-family:var(--font);font-size:.5rem;cursor:help;margin-left:6px;transition:color 160ms ease,border-color 160ms ease;flex-shrink:0;vertical-align:middle;}
.info-bubble:hover,.info-bubble:focus{color:var(--t1);border-color:rgba(255,255,255,.22);outline:none;}
.info-bubble[data-tip]:hover::after,.info-bubble[data-tip]:focus::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);background:rgba(8,10,15,.97);border:1px solid var(--border-hi);border-radius:4px;padding:7px 10px;font-size:.58rem;line-height:1.55;font-family:var(--font);font-style:normal;color:rgba(228,232,242,.86);white-space:normal;width:max-content;max-width:220px;text-align:left;letter-spacing:0;text-transform:none;z-index:50;pointer-events:none;box-shadow:0 4px 18px rgba(0,0,0,.42);}
.info-bubble[data-tip]:hover::before,.info-bubble[data-tip]:focus::before{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%) translateY(2px);border:5px solid transparent;border-bottom-color:rgba(255,255,255,.09);z-index:51;pointer-events:none;}

/* Recovery pip — STATIC, green-only, win indicator (never shame) */
.nav-pip-slot{display:inline-flex;align-items:center;justify-content:center;width:8px;height:8px;margin-left:6px;vertical-align:middle;}
.nav-pip{width:6px;height:6px;border-radius:50%;background:var(--win);box-shadow:0 0 6px rgba(255,255,255,.35);}
.nav-pip[hidden]{display:none;}

/* v3.17 — Axe 1 : pont vers l'action (Next-Move card + CTA sur sections existantes)
   Neutralisé v3.17b : suppression de l'ambre, palette blanc/gris alignée sur le reste. */
.nm-card{background:linear-gradient(135deg,rgba(230,232,238,.035) 0%,var(--bg-card) 80%);border:1px solid var(--border-hi);border-left:2px solid rgba(230,232,238,.4);border-radius:var(--rl);padding:14px 14px 12px;margin-bottom:10px;position:relative;overflow:hidden;transition:border-color 220ms ease,box-shadow 220ms ease;}
.nm-card.nm-good{border-left-color:rgba(230,232,238,.5);}
.nm-card:hover{box-shadow:0 0 40px -20px rgba(230,232,238,.14);}
.nm-eyebrow{font-size:.48rem;letter-spacing:.16em;text-transform:uppercase;color:rgba(230,232,238,.55);margin-bottom:6px;}
.nm-title{font-size:.78rem;color:var(--t1);font-weight:400;line-height:1.3;margin-bottom:4px;letter-spacing:.01em;}
/* Mot-clé du pattern détecté : ambre pour les warn, blanc renforcé pour les good */
.nm-pat{color:#d8b070;}
.nm-pat.good{color:rgba(230,232,238,.98);}
.nm-msg{font-size:.58rem;color:var(--t2);line-height:1.55;margin-bottom:11px;}
.nm-cta{background:transparent;border:1px solid rgba(230,232,238,.22);color:rgba(230,232,238,.82);font-family:var(--font);font-size:.56rem;letter-spacing:.06em;padding:7px 12px;border-radius:var(--r);cursor:pointer;transition:all 180ms ease;}
.nm-cta:hover{background:rgba(230,232,238,.05);border-color:rgba(230,232,238,.45);color:var(--t1);}

/* Pattern card → click-through (Axe 1) */
.patt-card.patt-clickable{cursor:pointer;}
.patt-card.patt-clickable:hover{border-color:rgba(184,146,58,.32);}
.patt-cta-hint{font-size:.46rem;color:var(--t4);letter-spacing:.06em;margin-top:6px;opacity:0;transition:opacity 200ms ease;}
.patt-card.patt-clickable:hover .patt-cta-hint{opacity:.85;}

/* Context tag → clickable for action plan (Axe 1) */
.tc-loss.tc-clickable{cursor:pointer;transition:all 180ms ease;}
.tc-loss.tc-clickable:hover{background:rgba(184,146,58,.14);border-color:rgba(184,146,58,.45);}

/* CTA at the bottom of ins-card (Activité vs impact) */
.ins-cta-row{margin-top:10px;display:flex;justify-content:flex-end;}
.ins-cta{background:transparent;border:1px solid var(--border-hi);color:var(--t2);font-family:var(--font);font-size:.52rem;letter-spacing:.06em;padding:5px 10px;border-radius:var(--r);cursor:pointer;transition:all 180ms ease;}
.ins-cta:hover{border-color:rgba(184,146,58,.42);color:rgba(184,146,58,.92);background:rgba(184,146,58,.05);}

/* v3.17 — Axe 2 : engagement visuel sobre (reveal, count-up, sparkline draw, citation cycle) */
@media (prefers-reduced-motion: no-preference) {
  .reveal{opacity:0;transform:translateY(8px);transition:opacity 520ms cubic-bezier(.2,.6,.2,1),transform 520ms cubic-bezier(.2,.6,.2,1);will-change:opacity,transform;}
  .reveal.in{opacity:1;transform:translateY(0);}
}
@media (prefers-reduced-motion: reduce) {
  .reveal{opacity:1;transform:none;}
}
.reveal:nth-child(2).in{transition-delay:60ms;}
.reveal:nth-child(3).in{transition-delay:120ms;}
.reveal:nth-child(4).in{transition-delay:160ms;}
.reveal:nth-child(5).in{transition-delay:200ms;}

/* Sparkline draw animation */
@media (prefers-reduced-motion: no-preference) {
  .spark-line{stroke-dasharray:1200;stroke-dashoffset:1200;animation:sparkDraw 1100ms cubic-bezier(.25,.65,.3,1) forwards;animation-delay:280ms;}
  .spark-dot{opacity:0;animation:sparkDot 320ms ease-out forwards;animation-delay:1280ms;}
}
@keyframes sparkDraw{to{stroke-dashoffset:0;}}
@keyframes sparkDot{to{opacity:1;}}

/* v3.17 — Effet "tech zoom" sur la CARTE MENTALE (SVG uniquement).
   Plus de scan-lines/stries — uniquement : zoom profond du SVG + glow doux + saturate.
   Piloté par --zoom (0 → 1). Amplitude jusqu'à ×1.8. */
.cognitive-dash{--zoom:0;position:relative;z-index:1;overflow:hidden;}
/* v3.17d — Conteneur de la carte mentale clippe le SVG zoomé pour ne PAS
   déborder sur les insights "La clarté mentale semble être..." dessous.
   On enveloppe visuellement le SVG via un masque CSS : `clip-path: inset(...)`
   appliqué sur le SVG lui-même, à la même boîte que sa taille naturelle. */
.pgrav-card{position:relative;}
.pgrav-card > svg{clip-path:inset(0 round 4px);}
/* Glow ciblé : positionné sur la zone du SVG via le wrapper .pgrav-card avec un ::before
   qui occupe la zone visuelle de la carte mentale (sous le titre + sous-titre, ~60px).
   v3.17b — glow réduit de 50% (intensité + opacité) pour rester sobre. */
/* v3.17c — glow encore divisé par 2 (total -75% vs v3.17 initial). */
.pgrav-card::before{content:'';position:absolute;left:0;right:0;top:60px;height:calc(100% - 60px);border-radius:var(--r);background:radial-gradient(ellipse at 50% 50%,rgba(140,200,255,calc(var(--zoom)*.105)) 0%,rgba(140,200,255,calc(var(--zoom)*.025)) 45%,transparent 75%);pointer-events:none;z-index:0;opacity:calc(var(--zoom)*.38);transition:opacity 180ms ease;}
/* Wrapper clip : empêche le SVG zoomé de déborder sur les insights ci-dessous. */
.pgrav-svg-clip{overflow:hidden;border-radius:4px;position:relative;z-index:1;}
.pgrav-svg-clip > svg{transform-origin:50% 50%;transform:scale(calc(1 + var(--zoom)*0.56));transition:transform 200ms cubic-bezier(.2,.7,.2,1);will-change:transform;display:block;}
.cognitive-dash.tech-armed .pgrav-svg-clip > svg{filter:saturate(calc(1 + var(--zoom)*.11)) contrast(calc(1 + var(--zoom)*.035)) drop-shadow(0 0 calc(var(--zoom)*3.5px) rgba(140,200,255,calc(var(--zoom)*.12)));}
/* Fallback : si le SVG est encore enfant direct de .pgrav-card (ancien rendu en cache), conserve le scale */
.pgrav-card > svg{transform-origin:50% 50%;transform:scale(calc(1 + var(--zoom)*0.56));transition:transform 200ms cubic-bezier(.2,.7,.2,1);will-change:transform;display:block;position:relative;z-index:1;}

/* Citation cyclable — interactive hint */
.dash-quote{cursor:pointer;}
.dash-quote:active{transform:scale(.998);}
.dash-quote .dq-hint{position:absolute;bottom:8px;right:12px;font-size:.42rem;letter-spacing:.08em;color:var(--t4);opacity:0;transition:opacity 240ms ease;text-transform:uppercase;}
.dash-quote:hover .dq-hint{opacity:.7;}
.dash-quote.cycling .dq-body{animation:quoteFade 380ms ease-out;}
@keyframes quoteFade{0%{opacity:.35;transform:translateY(2px);}100%{opacity:1;transform:translateY(0);}}

/* Count-up animated numbers — apply class .countup; JS will tween */
.countup{font-variant-numeric:tabular-nums;}
</style>
</head>
