/* boucle d'apprentissage des plans : un tap, champs additifs tried/helped (jour + bibliothèque) */
function deriveFb(ok){
 const d=day(todayISO());
 if(d&&d.plan){
  d.plan.tried=(d.plan.tried||0)+1;if(ok)d.plan.helped=(d.plan.helped||0)+1;
  const lp=(D.plans||[]).find(p=>p.ifTxt===d.plan.ifTxt&&p.thenTxt===d.plan.thenTxt);
  if(lp){lp.tried=(lp.tried||0)+1;if(ok)lp.helped=(lp.helped||0)+1}
 }
 save();closeSheet();toast('C’est noté');
}

/* anneau de score (SVG) */
function scoreRing(sc,won){
 const R=64,C=2*Math.PI*R;
 return`<div class="scorewrap"><div style="position:relative;width:168px;height:168px">
  <svg viewBox="0 0 168 168" style="transform:rotate(-90deg)">
   <circle cx="84" cy="84" r="${R}" fill="none" stroke="var(--s2)" stroke-width="5"/>
   <circle id="ringArc" cx="84" cy="84" r="${R}" fill="none" stroke="${won?'var(--warm)':'var(--gold)'}" stroke-width="5" stroke-linecap="round"
    stroke-dasharray="${C}" stroke-dashoffset="${C*(1-sc/100)}" style="transition:stroke-dashoffset 1.1s var(--ease)"/>
  </svg>
  <div class="ringlbl"><div class="n" id="ringN">${sc}</div><div class="d">/100</div></div>
 </div></div>`;
}
function animRing(target){
 const arc=$('ringArc'),n=$('ringN');if(!arc)return;
 const C=2*Math.PI*64;
 requestAnimationFrame(()=>{arc.style.strokeDashoffset=C*(1-target/100)});
 const t0=performance.now();
 (function tick(t){const p=Math.min(1,(t-t0)/1050);n.textContent=Math.round(target*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(tick)})(t0);
}
function breakdown(r){
 const p=r.parts||{};
 const li=(ok,label,pts)=>`<div class="li ${ok?'':'off'}"><span class="ic">${I.check}</span><span>${label}</span><span class="pt">${ok?'+'+pts:'—'}</span></div>`;
 return`<div class="break">
  ${li(p.mit>0,'Priorité accomplie',p.mit||60)}
  ${li(p.org>0,'Organisation réaliste',p.org||15)}
  ${li(p.sec>0,'Tâches secondaires',p.sec||15)}
  ${li(p.est>0,'Estimation du temps',p.est||10)}
 </div>`;
}

/* ── ÉTOILES ── */
function monthShift(n){const[y,m]=S.month.split('-').map(Number);const d=new Date(y,m-1+n,1);
 S.month=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render()}
function viewEtoiles(){
 const[y,m]=S.month.split('-').map(Number);
 const label=new Date(y,m-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
 const nDays=new Date(y,m,0).getDate();
 const first=(new Date(y,m-1,1).getDay()+6)%7; // lundi=0
 const monthDays=[];
 for(let i=1;i<=nDays;i++){const iso=S.month+'-'+String(i).padStart(2,'0');monthDays.push({i,iso,d:day(iso)})}
 const winners=monthDays.filter(x=>x.d&&x.d.review&&x.d.review.status==='gagnante');
 /* constellation */
 let stars='',lines='',prev=null;
 winners.forEach(w=>{
  const x=26+(w.i-1)/(nDays-1)*378, yv=34+hash(w.iso)%118;
  if(prev)lines+=`<line class="cline" x1="${prev.x}" y1="${prev.y}" x2="${x}" y2="${yv}"/>`;
  const r=2+(w.d.review.score-70)/30*1.6;
  stars+=`<circle class="star tw ${w.d.review.score>=90?'big':''}" cx="${x}" cy="${yv}" r="${r.toFixed(1)}" style="animation-delay:${(hash(w.iso)%24)/10}s"/>`;
  prev={x,y:yv};
 });
 const consSvg=`<svg viewBox="0 0 430 190">${lines}${stars}</svg>
  <div style="position:absolute;bottom:0;left:0;width:100%;height:52px;opacity:.9">${MOUNTAIN}</div>`;
 /* calendrier */
 const t=todayISO();
 let cal='<div class="cal">'+['L','M','M','J','V','S','D'].map(x=>`<div class="hd">${x}</div>`).join('');
 for(let i=0;i<first;i++)cal+='<div></div>';
 monthDays.forEach(x=>{
  let cls='none';
  if(x.d&&x.d.review)cls=x.d.review.status==='gagnante'?'win':x.d.review.status==='partielle'?'part':'rest';
  else if(x.d)cls='part';
  else if(x.iso>t)cls='';
  cal+=`<button class="cell ${x.iso===t?'today':''}" onclick="openDayRecap('${x.iso}')"><b>${x.i}</b>${cls?`<span class="dot ${cls}"></span>`:'<span class="dot" style="background:transparent"></span>'}</button>`;
 });
 cal+='</div>';
 return`<div class="mnav" style="margin-top:8px">
   <button class="iconbtn" onclick="monthShift(-1)">${I.chevL}</button>
   <div class="h2">${label}</div>
   <button class="iconbtn" onclick="monthShift(1)">${I.chevR}</button>
  </div>
  <div style="display:flex;align-items:baseline;gap:12px;margin:6px 0 16px">
   <span class="bignum">${winners.length}</span>
   <span class="sub">jour${winners.length>1?'s':''} gagnant${winners.length>1?'s':''}<br/>ce mois-ci</span>
  </div>
  <div class="constel" style="position:relative">${winners.length?consSvg:`<div style="padding:44px 24px;text-align:center"><p class="sub">Chaque journée gagnante devient une étoile.<br/>La constellation commence à la première.</p></div><div style="position:absolute;bottom:0;left:0;width:100%;height:52px;opacity:.9">${MOUNTAIN}</div><div style="height:60px"></div>`}</div>
  ${cal}
  <div class="legend">
   <span><span class="dot win"></span>Gagnante</span>
   <span><span class="dot part"></span>Partielle</span>
   <span><span class="dot rest"></span>Repos</span>
  </div>`;
}
function openDayRecap(iso){
 const d=day(iso);if(!d)return;
 const r=d.review;
 const editable=!d.off&&(d.mit||d.tasks.length||d.quick.length)&&(iso!==todayISO()||!!r);
 openSheet(`<div class="eyebrow" style="margin-bottom:6px;text-transform:capitalize">${fmtLong(iso)}</div>
  ${r?`<div class="h2" style="margin-bottom:4px">${r.status==='gagnante'?'Journée gagnante':r.status==='partielle'?'Journée partielle':'Repos'} ${r.status!=='repos'?'· '+r.score+'/100':''}${r.edited?' <span class="small" style="text-transform:none;letter-spacing:0">· corrigée</span>':''}</div>`:`<div class="h2">${iso===todayISO()?'Journée en cours':'Journée non clôturée'}</div>`}
  ${d.mit?`<p class="sub" style="margin-top:10px">Priorité : <span style="color:var(--t1)">${esc(d.mit.title)}</span> ${d.mit.done?'✓':'(non faite)'}</p>`:''}
  ${d.tasks.length?`<p class="sub" style="margin-top:6px">${d.tasks.filter(t=>t.done).length}/${d.tasks.length} secondaires · ${d.quick.filter(t=>t.done).length}/${d.quick.length} micro</p>`:''}
  ${r&&r.note?`<p class="sub" style="margin-top:12px;border-top:1px solid var(--line2);padding-top:12px">${esc(r.note)}</p>`:''}
  <div style="margin-top:18px;display:flex;gap:8px">
   ${editable?`<button class="btn ghost" style="flex:1" onclick="S.rcSnap=null;openDayEdit('${iso}')">Corriger</button>`:''}
   <button class="btn ghost" style="flex:1" onclick="closeSheet()">Fermer</button></div>`);
}
/* correction honnête d'un jour passé : cocher/décocher + note, score recalculé — jamais en silence.
   L'état d'ouverture sert de référence : revenir au point de départ n'est pas une correction. */
/* littéral JS sûr dans un attribut HTML entre guillemets doubles (ids issus d'imports compris) */
function jsq(s){return"'"+String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')+"'"}
function noteEq(a,b){return String(a||'').trim()===String(b||'').trim()}
function doneSig(d){return[d.mit?(d.mit.done?1:0):'-',...(d.tasks||[]).map(t=>t.done?1:0),...(d.quick||[]).map(t=>t.done?1:0)].join('')}
function recomputeReview(d){
 if(!d.review)return;
 const c=computeParts(d,d.review.estim);
 d.review.score=c.score;d.review.status=c.status;d.review.parts=c.parts;
 const s=S.rcSnap;
 const dirty=s?(doneSig(d)!==s.sig||!noteEq(d.review.note,s.note)):true;
 if(dirty)d.review.edited=true;
 else if(s&&!s.edited)delete d.review.edited;
}
function openDayEdit(iso,noteKeep){
 const d=day(iso);if(!d)return;
 const r=d.review;
 if(!S.rcSnap||S.rcSnap.iso!==iso)S.rcSnap={iso,sig:doneSig(d),note:r?(r.note||''):'',edited:!!(r&&r.edited)};
 const row=(kind,t,tag)=>`<div class="trow ${t.done?'done':''}"><button class="chk ${t.done?'on':''}" onclick="recapTog('${kind}',${jsq(t.id)},'${iso}')">${I.check}</button><div class="tt"${kind==='m'?' style="font-weight:600"':''}>${esc(t.title)}</div><span class="est">${tag}</span></div>`;
 openSheet(`<div class="eyebrow" style="margin-bottom:6px;text-transform:capitalize">${fmtLong(iso)}</div>
  <div class="h2" style="margin-bottom:4px">Corriger cette journée</div>
  <p class="small" style="margin-bottom:10px">Coche ce qui a réellement été fait${r?' — le score est recalculé':''}. L'honnêteté est la donnée.</p>
  ${d.mit?row('m',d.mit,'Priorité'):''}
  ${d.tasks.map(t=>row('t',t,fmtMin(t.est))).join('')}
  ${d.quick.map(t=>row('q',t,fmtMin(t.est))).join('')}
  ${r?`<div class="eyebrow" style="margin:14px 0 6px">Note du jour</div>
   <textarea class="field" id="rcNote" placeholder="Ce que tu retiens…">${esc(noteKeep!=null?noteKeep:(r.note||''))}</textarea>`:''}
  <div style="margin-top:16px;display:flex;flex-direction:column;gap:8px">
   <button class="btn" onclick="recapSave('${iso}')">Terminé</button>
  </div>`);
}
function recapTog(kind,id,iso){
 const d=day(iso);if(!d)return;
 const t=findTask(d,kind==='m'?'m':kind==='t'?'t':'q',id);if(!t)return;
 const keep=$('rcNote')?$('rcNote').value:null;   /* la note reste dans le champ, écrite au commit */
 t.done=!t.done;
 recomputeReview(d);save();openDayEdit(iso,keep);
}
/* commit unique : bouton Terminé comme fermeture par le fond — jamais d'écart entre données et écran */
function recapCommit(iso,reopen){
 const d=day(iso);const s=S.rcSnap;S.rcSnap=null;
 if(!d||!s)return;
 let noteChanged=false;
 if(d.review){
  const n=($('rcNote')&&$('rcNote').value||'').trim();
  if(!noteEq(n,d.review.note)){d.review.note=n;noteChanged=true}
 }
 const changed=doneSig(d)!==s.sig||noteChanged||!noteEq(d.review?d.review.note:'',s.note);
 if(changed&&d.review)d.review.edited=true;
 else if(!changed&&d.review&&!s.edited)delete d.review.edited;
 save();
 if(changed)backupNow();
 render();
 if(reopen)openDayRecap(iso);
 if(changed)toast(d.review?'Corrigé — score : '+d.review.score+'/100':'Corrigé');
}
function recapSave(iso){recapCommit(iso,true)}

 if(D.settings.demo)h+=`<div class="demo-banner"><span>Données de démonstration</span><button onclick="demoOff()">Revenir à mes données</button></div>`;
 if(R.locked){
  h+=`<div class="card"><p class="sub">Les patterns demandent du réel. Encore <b style="color:var(--t1)">${R.need-R.have} journée${R.need-R.have>1?'s':''} clôturée${R.need-R.have>1?'s':''}</b> pour débloquer tes premières lectures.</p>
   <div class="lockbar"><i style="width:${Math.round(R.have/R.need*100)}%"></i></div>
   <p class="small">${R.have}/${R.need} journées</p>
   ${D.settings.demo?'':`<div style="margin-top:16px"><button class="btn ghost" onclick="demoOn()">Explorer avec des données de démo</button></div>`}
  </div>`;
  return h;
 }
 h+=`<div class="card" style="padding:6px 18px">
  ${R.list.length?R.list.map(i=>`<div class="insight"><div class="ic">${i.ic}</div><div><p>${i.txt}</p>${i.sub?`<p class="small">${i.sub}</p>`:''}</div></div>`).join('')
   :'<div class="insight"><div class="ic">'+I.zap+'</div><p class="sub">Pas encore de pattern net — tes journées se ressemblent trop, ou pas assez. Continue.</p></div>'}
 </div>`;
 if(R.pts&&R.pts.length>=6)h+=scatter(R.pts);
 h+=`<p class="small" style="margin-top:14px;padding:0 2px">Basé sur ${R.n} journées clôturées, dont ${R.wins} gagnantes. Les lectures s'affinent avec le volume.</p>`;
 return h;
}
function scatter(pts){
 const W=390,H=210,px=44,py=26;
 const X=c=>px+(c-1)/4*(W-px-16), Y=s=>H-py-(s/100)*(H-py-18);
 let dots=pts.map(p=>`<circle cx="${X(p.x+((hash(p.x+'-'+p.y)%9)-4)/22).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="2.4" fill="var(--t3)" opacity=".55"/>`).join('');
 /* régression linéaire simple */
 const n=pts.length,sx=pts.reduce((s,p)=>s+p.x,0),sy=pts.reduce((s,p)=>s+p.y,0);
 const sxy=pts.reduce((s,p)=>s+p.x*p.y,0),sxx=pts.reduce((s,p)=>s+p.x*p.x,0);
 const den=n*sxx-sx*sx;let line='';
 if(Math.abs(den)>1e-6){const a=(n*sxy-sx*sy)/den,b=(sy-a*sx)/n;
  const y1=Math.max(0,Math.min(100,a*1+b)),y2=Math.max(0,Math.min(100,a*5+b));
  line=`<line x1="${X(1)}" y1="${Y(y1)}" x2="${X(5)}" y2="${Y(y2)}" stroke="var(--gold-line)" stroke-width="1" stroke-dasharray="2 5"/>`;}
 const grid=[0,50,100].map(v=>`<line x1="${px}" y1="${Y(v)}" x2="${W-14}" y2="${Y(v)}" stroke="var(--line2)"/><text x="${px-8}" y="${Y(v)+3.5}" text-anchor="end" font-size="9.5" fill="var(--t3)">${v}</text>`).join('');
 const xs=[1,2,3,4,5].map(v=>`<text x="${X(v)}" y="${H-8}" text-anchor="middle" font-size="9.5" fill="var(--t3)">${v}</text>`).join('');
 return`<div class="card" style="margin-top:14px">
  <div class="sect-h"><span class="eyebrow">Clarté vs réussite</span><span class="count">30 derniers jours</span></div>
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block;font-family:inherit">${grid}${xs}${line}${dots}</svg>
  <p class="small" style="margin-top:6px">Niveau de clarté (1–5) → score de journée</p></div>`;
}

 const hr=new Date().getHours();
 const part=hr>=22||hr<5?'t-night':hr<10?'t-dawn':hr<18?'t-day':'t-dusk';
 const ph=document.getElementById('phone');
 if(ph)ph.dataset.uni={'t-dawn':'u-desert','t-day':'u-cloud','t-dusk':'u-mount','t-night':'u-cosmos'}[part];

function setAmb(part){
 const ph=document.getElementById('phone');if(!ph)return;
 const d=day(todayISO());
 const st=[];
 if(part)ph.dataset.part=part;
 st.push(ph.dataset.part||'t-day');

 if(INTRO_OPEN)st.push('intro-on');

/* ── Web Notifications best-effort ──
   Les notifications fiables (app fermée, écran verrouillé) seront réalisées
   dans la version native iOS (Capacitor LocalNotifications). Ici : uniquement
   si l'API existe, si l'utilisateur autorise, et tant que l'app reste ouverte.
   Aucune promesse au-delà — l'UI ne prétend jamais le contraire. */
let NTO=[],INTRO_OPEN=true;
function maybeAskNotif(){try{
 if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()
}catch(e){}}
function scheduleWebNotifs(){
 NTO.forEach(clearTimeout);NTO=[];
 try{
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const d=day(todayISO());if(!d||d.review)return;
  const now=new Date();
  const items=[];
  if(d.mit&&d.mit.at&&d.mit.remind&&!d.mit.done)items.push({at:d.mit.at,title:'Ta priorité',body:d.mit.title});
  (d.tasks||[]).forEach(t=>{if(t.at&&t.remind&&!t.done)items.push({at:t.at,title:'Tâche',body:t.title})});
  (d.quick||[]).forEach(t=>{if(t.at&&t.remind&&!t.done)items.push({at:t.at,title:'Micro-tâche',body:t.title})});
  todaysRituals().forEach(r=>{if(r.time&&r.remind&&!(d.ritualsDone||[]).includes(r.id))items.push({at:r.time,title:'Rituel',body:r.title})});
  items.forEach(it=>{
   const[h,m]=it.at.split(':').map(Number);
   const t=new Date();t.setHours(h,m,0,0);
   const ms=t-now;
   if(ms>0&&ms<12*3600*1000)NTO.push(setTimeout(()=>{try{new Notification(it.title,{body:it.body})}catch(e){}},ms));
  });
 }catch(e){}
}

/* ── deck : indicateur de page + drag souris (test desktop) ── */
function deckStride(el){const c=el.firstElementChild;return c?(c.offsetWidth||0)+12:(el.clientWidth||300)}
function deckScroll(el){
 const dd=$((el.dataset&&el.dataset.dots)||'deckDots');if(!dd)return;
 const i=Math.max(0,Math.min(dd.children.length-1,Math.round((el.scrollLeft||0)/deckStride(el))));
 [...dd.children].forEach((x,j)=>x.classList.toggle('on',j===i))}
function bindDrag(el){
 if(!el||el._drag)return;el._drag=true;
 let sx=0,sl=0,drag=false,pid=null;
 el.addEventListener('pointerdown',e=>{
  if(e.pointerType!=='mouse'||e.button!==0)return;
  pid=e.pointerId;sx=e.clientX;sl=el.scrollLeft;drag=false});
 el.addEventListener('pointermove',e=>{
  if(pid===null||e.pointerId!==pid)return;
  const dx=e.clientX-sx;
  if(!drag&&Math.abs(dx)>4){drag=true;el.classList.add('dragging');try{el.setPointerCapture(pid)}catch(x){}}
  if(drag)el.scrollLeft=sl-dx});
 const up=()=>{
  if(pid===null)return;
  if(drag){el.classList.remove('dragging');
   const st=el.classList.contains('pager')?pagerStride(el):deckStride(el);
   el.scrollTo({left:Math.round(el.scrollLeft/st)*st,behavior:'smooth'});
   el.addEventListener('click',ev=>{ev.stopPropagation();ev.preventDefault()},{capture:true,once:true})}
  drag=false;pid=null};
 el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
}

/* ── tilt de la carte MIT ── */
function bindMitTilt(){
 const el=document.querySelector('.mitcard.tappable[role="button"]');
 if(!el||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 el.onpointerdown=e=>{el.classList.add('tilting');mitTilt(el,e)};
 el.onpointermove=e=>{if(el.classList.contains('tilting'))mitTilt(el,e)};
 el.onpointerup=el.onpointercancel=el.onpointerleave=()=>{el.classList.remove('tilting');el.style.transform=''};
}
function mitTilt(el,e){
 const r=el.getBoundingClientRect();
 const dx=(e.clientX-r.left)/r.width-.5,dy=(e.clientY-r.top)/r.height-.5;
 el.style.transform=`perspective(760px) rotateX(${(-dy*2.4).toFixed(2)}deg) rotateY(${(dx*2.6).toFixed(2)}deg) scale(.982)`;
}
