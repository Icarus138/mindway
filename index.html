<script>
/* ============================================================
   MINDWAY v2 — Enhanced cognitive journal
   Additions: If-Then, anti-dispersion score, recovery score,
   pattern detection, concept hints, charts, auto-sort tasks
============================================================ */

/* ============================================================
   PRINCIPLES — DO NOT REINTRODUCE (locked by /autoplan review)
   • No streak counter — chain anxiety reinforces procrastination
   • No notifications / push — Mindway is opened intentionally
   • No AI MIT suggestions — defining priority IS the cognitive work
   • No weekly/monthly email reports — passive observation isn't the product
   These guardrails came from CEO + Design + Eng review (2026-05-11).
   See ~/.gstack/projects/mindway/autoplan-plan-*-APPROVED.md
============================================================ */

/* ── STORAGE KEYS ── */
const SK = 'mindway_v1';
const IT_SK = 'mindway_it_v1';

/* ── STATE ── */
let DAYS = {};
let STRATEGIES = [];
let OV_DATE = null;
let CI_OPEN = false;
let IT_OPEN = false;
let HF = '30';
let DF = '30';

/* ── CONFIG ── */
const METRICS = [
  {k:'humeur',l:'Humeur'},{k:'energie',l:'Énergie'},{k:'stress',l:'Stress'},
  {k:'clarte',l:'Clarté mentale'},{k:'motivation',l:'Motivation'},
  {k:'optimisme',l:'Optimisme'},
  {k:'dispersion',l:'Dispersion'}
];

/* MOOD definitions — sober one-liners shown via info-bubble on each metric (v3.7) */
const MOOD_DEFS={
  humeur:    "Ton état affectif global (1 péjoré · 5 top). Lecture brute, pas un jugement.",
  energie:   "Disponibilité physique et mentale du moment (1 épuisé · 5 plein).",
  stress:    "Tension cognitive ou émotionnelle ressentie maintenant.",
  clarte:    "Capacité à voir nettement tes priorités. Levier le plus direct vers l'action.",
  motivation:"Envie d'entamer ou de poursuivre. Distincte de la clarté.",
  optimisme: "Confiance que l'effort en vaut la peine — sentiment que la journée peut aboutir.",
  dispersion:"Attention fragmentée vs concentrée (1 focus · 5 éparpillé).",
};
const ALL_TAGS = ['fatigue','anxiété','brouillard mental','motivation élevée','surcharge cognitive','pression extérieure','tendance à éviter','bonne concentration','impulsivité','fatigue sociale','état créatif','besoin de récupération'];

/* v3.10 — Tag → pattern de citation (utilisé par "Contextes associés") */
const TAG_TO_PATTERN={
  'fatigue':                'low_energy_mit_success',
  'besoin de récupération': 'low_energy_mit_success',
  'fatigue sociale':        'low_energy_mit_success',
  'anxiété':                'antifragile_day',
  'surcharge cognitive':    'high_dispersion_low_mit',
  'pression extérieure':    'antifragile_day',
  'tendance à éviter':      'high_impact_avoidance',
  'impulsivité':            'micro_tasks_over_mit',
  'brouillard mental':      'high_dispersion_low_mit',
  'bonne concentration':    'high_clarity_success',
  'motivation élevée':      'optimisme_high',
  'état créatif':           'high_clarity_success',
};
const CONCEPTS = {
  mit: {short:"La priorité du jour est la tâche qui rend la journée gagnante, même si rien d'autre n'est accompli.", full:"Une journée gagnante n'est pas une journée parfaite. C'est une journée où l'essentiel a été honoré. Les autres tâches sont du bonus."},
  secondary: {short:"Trois tâches de 45 minutes représentent déjà plus de deux heures d'avancement réel.", full:"Elles permettent de construire une progression solide sans transformer la journée en surcharge. Triées automatiquement par impact + urgence."},
  micro: {short:"Les micro-tâches maintiennent l'élan — mais ne doivent pas remplacer la priorité centrale.", full:"Elles réduisent la friction d'entrée dans l'action, surtout les jours où l'énergie ou la clarté sont plus faibles."},
  impact: {short:"L'impact mesure ce qui fait réellement avancer ta journée ou tes objectifs.", full:"Une tâche à fort impact (I=3) change quelque chose d'important. Une tâche à faible impact (I=0) reste utile mais ne fait pas progresser l'essentiel."},
  urgence: {short:"L'urgence mesure ce qui nécessite une attention rapide.", full:"Une tâche urgente sans impact fort peut être déléguée ou regroupée. La combinaison impact élevé + urgence élevée = priorité maximale."},
  ifthen: {short:"Un If Then prépare une réponse simple à une dérive récurrente. L'objectif n'est pas d'éviter toute dispersion, mais de revenir plus vite à l'action.", full:"Si un comportement revient souvent, le plan aide à prévoir une action courte pour se recentrer. Le nombre d'activations n'est pas un signe d'échec — c'est une mesure de retour à l'action."},
  mood: {short:"Évaluer ton état d'esprit permet de relier tes journées gagnantes à tes conditions mentales réelles.", full:"L'objectif n'est pas de juger ton humeur, mais d'observer quels états favorisent la clarté, la priorité et le retour à l'action. Ces données permettent ensuite d'identifier des patterns personnels."},
  antifrg: {short:"Une journée antifragile est une journée où une difficulté a été traversée sans perdre l'essentiel.", full:"Le but n'est pas d'éviter toutes les dérives, mais de raccourcir leur durée, revenir à l'action et apprendre des patterns. La friction mentale devient une donnée utile."},
  score: {short:"Le score aide à clarifier les priorités sans transformer la journée en compétition.", full:"Impact + Urgence = score de tâche (0–6). Le score de journée mesure la part des points possibles réellement accomplie."},
};

/* ── UTILS ── */
const $ = id => document.getElementById(id);
const uid = () => Math.random().toString(36).slice(2,9);
const cl = (v,a,b) => Math.max(a,Math.min(b,v));
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const todayISO = () => new Date().toISOString().slice(0,10);
const fmtL = d => new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const fmtM = d => new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
const fmtS = d => new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'});

function toast(msg,ms=2000){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),ms);}
function togHint(id){const e=$(id);if(e)e.style.display=e.style.display==='none'?'block':'none';}
function hintBtn(id){return `<button class="hint-btn" onclick="togHint('hw-${id}')">i</button>`;}
function hintWrap(id,text){return `<div class="hint-wrap" id="hw-${id}" style="display:none">${text}</div>`;}

/* ── STORAGE ── */
function saveDays(){localStorage.setItem(SK,JSON.stringify(DAYS));}
function loadDays(){try{const r=localStorage.getItem(SK);if(r)DAYS=JSON.parse(r);}catch(e){DAYS={};setTimeout(()=>{try{toast("Données corrompues — sauvegarde introuvable");}catch(_){}}, 800);}}
function saveStrategies(){localStorage.setItem(IT_SK,JSON.stringify(STRATEGIES));}
function loadStrategies(){try{const r=localStorage.getItem(IT_SK);if(r)STRATEGIES=JSON.parse(r);}catch(e){STRATEGIES={};}}
function getDay(date){if(!DAYS[date])DAYS[date]=mkDay(date);return DAYS[date];}
function mkDay(date){return{id:date,date,mood:{humeur:3,energie:3,stress:3,clarte:3,motivation:3,optimisme:3,dispersion:3},tags:[],tasks:[],ifThens:[],dailyNote:'',quoteId:null,guidedDismissed:false,guidedCompleted:false,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};}
/* Time caps & defaults (v3.6) — anti-procrastination via budget */
const TIME_CAP={MIT:120, SECONDARY:45, MICRO:10};        // plafond max accepté
const TIME_DEFAULT={MIT:60, SECONDARY:45, MICRO:10};     // valeur par défaut
const MIT_TIME_OPTIONS=[30,45,60,90,120];                // sélecteur priorité

function fmtMin(m){
  if(!m||m<60)return `${m||0} min`;
  const h=Math.floor(m/60),r=m%60;
  return r? `${h}h${String(r).padStart(2,'0')}` : `${h}h`;
}

function migrateDays(){
  // Backup before any structural migration
  try{const raw=localStorage.getItem(SK);if(raw){const bk='mindway_backup_before_ifthen_migration_'+Date.now();localStorage.setItem(bk,raw);}}catch(e){}
  // Migrate old ifThen entries: add count:1 if missing
  Object.values(DAYS).forEach(d=>{
    if(!d.ifThens)d.ifThens=[];
    d.ifThens.forEach(a=>{
      if(a.count===undefined)a.count=1;
      if(a.lastActivatedAt===undefined)a.lastActivatedAt=a.activatedAt||new Date().toISOString();
    });
    // v3.6 — backfill timeEstimate on legacy tasks
    (d.tasks||[]).forEach(t=>{
      if(t.t===undefined||t.t===null) t.t=TIME_DEFAULT[t.type]||TIME_DEFAULT.SECONDARY;
      // Enforce caps for SEC/MICRO (locked)
      if(t.type==='SECONDARY'&&t.t>TIME_CAP.SECONDARY) t.t=TIME_CAP.SECONDARY;
      if(t.type==='MICRO'&&t.t>TIME_CAP.MICRO) t.t=TIME_CAP.MICRO;
    });
    // v3.7 — backfill optimisme metric (default mid-range)
    if(d.mood && d.mood.optimisme===undefined) d.mood.optimisme=3;
    // v3.11 — backfill Guided Brain Dump flags
    if(d.guidedDismissed===undefined) d.guidedDismissed=false;
    if(d.guidedCompleted===undefined) d.guidedCompleted=false;
  });
}

/* ── SCORE ── */
function calcScore(day){
  const tasks=day.tasks||[];
  if(!tasks.length)return{tot:0,done:0,pct:0,mitDone:false,status:'empty',af:false};
  const mit=tasks.find(t=>t.type==='MIT');
  const mitDone=mit?mit.completed:false;
  const tot=tasks.reduce((s,t)=>s+(t.impact||0)+(t.urgency||0),0);
  const done=tasks.filter(t=>t.completed).reduce((s,t)=>s+(t.impact||0)+(t.urgency||0),0);
  const pct=tot>0?Math.round(done/tot*100):0;
  const af=mitDone&&(day.mood.energie<=2||day.mood.stress>=4||(day.mood.dispersion||0)>=4);
  let status='empty';
  if(tasks.length){if(!mitDone)status='ongoing';else if(pct>=80)status='optimized';else status='winning';}
  return{tot,done,pct,mitDone,status,af};
}

function calcRecovery(day){
  const sc=calcScore(day);
  const acts=day.ifThens||[];
  let s=0;
  if(acts.length>0)s+=1;
  if(acts.some(a=>a.effectivenessScore>=2))s+=1;
  if(sc.mitDone&&(day.mood.dispersion>=4||day.mood.stress>=4))s+=1;
  return s; // 0-3
}

function calcAntiDisp(day){
  const acts=day.ifThens||[];
  if(!acts.length)return null;
  const eff=acts.filter(a=>(a.effectivenessScore||0)>=2).length;
  const helped=acts.filter(a=>a.helpedReturnToAction).length;
  return Math.min(100,Math.round((eff/acts.length)*80+(helped>0?20:0)));
}

/* ── TASK SORT ── */
function sortTasks(tasks){
  const mit=tasks.filter(t=>t.type==='MIT');
  const sec=tasks.filter(t=>t.type==='SECONDARY').sort((a,b)=>((b.impact||0)+(b.urgency||0))-((a.impact||0)+(a.urgency||0)));
  const micro=tasks.filter(t=>t.type==='MICRO').sort((a,b)=>((b.impact||0)+(b.urgency||0))-((a.impact||0)+(a.urgency||0)));
  return[...mit,...sec,...micro];
}

/* ── PATTERN DETECTION ── */
function detectPatterns(day){
  const sc=calcScore(day),tasks=day.tasks||[],mood=day.mood,acts=day.ifThens||[],pats=[];
  if(mood.clarte>=4&&sc.mitDone)pats.push('high_clarity_success');
  if(mood.dispersion>=4&&!sc.mitDone)pats.push('high_dispersion_low_mit');
  if(mood.dispersion>=4&&acts.length>0)pats.push('strategy_used_high_dispersion');
  if(mood.energie<=2&&sc.mitDone)pats.push('low_energy_mit_success');
  if(mood.energie<=2&&acts.length>0)pats.push('strategy_used_low_energy');
  // resistance metric removed v3.8 — patterns no longer evaluated
  const microDone=tasks.filter(t=>t.type==='MICRO'&&t.completed).length;
  const mitAcc=tasks.find(t=>t.type==='MIT');
  if(microDone>=3&&(!mitAcc||!mitAcc.completed))pats.push('micro_tasks_over_mit');
  const doneTasks=tasks.filter(t=>t.completed);
  const hiDone=doneTasks.filter(t=>(t.impact||0)>=2).length;
  const loDone=doneTasks.filter(t=>(t.impact||0)<=1).length;
  const hiNotDone=tasks.filter(t=>!t.completed&&(t.impact||0)>=2).length;
  if(doneTasks.length>=3&&loDone>hiDone)pats.push('low_impact_productivity');
  if(hiNotDone>=2&&loDone>=1)pats.push('high_impact_avoidance');
  if(acts.length>0)pats.push('if_then_used');
  if(!acts.length&&mood.dispersion>=4)pats.push('if_then_unused');
  if(acts.some(a=>(a.effectivenessScore||0)>=2))pats.push('if_then_effective');
  if(acts.some(a=>a.helpedReturnToAction)&&sc.mitDone)pats.push('strategy_helped_mit');
  if(sc.af)pats.push('antifragile_day');
  // Antifragile with If Then: high dispersion + strategy used + MIT done
  if(mood.dispersion>=4&&acts.length>0&&sc.mitDone)pats.push('antifragile_ifthen');
  return pats;
}

    const be=we?2.2+r()*1.8:1.8+ws*1.4+mc*.8+r()*.9;
    const bs=we?1.2+r()*1.2:2.8-ws*.6+(1-mc)*1.6+r()*.9;
    const en=rc(be),st=rc(bs),dq=(en+(5-st))/10;
    const tags=[];
    if(en<=2)tags.push('fatigue');
    if(st>=4){tags.push('anxiété');if(r()>.5)tags.push('surcharge cognitive');}
    if(en>=4&&st<=2)tags.push('bonne concentration');
    if(r()>.75)tags.push(pk(ALL_TAGS));
    const utags=[...new Set(tags)].slice(0,3);
    const mitDone=r()<.3+dq*.6;
    const nm=we?ri(1,2):ri(1,3),nmm=we?ri(1,2):ri(2,3);
    const q=quoteForDay(date);
    const tasks=[{id:date+'_0',type:'MIT',title:pk(MP),impact:ri(2,3),urgency:ri(1,3),completed:mitDone,createdAt:date+'T08:00Z',completedAt:mitDone?date+'T14:00Z':null}];
    sh(ME).slice(0,nm).forEach((t,j)=>{const d=r()<.3+dq*.55;tasks.push({id:date+'_1'+j,type:'SECONDARY',title:t,impact:ri(1,2),urgency:ri(1,2),completed:d,createdAt:date+'T08:00Z',completedAt:d?date+'T16:00Z':null});});
    sh(MM).slice(0,nmm).forEach((t,j)=>{const d=r()<.5+dq*.4;tasks.push({id:date+'_2'+j,type:'MICRO',title:t,impact:ri(0,1),urgency:ri(0,1),completed:d,createdAt:date+'T08:00Z',completedAt:d?date+'T18:00Z':null});});
    // Demo if-then activations (on high-dispersion days)
    const ifThens=[];
    if(bs>=3.5&&r()>.45){
      const strat=pk(DEMO_STRATS);
      const eff=r()>.35?ri(2,3):1;
      const helped=eff>=2&&r()>.4;
      const cnt=r()>.6?ri(1,3):1;
      ifThens.push({strategyId:strat.id,count:cnt,activatedAt:date+'T10:00Z',lastActivatedAt:date+'T10:00Z',effectivenessScore:eff,helpedReturnToAction:helped,note:''});
    }
    data[date]={id:date,date,mood:{humeur:rc(be-.2+r()*.6),energie:en,stress:st,clarte:rc(be-bs*.25+r()*.7),motivation:rc(be-.4+r()*.8),optimisme:rc(be-.3+r()*.7),dispersion:rc(bs*.8+r()*.6)},tags:utags,tasks,ifThens,dailyNote:'',quoteId:q.id,createdAt:date+'T08:00Z',updatedAt:date+'T22:00Z'};
  }
  return data;
}

/* ── ANALYSIS ── */
function filterDays(f){
  const all=Object.values(DAYS).sort((a,b)=>a.date.localeCompare(b.date));
  if(f==='7'){const c=new Date(Date.now()-7*86400000).toISOString().slice(0,10);return all.filter(d=>d.date>=c);}
  if(f==='30'){const c=new Date(Date.now()-30*86400000).toISOString().slice(0,10);return all.filter(d=>d.date>=c);}
  return all;
}
function mitRateOf(arr){const wm=arr.filter(d=>d.tasks.some(t=>t.type==='MIT'));if(!wm.length)return null;return Math.round(wm.filter(d=>{const m=d.tasks.find(t=>t.type==='MIT');return m&&m.completed;}).length/wm.length*100);}
function avgScOf(arr){const wt=arr.filter(d=>d.tasks.length>0);if(!wt.length)return null;return Math.round(wt.reduce((s,d)=>s+calcScore(d).pct,0)/wt.length);}

function buildInsights(days){
  const wt=days.filter(d=>d.tasks.length>0);
  if(wt.length<5)return[];
  return[
    {k:'clarte',l:'Clarté mentale',inv:false,pat:'high_clarity_success'},
    {k:'energie',l:'Énergie',inv:false,pat:'low_energy_mit_success'},
    {k:'dispersion',l:'Dispersion',inv:true,pat:'high_dispersion_low_mit'},
    {k:'stress',l:'Stress',inv:true,pat:null},
    {k:'motivation',l:'Motivation',inv:false,pat:null},
  ].reduce((acc,s)=>{
    const hi=wt.filter(d=>d.mood[s.k]>=4),lo=wt.filter(d=>d.mood[s.k]<=2);
    if(hi.length>=3)acc.push({...s,mrH:mitRateOf(hi),mrL:lo.length>=2?mitRateOf(lo):null,scH:avgScOf(hi),scL:lo.length>=2?avgScOf(lo):null,nH:hi.length});
    return acc;
  },[]);
}

function buildTagIns(days){
  const wt=days.filter(d=>d.tasks.length>0);if(wt.length<5)return null;
  const win=wt.filter(d=>calcScore(d).mitDone),nw=wt.filter(d=>!calcScore(d).mitDone);
  const cnt=arr=>{const c={};arr.forEach(d=>d.tags.forEach(t=>{c[t]=(c[t]||0)+1;}));return c;};
  return{pos:Object.entries(cnt(win)).sort((a,b)=>b[1]-a[1]).slice(0,4),neg:Object.entries(cnt(nw)).sort((a,b)=>b[1]-a[1]).slice(0,4),nW:win.length,nN:nw.length};
}

function buildImpactDist(days){
  const done=[];
  days.forEach(d=>d.tasks.filter(t=>t.completed).forEach(t=>done.push(t)));
  const hi=done.filter(t=>(t.impact||0)>=2).length;
  const mid=done.filter(t=>(t.impact||0)===1).length;
  const lo=done.filter(t=>(t.impact||0)===0).length;
  const notDoneHi=days.reduce((s,d)=>s+d.tasks.filter(t=>!t.completed&&(t.impact||0)>=2).length,0);
  return{hi,mid,lo,notDoneHi,total:done.length};
}

/* ── Stabilité émotionnelle ── */
function calcStability(days){
  const wt=days.filter(d=>d.tasks.length>0);
  if(wt.length<5)return null;
  const MK=['energie','stress','dispersion','clarte'];
  const variations={};
  MK.forEach(k=>{
    const vals=wt.map(d=>d.mood[k]||3);
    const mean=vals.reduce((s,v)=>s+v,0)/vals.length;
    const sd=Math.sqrt(vals.reduce((s,v)=>s+Math.pow(v-mean,2),0)/vals.length);
    variations[k]={mean:+mean.toFixed(1),sd:+sd.toFixed(1)};
  });
  const winning=wt.filter(d=>calcScore(d).mitDone);
  const partial=wt.filter(d=>!calcScore(d).mitDone&&d.tasks.length>0);
  const avgM=(arr,k)=>arr.length?(arr.reduce((s,d)=>s+(d.mood[k]||3),0)/arr.length).toFixed(1):null;
  return{
    variations,
    winEnergy:avgM(winning,'energie'),  partEnergy:avgM(partial,'energie'),
    winClarity:avgM(winning,'clarte'),  partClarity:avgM(partial,'clarte'),
    winStress:avgM(winning,'stress'),   partStress:avgM(partial,'stress'),
    winDisp:avgM(winning,'dispersion'), partDisp:avgM(partial,'dispersion'),
    nWin:winning.length, nPart:partial.length
  };
}

function buildIfThenStats(days){
  const withActs=days.filter(d=>(d.ifThens||[]).length>0);
  const allActs=days.flatMap(d=>d.ifThens||[]);
  if(!allActs.length)return null;
  // Use count for total activations
  const totalUses=allActs.reduce((s,a)=>s+(a.count||1),0);
  const eff=allActs.filter(a=>(a.effectivenessScore||0)>=2).length;
  const helped=allActs.filter(a=>a.helpedReturnToAction).length;
  const perStrat={};
  allActs.forEach(a=>{
    if(!perStrat[a.strategyId])perStrat[a.strategyId]={uses:0,effective:0,helped:0,days:0};
    perStrat[a.strategyId].uses+=a.count||1;
    perStrat[a.strategyId].days++;
    if((a.effectivenessScore||0)>=2)perStrat[a.strategyId].effective+=(a.count||1);
    if(a.helpedReturnToAction)perStrat[a.strategyId].helped++;
  });
  const withStratMIT=mitRateOf(withActs);
  const withoutActs=days.filter(d=>!(d.ifThens||[]).length&&d.tasks.length>0);
  const withoutStratMIT=mitRateOf(withoutActs);
  return{total:totalUses,entries:allActs.length,eff,helped,withStratMIT,withoutStratMIT,perStrat,nWith:withActs.length};
}

function donutSVG(segs){
  const total=segs.reduce((s,x)=>s+x.v,0);
  if(!total)return '';
  const R=32,C=40,SW=10,circ=2*Math.PI*R;
  let cum=0;
  const circles=segs.filter(s=>s.v>0).map(s=>{
    const len=(s.v/total)*circ;
    const off=(circ/4-cum).toFixed(2);
    const el=`<circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="${s.c}" stroke-width="${SW}" stroke-dasharray="${len.toFixed(2)} ${(circ-len).toFixed(2)}" stroke-dashoffset="${off}" opacity=".85"/>`;
    cum+=len;return el;
  });
  return`<svg viewBox="0 0 80 80" style="width:76px;height:76px;display:block;flex-shrink:0"><circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="rgba(255,255,255,.03)" stroke-width="${SW}"/>${circles.join('')}</svg>`;
}

/* ── FRICTION DETECTION (V3.1) ── */
/* Single source of truth for "what's blocking the user right now". */
function detectFriction(day){
  const m=day.mood||{};
  const signals=[];
  if((m.dispersion||0)>=4)signals.push({k:'dispersion',v:m.dispersion,label:'Dispersion élevée'});
  if((m.energie||3)<=2)signals.push({k:'energie',v:m.energie,label:'Énergie basse'});
  if((m.stress||0)>=4)signals.push({k:'stress',v:m.stress,label:'Stress élevé'});
  const pats=detectPatterns(day);
  const blocking=pats.find(p=>['high_impact_avoidance','high_dispersion_low_mit','micro_tasks_over_mit','low_impact_productivity'].includes(p));
  let level='none';
  if((m.dispersion||0)>=4||blocking)level='high';
  else if(signals.length>0)level='medium';
  return{level,signals,pattern:blocking||null,patterns:pats};
}

};

/* ── SUGGEST STRATEGY — pick the If-Then matching current friction ── */
function suggestStrategy(day,friction){
  if(!STRATEGIES||!STRATEGIES.length)return null;
  if(friction.level!=='high')return null;
  const want=friction.signals.map(s=>s.k);
  // Priority: match patternType to dominant signal
  const TYPE_MAP={dispersion:'high_dispersion',stress:'high_stress',energie:'low_energy'};
  for(const k of want){
    const t=TYPE_MAP[k];
    if(!t)continue;
    const s=STRATEGIES.find(x=>x.patternType===t);
    if(s)return s;
  }
  // Fallback: most-used strategy across history
  const counts={};
  Object.values(DAYS).forEach(d=>(d.ifThens||[]).forEach(a=>{counts[a.strategyId]=(counts[a.strategyId]||0)+(a.count||1);}));
  const ranked=STRATEGIES.slice().sort((a,b)=>(counts[b.id]||0)-(counts[a.id]||0));
  return ranked[0]||null;
}

  // (Antifragile design: l'utilisateur lit son état → calibre → choisit en conscience)
  const QUICK_METRICS=[{k:'motivation',l:'Motivation'},{k:'dispersion',l:'Dispersion'}];
  const EXTRA_METRICS=METRICS.filter(m=>!QUICK_METRICS.find(q=>q.k===m.k));
  h+=`<div class="mood-compact ${CI_OPEN?'open':''}" id="mood-compact"><div class="mood-compact-hdr">${I.brain}<span class="mood-compact-hdr-lbl">État d'esprit</span>${infoBubble("Te calibrer avant d'agir — pas un jugement, une lecture pour choisir ta priorité en conscience.")}</div>`;
  QUICK_METRICS.forEach(m=>{
    const tip=MOOD_DEFS[m.k]||'';
    h+=`<div class="mood-quick-row"><span class="mood-quick-lbl">${m.l}${tip?infoBubble(tip):''}</span><div class="mbtns">${[1,2,3,4,5].map(v=>`<button class="mbtn ${day.mood[m.k]===v?'on':''}" onclick="setMood('${date}','${m.k}',${v})">${v}</button>`).join('')}</div></div>`;
  });
  h+=`<button class="mood-more-toggle" onclick="toggleCI()"><span>${CI_OPEN?'Masquer':'Détails'} · 6 métriques + contextes + note</span><svg class="chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></button>`;
  h+=`<div class="mood-more">`;
  EXTRA_METRICS.forEach(m=>{
    const tip=MOOD_DEFS[m.k]||'';
    h+=`<div class="mrow"><div class="mlbl">${m.l}${tip?infoBubble(tip):''}</div><div class="mbtns">${[1,2,3,4,5].map(v=>`<button class="mbtn ${day.mood[m.k]===v?'on':''}" onclick="setMood('${date}','${m.k}',${v})">${v}</button>`).join('')}</div></div>`;
  });
  h+=`<div class="tags-lbl">Contexte du jour</div><div class="tags-row">${ALL_TAGS.map(t=>`<button class="tpill ${day.tags.includes(t)?'on':''}" onclick="togTag('${date}','${t}')">${esc(t)}</button>`).join('')}</div>`;
  h+=`<textarea class="note-ta" placeholder="Note libre…" onblur="setNote('${date}',this.value)">${esc(day.dailyNote)}</textarea>`;
  h+=`</div></div>`;

  // ═══ LEVEL 2 — Pattern strip (only when a pattern was actually detected) ═══
  if(pats&&pats.length){
    const main=pats.find(p=>PATTERN_LABEL[p])||pats[0];
    h+=`<div class="pattern-strip"><span class="pattern-strip-lbl">Pattern</span><span class="pattern-strip-val">${esc(patternLabel(main))}</span>${infoBubble("Mindway détecte un motif comportemental récurrent sur tes derniers jours — utile pour ajuster, pas pour juger.")}</div>`;
  }

  // ═══ LEVEL 1 — MIT HERO ═══
  h+=`<div class="mit-hero" data-friction="${friction.level}">`;
  /* v3.17e — bouton "Clarifier" toujours accessible, label adapté selon état.
     Permet d'ajouter de nouvelles tâches via Brain Dump même après validation. */
  const clarifyLabel = day.tasks.length===0 ? 'Clarifier ma journée' : 'Clarifier à nouveau';
  h+=`<div class="mit-hero-head"><span class="mit-hero-lbl">Priorité du jour${infoBubble("La tâche qui rend la journée gagnante, même seule. Définis aussi le temps nécessaire (30–120 min).")}</span><span class="mit-hero-date">${dfull} · <button class="guided-trigger-link" onclick="startGuidedBrainDump()">${clarifyLabel}</button></span></div>`;

  if(!mit){
    // v3.11 — l'empty state lance le flow guidé (au lieu de créer une tâche vide)
    h+=`<div class="mit-hero-empty" onclick="startGuidedBrainDump()"><div class="mit-hero-empty-q">Quelle est la seule chose qui rendrait cette journée gagnante&nbsp;?</div><div class="mit-hero-empty-sub">Une priorité unique. Tout le reste sera du bonus. <button class="guided-trigger-link" style="margin-left:6px;vertical-align:middle" onclick="event.stopPropagation();addTask('${date}','MIT')">Saisir directement</button></div></div>`;
  } else {
    h+=taskCardHTML(mit,date,false);
  }

  // Friction signal — single line under MIT (kept inside hero, no plan inline)
  if(friction.level!=='none'&&(friction.signals.length||friction.pattern)){
    const parts=friction.signals.slice(0,2).map(s=>`<strong>${esc(s.label)}</strong>`);
    if(!parts.length&&friction.pattern)parts.push(`<strong>${esc(patternLabel(friction.pattern))}</strong>`);
    h+=`<div class="friction-line ${friction.level}">Friction détectée — ${parts.join(' · ')}${infoBubble("Signal calibré sur tes propres seuils. Pas une alerte, juste une lecture de ton état actuel.")}</div>`;
  }
  h+=`</div>`; // ← fin MIT-hero

  // ═══ LEVEL 2 — Secondary tasks ═══
  h+=`<div class="tsec"><div class="sec-h">${I.layers}<span class="sec-lbl">Tâches</span>${infoBubble("Maximum 3 tâches de 45 min chacune — soit 2h15 d'action max. Triées par impact + urgence. C'est le bonus, pas l'essentiel.")}<span class="sec-cnt">${sec.length}/3</span></div>`;
  if(sec.length>0)h+=`<div class="tsort-hint">3 × 45 min max · tri par impact + urgence</div>`;
  h+=sec.map(t=>taskCardHTML(t,date,false)).join('');
  h+=sec.length<3?`<button class="add-btn" onclick="addTask('${date}','SECONDARY')">${I.plus} ajouter une tâche</button>`:'';
  h+=`</div>`;

  // ═══ LEVEL 2 — Micro tasks ═══
  h+=`<div class="tsec"><div class="sec-h">${I.list}<span class="sec-lbl">Actions rapides</span>${infoBubble("Maximum 5 actions de 10 min chacune — soit 50 min d'action max. Pour maintenir l'élan, jamais remplacer la priorité.")}<span class="sec-cnt">${micro.length}/5</span></div>`;
  if(micro.length>0)h+=`<div class="tsort-hint">5 × 10 min max · maintien d'élan</div>`;
  h+=micro.map(t=>taskCardHTML(t,date,false)).join('');
  h+=micro.length<5?`<button class="add-btn" onclick="addTask('${date}','MICRO')">${I.plus} ajouter une action rapide</button>`:'';
  h+=`</div>`;

  // ═══ SECTION AUTONOME — Plan If-Then (placée après Actions rapides) ═══
  const todayActs=day.ifThens||[];
  const totalToday=todayActs.reduce((s,a)=>s+(a.count||1),0);
  const helpedToday=todayActs.filter(a=>a.helpedReturnToAction).length;
  if(suggested || totalToday>0 || (STRATEGIES&&STRATEGIES.length>0)){
    // Compteur cliquable : "-" apparait si au moins 1 activation pour la stratégie suggérée (ou globalement)
    const undoTargetId=suggested?suggested.id:(todayActs[0]&&todayActs[0].strategyId);
    const canUndo=totalToday>0&&undoTargetId;
    const countPill=totalToday>0
      ? `<span class="ifthen-count-pill"><strong>${totalToday}</strong> activé${totalToday>1?'s':''}${helpedToday>0?` · ${helpedToday} retour${helpedToday>1?'s':''}`:''}${canUndo?`<button class="ifthen-undo" onclick="decrementStrat('${date}','${undoTargetId}')" title="Retirer une activation">−</button>`:''}</span>`
      : '';
    h+=`<div class="ifthen-section"><div class="ifthen-section-hdr">${I.plans}<span class="ifthen-section-lbl">Plan If-Then</span>${infoBubble("Une réponse pré-préparée à une dérive récurrente. L'objectif n'est pas d'éviter la friction, mais de raccourcir le retour à l'action.")}${countPill}</div>`;
    /* v3.17f — affichage de la suggestion + accès aux autres plans de la bibliothèque.
       L'utilisateur peut choisir n'importe quel plan, pas uniquement celui détecté. */
    if(suggested){
      h+=`<div class="friction-plan"><div class="friction-plan-trig">Si <em>${esc(suggested.trigger)}</em>…</div><div class="friction-plan-resp">→ ${esc(suggested.response)}</div><button class="friction-plan-cta" onclick="activateStrat('${date}','${suggested.id}')">J'utilise ce plan</button></div>`;
    } else if(totalToday===0&&(!STRATEGIES||STRATEGIES.length===0)){
      h+=`<div class="ifthen-empty">Aucun plan défini. Crée ton premier If-Then dans Plans.</div>`;
    }
    /* Liste des autres plans disponibles — masquée par défaut, dépliable */
    const otherPlans=(STRATEGIES||[]).filter(s=>!suggested||s.id!==suggested.id);
    if(otherPlans.length>0){
      const label = suggested ? `Autres plans (${otherPlans.length})` : `Tes plans (${otherPlans.length})`;
      h+=`<details class="ifthen-other"><summary>${label}</summary><div class="ifthen-other-list">`;
      otherPlans.forEach(s=>{
        h+=`<div class="ifthen-other-item"><div class="ifthen-other-text"><div class="ifthen-other-trig">Si <em>${esc(s.trigger)}</em>…</div><div class="ifthen-other-resp">→ ${esc(s.response)}</div></div><button class="ifthen-other-cta" onclick="activateStrat('${date}','${s.id}')">Utiliser</button></div>`;
      });
      h+=`</div></details>`;
    }
    h+=`</div>`;
  }

  // ═══ LEVEL 3 — Score card (only if tasks exist, footer placement) ═══
  if(day.tasks.length>0)h+=scoreCardHTML(sc,day);

  $('today-in').innerHTML=h;
}

/* Recovery pip — DOM-patch only, never re-renders the whole nav.
   Green-only design: pip appears ONLY on win states. No red/amber.
   No animation. See /autoplan principles. */
function renderNavPip(){
  const el=document.getElementById('nav-pip');if(!el)return;
  const day=DAYS[todayISO()];
  if(!day){el.hidden=true;return;}
  const sc=calcScore(day);
  const rec=calcRecovery(day);
  const fr=detectFriction(day);
  // Show pip only when: MIT done OR antifragile day OR recovery>=2 with no high friction
  const win=sc.mitDone||sc.af||(rec>=2&&fr.level!=='high');
  el.hidden=!win;
}

/* ── TODAY ACTIONS ── */
function toggleCI(){CI_OPEN=!CI_OPEN;const c=$('mood-compact')||$('ci-card');if(c)c.classList.toggle('open',CI_OPEN);}
function toggleIT(){IT_OPEN=!IT_OPEN;const s=$('it-strip');if(s)s.classList.toggle('open',IT_OPEN);}
function setMood(d,k,v){const day=getDay(d);day.mood[k]=v;day.updatedAt=new Date().toISOString();saveDays();renderToday();renderNavPip();}
function togTag(d,t){const day=getDay(d);if(day.tags.includes(t))day.tags=day.tags.filter(x=>x!==t);else day.tags.push(t);day.updatedAt=new Date().toISOString();saveDays();renderToday();}
function setNote(d,v){const day=getDay(d);day.dailyNote=v;day.updatedAt=new Date().toISOString();saveDays();}
function addTask(d,type){
  const day=getDay(d);const lim={MIT:1,SECONDARY:3,MICRO:5};
  if(day.tasks.filter(t=>t.type===type).length>=lim[type])return;
  day.tasks.push({id:uid(),type,title:'',impact:type==='MIT'?3:type==='SECONDARY'?2:1,urgency:type==='MIT'?2:1,t:TIME_DEFAULT[type],completed:false,createdAt:new Date().toISOString(),completedAt:null});
  day.updatedAt=new Date().toISOString();saveDays();renderToday();
}
function togT(d,id){const day=getDay(d);const t=day.tasks.find(x=>x.id===id);if(!t)return;t.completed=!t.completed;t.completedAt=t.completed?new Date().toISOString():null;day.updatedAt=new Date().toISOString();saveDays();renderToday();renderNavPip();}
function updTitle(d,id,v){const day=getDay(d);const t=day.tasks.find(x=>x.id===id);if(!t||t.title===v)return;t.title=v;day.updatedAt=new Date().toISOString();saveDays();}
function updField(d,id,f,v){const day=getDay(d);const t=day.tasks.find(x=>x.id===id);if(!t)return;t[f]=v;day.updatedAt=new Date().toISOString();saveDays();renderToday();}
function delT(d,id){const day=getDay(d);day.tasks=day.tasks.filter(t=>t.id!==id);day.updatedAt=new Date().toISOString();saveDays();renderToday();}

function activateStrat(d,sid){
  const day=getDay(d);if(!day.ifThens)day.ifThens=[];
  const now=new Date().toISOString();
  const existing=day.ifThens.find(a=>a.strategyId===sid);
  if(existing){
    existing.count=(existing.count||1)+1;
    existing.lastActivatedAt=now;
  } else {
    day.ifThens.push({strategyId:sid,count:1,activatedAt:now,lastActivatedAt:now,effectivenessScore:0,helpedReturnToAction:false,note:''});
  }
  day.updatedAt=now;saveDays();renderToday();renderNavPip();
}

/* v3.10 — Correction d'un clic en trop : décrémente le compteur, supprime l'activation si count=0 */
function decrementStrat(d,sid){
  const day=getDay(d);if(!day.ifThens)return;
  const existing=day.ifThens.find(a=>a.strategyId===sid);
  if(!existing)return;
  existing.count=(existing.count||1)-1;
  if(existing.count<=0){
    day.ifThens=day.ifThens.filter(a=>a.strategyId!==sid);
  }
  day.updatedAt=new Date().toISOString();saveDays();renderToday();renderNavPip();
  toast("Activation retirée");
}
function setStratEff(d,sid,v){const day=getDay(d);const a=(day.ifThens||[]).find(x=>x.strategyId===sid);if(!a)return;a.effectivenessScore=v;day.updatedAt=new Date().toISOString();saveDays();renderToday();renderNavPip();}
function togStratHelped(d,sid){const day=getDay(d);const a=(day.ifThens||[]).find(x=>x.strategyId===sid);if(!a)return;a.helpedReturnToAction=!a.helpedReturnToAction;day.updatedAt=new Date().toISOString();saveDays();renderToday();renderNavPip();}

/* ── RENDER: PLANS (If Then) ── */
function renderPlans(){
  let h='';
  h+=`<div class="explain-card"><div class="explain-title">If Then — stratégies de reprise</div><div class="explain-txt">${CONCEPTS.ifthen.short}<br><br>${CONCEPTS.ifthen.full}</div></div>`;

  if(STRATEGIES.length){
    h+=`<div class="sec-title" style="margin-bottom:8px">Votre bibliothèque</div>`;
    STRATEGIES.forEach(strat=>{
      const allActs=Object.values(DAYS).flatMap(d=>(d.ifThens||[]).filter(a=>a.strategyId===strat.id));
      const totalUses=allActs.reduce((s,a)=>s+(a.count||1),0);
      const nDays=allActs.length;
      const effCount=allActs.filter(a=>(a.effectivenessScore||0)>=2).length;
      const helpedCount=allActs.filter(a=>a.helpedReturnToAction).length;
      const metaParts=[`${totalUses} utilisation${totalUses!==1?'s':''}`];
      if(nDays>0)metaParts.push(`sur ${nDays} journée${nDays!==1?'s':''}`);
      if(effCount>0)metaParts.push(`${effCount} efficace${effCount!==1?'s':''}`);
      if(helpedCount>0)metaParts.push(`${helpedCount}× retour action`);
      h+=`<div class="strat-lib-card"><div class="strat-lib-body"><div class="strat-lib-trigger">Si <em>${esc(strat.trigger)}</em>…</div><div class="strat-lib-response">→ ${esc(strat.response)}</div><div class="strat-lib-meta">${metaParts.join(' · ')}</div></div><button class="strat-del" onclick="delStrat('${strat.id}')">${I.x}</button></div>`;
    });
  } else {
    h+=`<div class="empty-st" style="padding:20px 0">Aucun plan défini.<br>Ajoutez votre premier If Then ci-dessous.</div>`;
  }

  // Add form
  h+=`<div class="add-strat-form"><div class="sec-title" style="margin-bottom:10px">Nouveau plan</div><label class="add-strat-lbl">Si je…</label><input class="strat-inp" id="strat-trigger" type="text" placeholder="ex: commence à scroller sans but"/><label class="add-strat-lbl">Alors je…</label><input class="strat-inp" id="strat-response" type="text" placeholder="ex: ferme l'app et ouvre ma liste de tâches" onkeydown="if(event.key==='Enter')addStrat()"/><button class="strat-add-btn" onclick="addStrat()">Ajouter le plan</button></div>`;
  $('plans-in').innerHTML=h;
}

function addStrat(){
  const trig=($('strat-trigger')?.value||'').trim();
  const resp=($('strat-response')?.value||'').trim();
  if(!trig||!resp)return;
  STRATEGIES.push({id:uid(),trigger:trig,response:resp,patternType:'',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});
  saveStrategies();renderPlans();toast('Plan ajouté');
}
function delStrat(id){STRATEGIES=STRATEGIES.filter(s=>s.id!==id);saveStrategies();renderPlans();}

/* ── RENDER: HISTORY ── */
function renderHistory(){
  const days=filterDays(HF).slice().sort((a,b)=>b.date.localeCompare(a.date));
  const SC={winning:'var(--win)',optimized:'var(--violet)',partial:'var(--be)',ongoing:'var(--t3)',empty:'var(--t4)'};
  let h=`<div class="frow">${['7','30','all'].map(f=>`<button class="fbtn ${HF===f?'on':''}" onclick="setHF('${f}')">${f==='all'?'Tout':f+'j'}</button>`).join('')}</div>`;
  if(!days.length){h+=`<div class="empty-st">Aucune journée enregistrée.</div>`;$('hist-in').innerHTML=h;return;}
  days.forEach(day=>{
    const sc=calcScore(day),col=SC[sc.status]||SC.ongoing;
    const done=day.tasks.filter(t=>t.completed).length;
    const pats=detectPatterns(day);
    const hasAF=pats.includes('antifragile_day');
    const hasLIP=pats.includes('low_impact_productivity');
    const itCount=(day.ifThens||[]).reduce((s,a)=>s+(a.count||1),0);
    h+=`<div class="hcard" onclick="openOv('${day.date}')"><div><div class="hdate">${fmtM(day.date)}</div><div class="hmeta"><div class="hdot" style="background:${col}"></div><span>${day.tasks.length} tâches · ${done} accomplies</span>${itCount>0?`<span style="color:var(--violet);font-size:.48rem">${itCount}× If Then</span>`:''}</div><div style="margin-top:3px">${sc.mitDone?`<span style="font-size:.5rem;color:var(--win)">priorité validée</span>`:`<span style="font-size:.5rem;color:var(--t4)">—</span>`}${hasAF?`<span style="font-size:.48rem;color:var(--amber);margin-left:6px">antifragile</span>`:''}${hasLIP?`<span style="font-size:.48rem;color:var(--t3);margin-left:6px">activité faible impact</span>`:''}</div></div><div class="hright"><div class="hpct" style="color:${col}">${sc.tot>0?sc.pct+'%':'—'}</div></div></div>`;
  });
  $('hist-in').innerHTML=h;
}
function setHF(f){HF=f;renderHistory();}

/* ── PRIORITY GRAVITY MAP ─────────────────────────────────── */
const MAP_DEFINITIONS={
  mit:        {label:'MIT',           short:'Priorité du jour',       full:"La tâche qui rend la journée gagnante, même seule."},
  clarity:    {label:'Clarté mentale', short:'Lisibilité mentale',    full:"Levier le plus direct vers l'action."},
  energy:     {label:'Énergie',       short:'Vitalité',               full:"Modifie le seuil d'entrée dans l'action."},
  highImpact: {label:'Impact',        short:'Actions structurantes',  full:"Tâches qui font réellement avancer la journée."},
  ifThen:     {label:'If Then',       short:'Plan de reprise',        full:"Mesure de retour à l'action, pas d'échec."},
  micro:      {label:'Micro-actions', short:'Élan',                   full:"Maintiennent le mouvement sans remplacer l'essentiel."},
  dispersion: {label:'Dispersion',    short:'Attention fragmentée',   full:"Activité présente, attention éparpillée."},
  stress:     {label:'Stress',        short:'Tension cognitive',      full:"Charge mentale qui influence l'accès à l'action."},
  optimisme:  {label:'Optimisme',     short:'Confiance dans la suite', full:"Sentiment que l'effort en vaut la peine et que la journée peut aboutir."},
};

function buildCognitiveMapData(days){
  const wt=days.filter(d=>d.tasks.length>0);
  if(wt.length<5)return null;
  const baseMR=mitRateOf(wt)||50;
  const avgSc=Math.round(wt.reduce((s,d)=>s+calcScore(d).pct,0)/wt.length);
  const winDay=wt.filter(d=>calcScore(d).mitDone).length;
  const afDay=wt.filter(d=>calcScore(d).af).length;

  function ni(subset){
    if(subset.length<3)return{mr:null,infl:0,conf:false};
    const mr=mitRateOf(subset);
    if(mr===null)return{mr:null,infl:0,conf:false};
    return{mr,infl:cl((mr-baseMR)/60,-1,1),conf:subset.length>=4};
  }

  // Tag-augmented subsets: scores + contexte coché
  const hasT=(d,tags)=>tags.some(t=>d.tags.includes(t));
  const clarHi  =wt.filter(d=>d.mood.clarte>=4    ||hasT(d,['bonne concentration']));
  const engHi   =wt.filter(d=>d.mood.energie>=4   &&!hasT(d,['fatigue','besoin de récupération','fatigue sociale']));
  const strHi   =wt.filter(d=>d.mood.stress>=4    ||hasT(d,['anxiété','surcharge cognitive','pression extérieure']));
  const dispHi  =wt.filter(d=>d.mood.dispersion>=4||hasT(d,['impulsivité']));
  const optHi   =wt.filter(d=>(d.mood.optimisme||0)>=4);
  const itDays  =wt.filter(d=>(d.ifThens||[]).length>0);
  const hiImp   =wt.filter(d=>d.tasks.some(t=>t.completed&&(t.impact||0)>=2));
  const microNoMIT=wt.filter(d=>{
    const mc=d.tasks.filter(t=>t.type==='MICRO'&&t.completed).length;
    const ma=d.tasks.find(t=>t.type==='MIT');
    return mc>=2&&(!ma||!ma.completed);
  });
  /* Jours avec au moins une micro-action complétée (pour score "Micro-actions") */
  const microDays=wt.filter(d=>d.tasks.some(t=>t.type==='MICRO'&&t.completed));

  /* v3.17 — Helper pour petits subsets (relâche le seuil de 3 jours utilisé par ni())
     afin que Micro-actions et If Then affichent un % dès qu'il y a au moins 1 jour. */
  function niSoft(subset){
    if(!subset.length)return{mr:null,infl:0,conf:false};
    const mr=mitRateOf(subset);
    if(mr===null)return{mr:null,infl:0,conf:false};
    return{mr,infl:(mr-baseMR)/100,conf:subset.length>=3};
  }

  const nodes=[
    {id:'clarity',    label:'Clarté mentale', angle:270, ...ni(clarHi),  n:clarHi.length,    color:'green'},
    {id:'energy',     label:'Énergie',        angle:321, ...ni(engHi),   n:engHi.length,     color:'green'},
    {id:'optimisme',  label:'Optimisme',      angle:12,  ...ni(optHi),   n:optHi.length,     color:'violet'},
    {id:'stress',     label:'Stress',         angle:63,  ...ni(strHi),   n:strHi.length,     color:'red'},
    {id:'dispersion', label:'Dispersion',     angle:115, ...ni(dispHi),  n:dispHi.length,    color:'amber'},
    {id:'micro',      label:'Micro-actions',  angle:167, ...niSoft(microDays), n:microDays.length, color:'grey'},
    {id:'ifThen',     label:'If Then',        angle:218, ...niSoft(itDays),    n:itDays.length,    color:'violet'},
  ];

  // v3.9 — Distance STRICTEMENT proportionnelle au score (mr%).
  // Tant qu'un score existe, on le respecte. Faible confiance = pointillé + opacité réduite,
  // mais position correcte. "100% proche · 0% éloigné" pour tout ce qui gravite.
  const HOSTILE={stress:true,dispersion:true};
  nodes.forEach(nd=>{
    const noData=(nd.mr===null&&nd.id!=='micro')||nd.n===0;
    const lowConf=!noData&&(!nd.conf||nd.n<3);
    if(noData){
      // Vraiment aucune donnée → loin et grisé
      nd.distance=130;
      nd.opacity =0.28;
      nd.dashed  =true;
      nd.color   ='grey';
      nd.size    =9;
      nd.lineW   =0.6;
      nd.score   =null;
      nd.antifragile=false;
    } else if(nd.mr!==null){
      // Distance LINÉAIRE — 100% → 46 (proche) · 0% → 130 (loin)
      nd.distance=cl(130-(nd.mr/100)*84,46,130);
      nd.opacity =lowConf?0.5:cl(0.6+(nd.mr-50)/180,0.55,0.95);
      nd.dashed  =lowConf;
      nd.size    =cl(10.5+Math.abs(nd.infl||0)*3.5,9,14.5);
      nd.lineW   =cl(0.8+Math.abs(nd.infl||0)*1.4,0.8,2.2);
      nd.score   =nd.mr;
      nd.antifragile=!!(HOSTILE[nd.id]&&nd.mr>=60);
    } else {
      // Cas micro : influence négative = loin (replace MIT par micro)
      nd.distance=cl(95-nd.infl*40,55,125);
      nd.opacity =0.55;
      nd.dashed  =nd.infl<0;
      nd.size    =10.5;
      nd.lineW   =1;
      nd.score   =null;
      nd.antifragile=false;
    }
    nd.halo=nd.size+6;
  });

  return{core:{mitRate:baseMR,avgScore:avgSc,winDay,afDay,total:wt.length},nodes};
}

function generateCognitiveInsights(data,days){
  const ins=[],nd=data.nodes,base=data.core.mitRate;
  const topPos=nd.filter(x=>x.conf&&x.infl>0.12&&x.mr!==null).sort((a,b)=>b.infl-a.infl)[0];
  if(topPos)ins.push(`La ${topPos.label.toLowerCase()} semble être le facteur le plus proche de tes journées gagnantes — priorité accomplie dans ${topPos.mr}% des cas, contre ${base}% en moyenne.`);
  const disp=nd.find(x=>x.id==='dispersion');
  if(disp&&disp.conf&&disp.mr!==null&&disp.mr<base-8)ins.push(`Les jours de forte dispersion, l'activité reste présente, mais la priorité centrale se déplace vers l'arrière-plan (${disp.mr}% de réalisation).`);
  const it=nd.find(x=>x.id==='ifThen');
  if(it&&it.conf&&it.n>=3){
    if(it.mr!==null&&it.mr>=base)ins.push(`Les If Then apparaissent surtout lors des journées difficiles — la priorité y est accomplie dans ${it.mr}% des cas. Ils indiquent une capacité de reprise, pas un échec.`);
    else if(it.n>0)ins.push(`Les stratégies If Then ont été activées sur ${it.n} journées. Leur rôle est de raccourcir la durée des dérives, pas de les supprimer.`);
  }
  const micro=nd.find(x=>x.id==='micro');
  if(micro&&micro.n>=3&&micro.infl<-0.1)ins.push(`Les micro-actions soutiennent l'élan, mais semblent parfois remplacer la priorité centrale sur certaines journées.`);
  if(data.core.afDay>=2)ins.push(`${data.core.afDay} journée${data.core.afDay>1?'s':''} antifragile${data.core.afDay>1?'s':''} — des journées difficiles où l'essentiel a tenu malgré la friction.`);
  return ins.slice(0,3);
}

function renderCognitiveMap(days){
  const data=buildCognitiveMapData(days);
  if(!data)return`<div class="pgrav-card"><div class="ins-hdr"><div class="ins-title">Carte cognitive</div></div><div class="empty-st" style="padding:16px 0;font-size:.6rem">5 journées minimum requises pour générer la carte.</div></div>`;

  /* ====================================================
     v3.4 — Grille radiale tactique
     Plus de satellites flottants, plus d'anneaux décoratifs,
     plus de halos par nœud. Pétales structurés autour du MIT.
  ===================================================== */
  const CX=220,CY=160,VW=440,VH=320; /* v3.17 — VW élargi pour accommoder labels longs (ex: "Micro-actions" côté gauche) */
  // v3.8.4 — Palette monochrome au repos. La nature (ressource/friction) se révèle au hover.
  const COLS={
    green: {fill:'rgba(230,232,238,.78)', stroke:'rgba(230,232,238,.42)', bg:'rgba(230,232,238,.05)'},
    violet:{fill:'rgba(230,232,238,.78)', stroke:'rgba(230,232,238,.42)', bg:'rgba(230,232,238,.05)'},
    amber: {fill:'rgba(210,214,222,.7)',  stroke:'rgba(210,214,222,.38)', bg:'rgba(210,214,222,.04)'},
    red:   {fill:'rgba(210,214,222,.7)',  stroke:'rgba(210,214,222,.38)', bg:'rgba(210,214,222,.04)'},
    grey:  {fill:'rgba(160,168,180,.45)', stroke:'rgba(160,168,180,.2)',  bg:'rgba(160,168,180,.03)'},
  };
  // Mapping pour révéler la nature au hover
  const TINT={clarity:'cool',energy:'cool',optimisme:'cool',ifThen:'cool',stress:'warm',dispersion:'warm',micro:'neutral'};
  const mitStrong=data.core.mitRate>=65;

  // v3.8 — distance par nœud (calculée par buildCognitiveMapData en fonction du mr%)
  const N=data.nodes.length;
  const npos=data.nodes.map((nd,i)=>{
    const angle=-90+(360/N)*i;
    const rad=angle*Math.PI/180;
    const dist=nd.distance||100;
    return{...nd,x:CX+dist*Math.cos(rad),y:CY+dist*Math.sin(rad),angle,dist,cls:`cn${i}`};
  });

  let svg=`<svg viewBox="0 0 ${VW} ${VH}" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;margin:6px 0" onclick="hideCMapTT()">`;

  // 3 anneaux-guides indiquant les seuils 30%/60%/90%
  [46,88,130].forEach((r,i)=>{
    svg+=`<circle cx="${CX}" cy="${CY}" r="${r}" fill="none" stroke="rgba(255,255,255,${(0.025-i*0.005).toFixed(3)})" stroke-width="0.5" stroke-dasharray="2,5"/>`;
  });

  // Connecteurs centre → nœud (fines, opacité corrélée à la confiance)
  npos.forEach(nd=>{
    const c=COLS[nd.color]||COLS.grey;
    const op=nd.dashed?0.06:cl(0.1+Math.abs(nd.infl||0)*0.25,0.08,0.32);
    svg+=`<line x1="${CX}" y1="${CY}" x2="${nd.x.toFixed(1)}" y2="${nd.y.toFixed(1)}" stroke="${c.stroke}" stroke-width="0.7" opacity="${op.toFixed(2)}"${nd.dashed?' stroke-dasharray="1.5,3"':''}/>`;
  });

  // ── Noyau MIT — neutre blanc/gris (plus de violet sur le centre) ──
  svg+=`<g class="ccore" onclick="event.stopPropagation();showMapTT('mit')" style="cursor:pointer">`;
  // Halo blanc subtil (signature lumineuse)
  svg+=`<circle cx="${CX}" cy="${CY}" r="42" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="0.6"/>`;
  // Disque MIT — stroke blanche au lieu de violette
  svg+=`<circle cx="${CX}" cy="${CY}" r="32" fill="rgba(8,10,15,.98)" stroke="rgba(255,255,255,${mitStrong?'.45':'.22'})" stroke-width="${mitStrong?'1.4':'1'}"/>`;
  // Bullet central — blanc cassé
  svg+=`<circle cx="${CX}" cy="${CY-9}" r="3" fill="rgba(235,238,245,${mitStrong?'.92':'.7'})"/>`;
  // Labels MIT — blanc neutre, mr% en gris
  svg+=`<text x="${CX}" y="${CY+2}" text-anchor="middle" font-family="DM Mono,monospace" font-size="9.5" font-weight="500" fill="rgba(235,238,245,.94)">MIT</text>`;
  svg+=`<text x="${CX}" y="${CY+14}" text-anchor="middle" font-family="DM Mono,monospace" font-size="8.5" fill="rgba(180,188,200,.78)">${data.core.mitRate}%</text>`;
  svg+=`</g>`;

  // v3.8.2 — Pictogrammes par nœud (au lieu de simples points)
  const NODE_ICONS={
    clarity:    '<circle cx="0" cy="0" r="3.2" fill="none" stroke="CURRENT" stroke-width="1.2"/><line x1="0" y1="-5.5" x2="0" y2="-3.5" stroke="CURRENT" stroke-width="1.2" stroke-linecap="round"/><line x1="0" y1="3.5" x2="0" y2="5.5" stroke="CURRENT" stroke-width="1.2" stroke-linecap="round"/><line x1="-5.5" y1="0" x2="-3.5" y2="0" stroke="CURRENT" stroke-width="1.2" stroke-linecap="round"/><line x1="3.5" y1="0" x2="5.5" y2="0" stroke="CURRENT" stroke-width="1.2" stroke-linecap="round"/>',
    energy:     '<path d="M-1 -5 L-3 0 L0 0 L-1 5 L3 -1 L0 -1 L1 -5 Z" fill="CURRENT" stroke="none"/>',
    optimisme:  '<path d="M-5 1 Q0 -6 5 1" fill="none" stroke="CURRENT" stroke-width="1.4" stroke-linecap="round"/><circle cx="-2.5" cy="-1" r=".9" fill="CURRENT"/><circle cx="2.5" cy="-1" r=".9" fill="CURRENT"/>',
    stress:     '<path d="M-4 -3 L-2 -1 L0 -3 L2 -1 L4 -3 M-4 2 L-2 4 L0 2 L2 4 L4 2" fill="none" stroke="CURRENT" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>',
    dispersion: '<circle cx="-3.5" cy="-2.5" r="1.1" fill="CURRENT"/><circle cx="3.2" cy="-1.8" r="1.1" fill="CURRENT"/><circle cx="-1.5" cy="3.3" r="1.1" fill="CURRENT"/><circle cx="3.5" cy="3" r="1.1" fill="CURRENT"/><circle cx="0" cy="-.5" r="1.1" fill="CURRENT" opacity=".6"/>',
    micro:      '<rect x="-5" y="-1" width="3" height="2" rx=".5" fill="CURRENT"/><rect x="-.5" y="-1" width="3" height="2" rx=".5" fill="CURRENT" opacity=".7"/><rect x="3.5" y="-1" width="2" height="2" rx=".5" fill="CURRENT" opacity=".5"/>',
    ifThen:     '<path d="M-5 -2 L-1 -2 L-1 2 L5 2" fill="none" stroke="CURRENT" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 0 L5 2 L3 4" fill="none" stroke="CURRENT" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>',
  };
  npos.forEach(nd=>{
    const c=COLS[nd.color]||COLS.grey,op=cl(nd.opacity||0.5,0.3,1).toFixed(2);
    const rx=nd.x.toFixed(1),ry=nd.y.toFixed(1);
    const r=(nd.size||11).toFixed(1);
    const iconRaw=NODE_ICONS[nd.id]||'<circle cx="0" cy="0" r="2.5" fill="CURRENT"/>';
    const icon=iconRaw.replace(/CURRENT/g,c.fill);
    const tint=TINT[nd.id]||'neutral';
    const active=!nd.dashed?'1':'0';
    svg+=`<g class="${nd.cls} cog-nd" data-tint="${tint}" data-active="${active}" onclick="event.stopPropagation();showMapTT('${nd.id}')" style="cursor:pointer">`;
    // Anneau antifragile : monochrome subtil au repos, se réchauffe au hover via CSS parent
    if(nd.antifragile){
      svg+=`<circle class="af-ring" cx="${rx}" cy="${ry}" r="${(+r+3.5).toFixed(1)}" fill="none" stroke="rgba(230,232,238,.32)" stroke-width="1" stroke-dasharray="1.5,2" opacity="${op}"><title>Friction traversée — signal antifragile</title></circle>`;
    }
    svg+=`<circle cx="${rx}" cy="${ry}" r="${r}" fill="${c.bg}" stroke="${c.stroke}" stroke-width="${nd.lineW||1}" stroke-dasharray="${nd.dashed?'2,2':'0'}" opacity="${op}"/>`;
    svg+=`<g transform="translate(${rx} ${ry})" opacity="${op}">${icon}</g>`;
    svg+=`</g>`;
  });

  // ── Labels externes — décalage proportionnel à la distance du nœud ──
  npos.forEach(nd=>{
    const c=COLS[nd.color]||COLS.grey,rad=nd.angle*Math.PI/180;
    const labelDist=nd.dist+(nd.size||11)+14;
    const lx=CX+labelDist*Math.cos(rad),ly=CY+labelDist*Math.sin(rad);
    const anchor=Math.abs(lx-CX)<18?'middle':lx<CX?'end':'start';
    const labelOp=nd.dashed?0.5:0.88;
    svg+=`<text x="${lx.toFixed(1)}" y="${(ly-2).toFixed(1)}" text-anchor="${anchor}" font-family="DM Mono,monospace" font-size="9" fill="rgba(228,232,242,${labelOp})" style="pointer-events:none">${nd.label}</text>`;
    // Affiche le score orienté favorable (ou mr direct si pas de score calculé)
    const displayPct=nd.score!=null?nd.score:nd.mr;
    if(displayPct!==null&&displayPct!==undefined){
      svg+=`<text x="${lx.toFixed(1)}" y="${(ly+10).toFixed(1)}" text-anchor="${anchor}" font-family="DM Mono,monospace" font-size="8" fill="${c.fill}" opacity=".78" style="pointer-events:none">${displayPct}%</text>`;
    }
  });

  svg+=`</svg>`;

  const insights=generateCognitiveInsights(data,days);
  let h=`<div class="pgrav-card">`;
  h+=`<div class="ins-hdr"><div class="ins-title">Carte cognitive</div><div class="ins-n">${data.core.total} journées</div></div>`;
  h+=`<div class="pgrav-sub">Distance = priorité accomplie quand cette dimension est haute · anneau ambre = friction traversée</div>`;
  /* v3.17d — wrapper qui clippe le SVG zoomé pour ne pas déborder sur les insights */
  h+=`<div class="pgrav-svg-clip">${svg}</div>`;
  h+=`<div id="cmap-tt" class="cmap-tt" data-nid="" onclick="event.stopPropagation()"></div>`;
  if(insights.length){h+=`<div class="pgrav-ins">${insights.map(i=>`<div class="pgrav-ins-line">${i}</div>`).join('')}</div>`;}
  h+=`</div>`;
  return h;
}


/* ── MENTAL STATE TIMELINE ─────────────────────────────────── */
const DONUT_DEFS={
  'Gagnante':'La priorité centrale a été accomplie.',
  'Optimisée':'La priorité est accomplie et le score global est élevé.',
  'Partielle':"Des actions ont été engagées, même si l'essentiel n'a pas totalement tenu.",
  'Antifragile':"Journée difficile où l'essentiel ou le retour à l'action a tenu malgré la friction.",
  'Vide':"Aucune donnée suffisante pour interpréter la journée."
};
function showDonutTip(label,n){
  const def=DONUT_DEFS[label];const tt=document.getElementById('donut-tt');
  if(!tt||!def)return;
  if(tt.dataset.open===label){tt.style.display='none';tt.dataset.open='';return;}
  tt.innerHTML=`<div style="font-size:.62rem;color:var(--t1);margin-bottom:3px">${label} · ${n} jour${n>1?'s':''}</div><div style="font-size:.57rem;color:var(--t3);line-height:1.6">${def}</div>`;
  tt.style.display='block';tt.dataset.open=label;
}

/* ────────────────────────────────────────────────────────────
   v3.5 — Évolution mentale : HEATMAP matrice métriques × jours
   Lecture verticale = état d'un jour · horizontale = trajectoire
──────────────────────────────────────────────────────────── */
function renderTimeline(days){
  const sorted=days.filter(d=>d.tasks.length>0).sort((a,b)=>a.date.localeCompare(b.date));
  if(sorted.length<5)return'';

  // Métriques : positives (haut = mieux) puis frictions (haut = pire)
  // inv:true → la couleur "intense" doit signaler le mauvais côté (signal/ambre)
  const METS=[
    {k:'clarte',    label:'Clarté mentale', inv:false, palette:'accent'},
    {k:'energie',   label:'Énergie',        inv:false, palette:'accent'},
    {k:'motivation',label:'Motivation',     inv:false, palette:'accent'},
    {k:'optimisme', label:'Optimisme',      inv:false, palette:'accent'},
    {k:'stress',    label:'Stress',         inv:true,  palette:'signal'},
    {k:'dispersion',label:'Dispersion',     inv:true,  palette:'signal'},
  ];

  // Couleur d'une cellule : intensité proportionnelle à la magnitude perçue
  // value 1..5 -> ratio. Pour métriques positives, 5 = forte intensité (bleu).
  //                    Pour frictions (inv), 5 = forte intensité (ambre).
  function cellColor(value, palette){
    const v=cl(value,1,5);
    const ratio=(v-1)/4; // 0..1
    // v3.10 — ressources en gris-blanc (plus de violet/bleu)
    if(palette==='accent') return `rgba(230,232,238,${(0.06+ratio*0.42).toFixed(2)})`;
    return `rgba(195,150,90,${(0.08+ratio*0.6).toFixed(2)})`;
  }

  const cellSize=10, gap=2, labelW=88;
  const rowH=cellSize+gap;
  const cols=sorted.length;
  const W=labelW+cols*(cellSize+gap)+4;
  const Hcells=METS.length*rowH;
  const mitRowY=Hcells+4;
  const H=Hcells+cellSize+10;

  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block" onclick="hideTLTip()">`;

  // Lignes pour chaque métrique
  METS.forEach((m,rowIdx)=>{
    const y=rowIdx*rowH;
    // Label métrique
    svg+=`<text x="0" y="${y+cellSize-1}" font-family="DM Mono,monospace" font-size="7.5" fill="rgba(228,232,242,.62)" style="pointer-events:none">${m.label}</text>`;
    sorted.forEach((d,i)=>{
      const v=d.mood[m.k]||3;
      const x=labelW+i*(cellSize+gap);
      const col=cellColor(v,m.palette);
      svg+=`<rect x="${x}" y="${y}" width="${cellSize}" height="${cellSize}" rx="1.5" fill="${col}" stroke="rgba(255,255,255,.025)" stroke-width="0.5" onclick="event.stopPropagation();showTLDay('${d.date}')" style="cursor:pointer"><title>${m.label} ${v}/5 — ${d.date}</title></rect>`;
    });
  });

  // Rangée MIT done — pastille basse, alignée
  svg+=`<text x="0" y="${mitRowY+cellSize-2}" font-family="DM Mono,monospace" font-size="7" font-weight="500" fill="rgba(228,232,242,.74)" style="pointer-events:none">MIT accomplie</text>`;
  sorted.forEach((d,i)=>{
    const sc=calcScore(d);
    const x=labelW+i*(cellSize+gap)+cellSize/2;
    const y=mitRowY+cellSize/2;
    if(sc.mitDone){
      svg+=`<circle cx="${x}" cy="${y}" r="2.6" fill="rgba(235,238,245,.92)"><title>${d.date} — priorité accomplie</title></circle>`;
    } else {
      svg+=`<circle cx="${x}" cy="${y}" r="1.4" fill="rgba(255,255,255,.12)"/>`;
    }
  });

  svg+=`</svg>`;

  // En-tête de période (premier ↔ dernier jour)
  const first=fmtS(sorted[0].date);
  const last=fmtS(sorted[sorted.length-1].date);

/* ── VISUAL ENGAGEMENT (Axe 2) ─────────────────────────────
   Reveal au scroll, count-up animé, citation cyclable.
   Pas de gamification — uniquement le plaisir d'exploration.
*/
let _revealObs=null;
function applyRevealAndAnimations(rootEl){
  if(!rootEl)return;
  /* IntersectionObserver — fade-up une fois */
  if(!_revealObs){
    _revealObs=new IntersectionObserver(entries=>{
      entries.forEach(e=>{
        if(e.isIntersecting){
          e.target.classList.add('in');
          _revealObs.unobserve(e.target);
        }
      });
    },{threshold:.08,rootMargin:'0px 0px -40px 0px'});
  }
  rootEl.querySelectorAll('.reveal:not(.in)').forEach(el=>_revealObs.observe(el));
  /* Count-up : trigger une fois visible via classe .in */
  rootEl.querySelectorAll('.countup[data-target]').forEach(el=>{
    if(el.dataset.tweened)return;
    el.dataset.tweened='1';
    const target=parseFloat(el.dataset.target);
    const suffix=el.dataset.suffix||'';
    const dur=480;
    const start=performance.now();
    const init=0;
    el.textContent=`${init}${suffix}`;
    function step(t){
      const k=Math.min(1,(t-start)/dur);
      const eased=1-Math.pow(1-k,3);
      const v=Math.round(init+(target-init)*eased);
      el.textContent=`${v}${suffix}`;
      if(k<1)requestAnimationFrame(step);
    }
    /* Démarre quand la carte est révélée — sinon immédiat */
    const card=el.closest('.reveal');
    if(card&&!card.classList.contains('in')){
      const obs=new IntersectionObserver(es=>{
        if(es[0].isIntersecting){requestAnimationFrame(step);obs.disconnect();}
      },{threshold:.1});
      obs.observe(card);
    } else {
      requestAnimationFrame(step);
    }
  });
}

/* ── TECH ZOOM (v3.17) ─────────────────────────────────────
   Sur la page Patterns :
   - Scroll vers le HAUT en étant déjà en haut (overscroll +) : amplifie progressivement
     le zoom sur le SVG cognitif. Le zoom reste FIGÉ à la valeur atteinte.
   - Scroll vers le BAS : décroît progressivement le zoom jusqu'à 0.
   Aucun decay automatique en idle.
*/
let _zoomVal=0,_zoomTouchStart=null;
function setZoomCSS(v){
  const card=document.querySelector('#pg-dash .cognitive-dash');
  if(!card)return;
  _zoomVal=Math.max(0,Math.min(1,v));
  card.style.setProperty('--zoom',_zoomVal.toFixed(3));
  if(_zoomVal>0.04)card.classList.add('tech-armed');
  else card.classList.remove('tech-armed');
}
function onZoomWheel(e){
  if(document.querySelector('#pg-dash')?.classList.contains('on')!==true)return;
  /* Zoom UP : uniquement quand déjà en haut + scroll vers le haut */
  if(window.scrollY===0&&e.deltaY<0){
    e.preventDefault();
    setZoomCSS(_zoomVal+Math.min(.08,Math.abs(e.deltaY)/400));
    return;
  }
  /* Zoom DOWN : scroll vers le bas + un zoom actuellement actif */
  if(e.deltaY>0&&_zoomVal>0){
    setZoomCSS(Math.max(0,_zoomVal-Math.min(.08,Math.abs(e.deltaY)/400)));
    /* On laisse le scroll natif continuer après que le zoom soit redescendu à 0 */
    if(_zoomVal>0)e.preventDefault();
    return;
  }
}
function onZoomTouchStart(e){
  if(document.querySelector('#pg-dash')?.classList.contains('on')!==true)return;
  _zoomTouchStart=e.touches[0].clientY;
}
function onZoomTouchMove(e){
  if(_zoomTouchStart===null)return;
  if(document.querySelector('#pg-dash')?.classList.contains('on')!==true)return;
  const dy=e.touches[0].clientY-_zoomTouchStart;
  /* Drag vers le bas (dy>0) en étant en haut → zoom up */
  if(window.scrollY===0&&dy>0){
    setZoomCSS(Math.min(1,dy/220));
    return;
  }
  /* Drag vers le haut (dy<0) avec zoom actif → zoom down, sans réinitialiser */
  if(dy<0&&_zoomVal>0){
    setZoomCSS(Math.max(0,_zoomVal-Math.abs(dy)/220));
    _zoomTouchStart=e.touches[0].clientY; /* reset baseline pour continuer */
  }
}
function onZoomTouchEnd(){
  _zoomTouchStart=null;
  /* Pas de decay automatique : le zoom reste à sa valeur */
}
function attachZoomListeners(){
  /* Retire puis rajoute pour garantir un seul listener actif (idempotent). */
  window.removeEventListener('wheel',onZoomWheel,{passive:false});
  window.removeEventListener('touchstart',onZoomTouchStart);
  window.removeEventListener('touchmove',onZoomTouchMove);
  window.removeEventListener('touchend',onZoomTouchEnd);
  window.removeEventListener('touchcancel',onZoomTouchEnd);
  window.addEventListener('wheel',onZoomWheel,{passive:false});
  window.addEventListener('touchstart',onZoomTouchStart,{passive:true});
  window.addEventListener('touchmove',onZoomTouchMove,{passive:true});
  window.addEventListener('touchend',onZoomTouchEnd,{passive:true});
  window.addEventListener('touchcancel',onZoomTouchEnd,{passive:true});
}

/* ── CITATION CYCLABLE (Axe 2) ─────────────────────────────── */
let _dashQuotePool=[];
let _dashQuoteIdx=0;
function buildDashQuotePool(days){
  const wt=days.filter(d=>d.tasks.length>0);
  if(!wt.length)return [];
  const allPats=wt.flatMap(d=>detectPatterns(d));
  const cnt={};allPats.forEach(p=>{cnt[p]=(cnt[p]||0)+1;});
  const sortedPats=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
  /* Pool : citations dont au moins un pattern correspond aux patterns observés */
  const pool=QUOTES.filter(q=>q.p&&q.p.some(p=>sortedPats.includes(p)));
  /* Si rien, fallback toutes les citations */
  return pool.length?pool:QUOTES.slice();
}
function cycleDashQuote(){
  if(!_dashQuotePool.length)return;
  _dashQuoteIdx=(_dashQuoteIdx+1)%_dashQuotePool.length;
  const q=_dashQuotePool[_dashQuoteIdx];
  const qEl=document.querySelector('.dash-quote');
  if(!qEl)return;
  const txt=qEl.querySelector('.dq-text');
  const auth=qEl.querySelector('.dq-author');
  if(!txt||!auth)return;
  qEl.classList.remove('cycling');void qEl.offsetWidth;
  qEl.classList.add('cycling');
  txt.textContent=q.text;
  auth.textContent=`— ${q.author}`;
}

   5. Contextes associés  (+ CTA sur tags négatifs)
   6. Activité vs impact (compact)  (+ CTA "Recadrer demain")
   7. Historique compact (calendrier + sparkline) */
function renderDashboard(){
  const days=filterDays(DF),wt=days.filter(d=>d.tasks.length>0);
  let h=`<div class="frow">${['7','30','all'].map(f=>`<button class="fbtn ${DF===f?'on':''}" onclick="setDF('${f}')">${f==='all'?'Tout':f+'j'}</button>`).join('')}</div>`;
  if(wt.length<3){h+=`<div class="empty-st">Enregistrez au moins 3 journées pour accéder aux patterns.</div>`;$('dash-in').innerHTML=h;return;}

  const ins=buildInsights(days);
  const impDist=buildImpactDist(days);

  // 1. ── Citation dynamique
  h+=renderDashQuote(days);

  // 2. ── Carte cognitive (insights déjà inclus en bas du SVG via generateCognitiveInsights)
  h+=`<div class="cognitive-dash reveal">${renderCognitiveMap(days)}</div>`;

  // 3. ── Patterns mentaux (cards récurrentes)
  if(ins&&ins.length>=2)h+=renderPatternCards(days,ins);

  // 4. ── Patterns détaillés : retiré v3.17 (doublonnait avec "Patterns mentaux" + carte cognitive)

  // 5. ── Contextes associés (tags positifs / à travailler + citation contextuelle)
  const ti=buildTagIns(days);
  if(ti&&(ti.pos.length||ti.neg.length)){
    const topTag=(ti.neg[0]&&ti.neg[0][0])||(ti.pos[0]&&ti.pos[0][0])||null;
    const topPat=topTag?TAG_TO_PATTERN[topTag]:null;
    const ctxQuote=topPat?quoteForPattern(topPat):null;
    h+=`<div class="ins-card reveal"><div class="ins-hdr"><div class="ins-title">Contextes associés</div></div>${ti.pos.length?`<div style="font-size:.5rem;color:var(--t3);margin-bottom:4px;letter-spacing:.04em">Présents lors des priorités accomplies (${ti.nW} jours)</div><div class="tag-chips">${ti.pos.map(([t,c])=>`<span class="tc-win">${esc(t)} <span class="tc-cnt">×${c}</span></span>`).join('')}</div>`:''}${ti.neg.length?`<div style="font-size:.5rem;color:rgba(210,180,140,.78);margin:9px 0 4px;letter-spacing:.04em">À travailler — tap pour préparer un plan (${ti.nN} jours)</div><div class="tag-chips">${ti.neg.map(([t,c])=>`<span class="tc-loss tc-clickable" onclick="nmTagClick(${JSON.stringify(t).replace(/"/g,'&quot;')})">${esc(t)} <span class="tc-cnt">×${c}</span></span>`).join('')}</div>`:''}${ctxQuote?`<div class="ins-q" style="margin-top:11px">« ${esc(ctxQuote.text)} »<div class="ins-q-auth">— ${esc(ctxQuote.author)}${topTag?` · en lien avec « ${esc(topTag)} »`:''}</div></div>`:''}</div>`;
  }

  // 6. ── Activité vs impact réel (compact, 1 micro-note dynamique max)
  if(impDist.total>=5){
    const lipDays=wt.filter(d=>detectPatterns(d).includes('low_impact_productivity')).length;
    const hiaDays=wt.filter(d=>detectPatterns(d).includes('high_impact_avoidance')).length;
    const impTotal=impDist.hi+impDist.mid+impDist.lo||1;
    const pctHi =Math.round(impDist.hi /impTotal*100);
    const pctMid=Math.round(impDist.mid/impTotal*100);
    const pctLo =Math.max(0,100-pctHi-pctMid);
    // Une seule micro-note dynamique courte — la plus saillante
    let microNote='';
    if(pctLo>=50)      microNote="Activité dominée par les tâches à faible impact.";
    else if(hiaDays>lipDays&&hiaDays>0) microNote=`${hiaDays}j où l'essentiel n'a pas été engagé.`;
    else if(lipDays>0) microNote=`${lipDays}j de remplissage à faible impact.`;
    else if(pctHi>=50) microNote="Activité concentrée sur le fort impact.";

    h+=`<div class="ins-card reveal"><div class="ins-hdr"><div class="ins-title">Activité vs impact</div><div class="ins-n">${impTotal} tâches</div></div>`;
    h+=`<div class="seg-bar" style="margin-top:10px">`;
    if(pctHi>0) h+=`<div class="seg-bar-cell high" style="flex:${pctHi}" title="Fort impact · ${impDist.hi} tâches · ${pctHi}%"></div>`;
    if(pctMid>0)h+=`<div class="seg-bar-cell mid"  style="flex:${pctMid}" title="Impact moyen · ${impDist.mid} tâches · ${pctMid}%"></div>`;
    if(pctLo>0) h+=`<div class="seg-bar-cell low"  style="flex:${pctLo}" title="Faible impact · ${impDist.lo} tâches · ${pctLo}%"></div>`;
    h+=`</div>`;
    h+=`<div class="seg-legend">`;
    h+=`<div class="seg-legend-item"><span class="seg-dot high"></span>Fort<span class="seg-pct">${pctHi}%</span></div>`;
    h+=`<div class="seg-legend-item"><span class="seg-dot mid"></span>Moyen<span class="seg-pct">${pctMid}%</span></div>`;
    h+=`<div class="seg-legend-item"><span class="seg-dot low"></span>Faible<span class="seg-pct">${pctLo}%</span></div>`;
    h+=`</div>`;
    if(microNote)h+=`<div style="font-size:.55rem;color:var(--t3);margin-top:9px;line-height:1.55">${microNote}</div>`;
    // CTA — n'apparaît que si l'activité réelle pose problème (Axe 1)
    const needsRecadr = pctLo>=50 || hiaDays>0 || lipDays>0;
    if(needsRecadr){
      const nudgeMsg = hiaDays>0
        ? `Demain, engage la priorité d'abord — ${hiaDays}j d'évitement détectés.`
        : `Demain, recadre ta MIT pour qu'elle ait vraiment de l'impact.`;
      h+=`<div class="ins-cta-row"><button class="ins-cta" onclick="nmNudgeToday(${JSON.stringify(nudgeMsg).replace(/"/g,'&quot;')})">Recadrer demain →</button></div>`;
    }
    h+=`</div>`;
  }

  // 7. ── Historique compact — calendrier wrap + sparkline pleine largeur sur jours peuplés
  const today=todayISO();
  h+=`<div class="ins-card reveal"><div class="ins-hdr"><div class="ins-title">Historique compact</div><div class="ins-n">30 jours</div></div>`;
  h+=`<div class="cal-grid" style="margin-bottom:14px">`;
  for(let i=29;i>=0;i--){
    const d=new Date(Date.now()-i*86400000).toISOString().slice(0,10);
    const day=DAYS[d],s=day?calcScore(day):null;
    const cls=!s||s.status==='empty'?'empty':s.status;
    h+=`<div class="ccell ${cls} ${d===today?'istoday':''}" title="${fmtS(d)}${s&&s.tot?' · '+s.pct+'%':''}" onclick="openOv('${d}')"></div>`;
  }
  h+=`</div>`;
  // Sparkline directement sous le calendrier (jours peuplés étalés sur toute la largeur)
  const scored=wt.slice().sort((a,b)=>a.date.localeCompare(b.date));
  if(scored.length>=3){
    const vals=scored.map(d=>calcScore(d).pct);
    const W=500,H=44,pts=vals.map((v,i)=>({x:(i/(vals.length-1))*W,y:H-(v/100)*H}));
    const ln=pts.map((p,i)=>`${i===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
    const last=pts[pts.length-1];
    h+=`<div class="spark-hdr" style="margin-top:4px"><span class="spark-lbl">Tendance du score</span><span class="spark-cur">${vals[vals.length-1]}% — ${fmtS(scored[scored.length-1].date)}</span></div><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:44px;display:block"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(230,232,238,.18)"/><stop offset="100%" stop-color="rgba(230,232,238,.01)"/></linearGradient></defs><path d="${ln} L${W},${H} L0,${H} Z" fill="url(#sg)"/><path class="spark-line" d="${ln}" fill="none" stroke="rgba(230,232,238,.58)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle class="spark-dot" cx="${last.x.toFixed(1)}" cy="${last.y.toFixed(1)}" r="3" fill="rgba(235,238,245,.88)"/></svg><div style="display:flex;justify-content:space-between;font-size:.5rem;color:var(--t4);margin-top:3px"><span>${fmtS(scored[0].date)}</span><span>${fmtS(scored[scored.length-1].date)}</span></div>`;
  }
  h+=`</div>`;

  // 8. ── Conclusion — "Ton prochain mouvement" (Axe 1, repositionné v3.17)
  //    Pont vers l'action en fin de lecture : après avoir vu les patterns,
  //    l'utilisateur a une porte de sortie concrète.
  h+=renderNextMove(days);

  $('dash-in').innerHTML=h;

  /* Axe 2 — engagement visuel : initialise le pool de citations cyclables,
     puis lance les reveal + count-up + sparkline draw. */
  _dashQuotePool=buildDashQuotePool(days);
  _dashQuoteIdx=0;
  applyRevealAndAnimations($('dash-in'));
  /* v3.17 — Tech zoom sur carte cognitive */
  attachZoomListeners();
  setZoomCSS(0);
}
function setDF(f){DF=f;renderDashboard();}

function goPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));

  if(id==='pg-today')   renderToday();
