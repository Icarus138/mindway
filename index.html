/* ════════════════════════════════════════════════════════════
   v3.11 — GUIDED BRAIN DUMP
   Flow d'entrée spontané : capture → clarification → MIT → mood
   Ne casse rien. Réutilise les structures task existantes (champ `t`).
═══════════════════════════════════════════════════════════ */
let GUIDED_STATE={open:false,step:0,date:null,drafts:[],currentIdx:0,mitId:null,moodLocal:{}};
const GUIDED_TIME_OPTS=[5,10,30,45,60];

function guidedDismissToday(){
  const day=getDay(todayISO());
  day.guidedDismissed=true;
  day.updatedAt=new Date().toISOString();
  saveDays();renderToday();
}

function startGuidedBrainDump(){
  const date=todayISO();const day=getDay(date);
  GUIDED_STATE={open:true,step:1,date,drafts:[],currentIdx:0,mitId:null,moodLocal:{...day.mood},tagsLocal:[...(day.tags||[])]};
  const root=$('guided-root');if(!root)return;
  root.classList.add('open');
  renderGuidedStep();
  // focus l'input à l'ouverture
  setTimeout(()=>{const i=document.getElementById('guided-input');if(i)i.focus();},120);
}

function closeGuided(dismissDay){
  GUIDED_STATE.open=false;
  const root=$('guided-root');if(root){root.classList.remove('open');root.innerHTML='';}
  if(dismissDay){
    const day=getDay(todayISO());
    day.guidedDismissed=true;
    day.updatedAt=new Date().toISOString();
    saveDays();
  }
}

function guidedOverlayClick(e){
  // Click sur l'overlay (hors modal) → ferme sans marquer dismiss (peut rouvrir via bouton)
  if(e.target.id==='guided-root'){closeGuided(false);}
}

function renderGuidedStep(){
  const root=$('guided-root');if(!root)return;
  const step=GUIDED_STATE.step;
  if(step===0)return renderGuidedIntro();
  if(step===1)return renderGuidedCapture();
  if(step===2)return renderGuidedClarify();
  if(step===3)return renderGuidedMITChoice();
  if(step===4)return renderGuidedMood();
  if(step===5)return renderGuidedIfThenSuggestion();
}

function renderGuidedCapture(){
  const root=$('guided-root');
  const drafts=GUIDED_STATE.drafts;
  const canContinue=drafts.length>0;
  let h='<div class="guided-modal" onclick="event.stopPropagation()">';
  h+='<button class="guided-close" onclick="closeGuided(false)" aria-label="Fermer">×</button>';
  h+='<div class="guided-eyebrow">Vider l\'esprit</div>';
  h+='<div class="guided-title">Qu\'est-ce que tu veux accomplir aujourd\'hui&nbsp;?</div>';
  h+='<div class="guided-sub">Note tout ce qui te vient. On classera ensuite.</div>';
  h+='<form class="guided-input-row" onsubmit="event.preventDefault();guidedAddDraftTask()" autocomplete="off">';
  h+='<input id="guided-input" class="guided-input" type="text" placeholder="Écrire une tâche…" maxlength="120"/>';
  h+='<button type="submit" class="guided-add-btn">Ajouter</button>';
  h+='</form>';
  if(drafts.length){
    h+='<div class="guided-drafts">';
    drafts.forEach((d,i)=>{
      h+=`<div class="guided-task-row"><span class="guided-task-row-idx">${i+1}.</span><span class="guided-task-row-title">${esc(d.title)}</span><button class="guided-task-row-del" onclick="guidedRemoveDraft('${d.id}')" aria-label="Retirer">×</button></div>`;
    });
    h+='</div>';
  }
  h+='<div class="guided-actions">';
  h+=`<button class="guided-btn ghost" onclick="closeGuided(true)">Passer</button>`;
  h+=`<button class="guided-btn ${canContinue?'primary':''}" ${canContinue?'':'disabled style="opacity:.42;cursor:not-allowed"'} onclick="guidedNextFromCapture()">Continuer →</button>`;
  h+='</div>';
  h+='</div>';
  root.innerHTML=h;
}

function guidedAddDraftTask(){
  const inp=document.getElementById('guided-input');if(!inp)return;
  const v=inp.value.trim();if(!v)return;
  GUIDED_STATE.drafts.push({id:uid(),title:v,impact:null,urgency:null,t:null,score:0});
  inp.value='';
  renderGuidedCapture();
  setTimeout(()=>{const i=document.getElementById('guided-input');if(i)i.focus();},20);
}

function guidedRemoveDraft(id){
  GUIDED_STATE.drafts=GUIDED_STATE.drafts.filter(d=>d.id!==id);
  renderGuidedCapture();
}

function guidedNextFromCapture(){
  if(!GUIDED_STATE.drafts.length)return;
  GUIDED_STATE.step=2;
  GUIDED_STATE.currentIdx=0;
  // pré-remplir avec valeurs neutres
  GUIDED_STATE.drafts.forEach(d=>{
    if(d.impact===null)d.impact=1;
    if(d.urgency===null)d.urgency=1;
    if(d.t===null)d.t=30;
  });
  renderGuidedStep();
}

function renderGuidedClarify(){
  const root=$('guided-root');
  const drafts=GUIDED_STATE.drafts;
  const idx=GUIDED_STATE.currentIdx;
  const total=drafts.length;
  const draft=drafts[idx];if(!draft){GUIDED_STATE.step=3;return renderGuidedStep();}
  const IMPACT_LBL=['faible','utile','important','essentiel'];
  const URGENCY_LBL=['pas urgent','bientôt','aujourd\'hui','immédiat'];
  let h='<div class="guided-modal" onclick="event.stopPropagation()">';
  h+='<button class="guided-close" onclick="closeGuided(false)" aria-label="Fermer">×</button>';
  h+=`<div class="guided-progress"><span>Clarification</span><div class="guided-progress-bar"><div class="guided-progress-fill" style="width:${Math.round((idx+1)/total*100)}%"></div></div><span>${idx+1}/${total}</span></div>`;
  h+='<div class="guided-clarify-task">';
  h+=`<div class="guided-clarify-title">${esc(draft.title)}</div>`;
  // Impact
  h+='<div class="guided-chip-group">';
  h+=`<div class="guided-chip-lbl"><span>Impact</span><span class="guided-chip-lbl-val">${IMPACT_LBL[draft.impact]||'—'}</span></div>`;
  h+='<div class="guided-chips">';
  [0,1,2,3].forEach(v=>{h+=`<button class="guided-chip ${draft.impact===v?'on':''}" onclick="guidedSetMeta('${draft.id}','impact',${v})">${v}<span class="guided-chip-sub">${IMPACT_LBL[v]}</span></button>`;});
  h+='</div></div>';
  // Urgence
  h+='<div class="guided-chip-group">';
  h+=`<div class="guided-chip-lbl"><span>Urgence</span><span class="guided-chip-lbl-val">${URGENCY_LBL[draft.urgency]||'—'}</span></div>`;
  h+='<div class="guided-chips">';
  [0,1,2,3].forEach(v=>{h+=`<button class="guided-chip ${draft.urgency===v?'on':''}" onclick="guidedSetMeta('${draft.id}','urgency',${v})">${v}<span class="guided-chip-sub">${URGENCY_LBL[v]}</span></button>`;});
  h+='</div></div>';
  // Temps
  h+='<div class="guided-chip-group" style="margin-bottom:4px">';
  h+=`<div class="guided-chip-lbl"><span>Temps estimé</span><span class="guided-chip-lbl-val">${fmtMin(draft.t)}</span></div>`;
  h+='<div class="guided-chips">';
  GUIDED_TIME_OPTS.forEach(v=>{const lbl=v>=60?'>1h':fmtMin(v);h+=`<button class="guided-chip ${draft.t===v?'on':''}" onclick="guidedSetMeta('${draft.id}','t',${v})">${lbl}</button>`;});
  h+='</div></div>';
  h+='</div>';
  h+='<div class="guided-actions">';
  if(idx>0)h+=`<button class="guided-btn" onclick="guidedClarifyPrev()">← Précédent</button>`;
  h+=`<button class="guided-btn primary" onclick="guidedClarifyNext()">${idx===total-1?'Voir le tri →':'Suivant →'}</button>`;
  h+='</div>';
  h+='</div>';
  root.innerHTML=h;
}

function guidedSetMeta(id,field,v){
  const d=GUIDED_STATE.drafts.find(x=>x.id===id);if(!d)return;
  d[field]=v;
  d.score=(d.impact||0)+(d.urgency||0);
  renderGuidedClarify();
}

function guidedClarifyNext(){
  if(GUIDED_STATE.currentIdx<GUIDED_STATE.drafts.length-1){
    GUIDED_STATE.currentIdx++;
    renderGuidedClarify();
  } else {
    GUIDED_STATE.step=3;
    renderGuidedStep();
  }
}
function guidedClarifyPrev(){
  if(GUIDED_STATE.currentIdx>0){GUIDED_STATE.currentIdx--;renderGuidedClarify();}
}

function renderGuidedMITChoice(){
  const root=$('guided-root');
  // tri par score desc (tie-break : temps plus long en premier = plus structurant)
  const sorted=[...GUIDED_STATE.drafts].sort((a,b)=>(b.score-a.score)||((b.t||0)-(a.t||0)));
  const topId=sorted[0]?.id;
  let h='<div class="guided-modal" onclick="event.stopPropagation()">';
  h+='<button class="guided-close" onclick="closeGuided(false)" aria-label="Fermer">×</button>';
  h+='<div class="guided-eyebrow">Choisir l\'essentiel</div>';
  h+='<div class="guided-title">Laquelle rendrait ta journée gagnante&nbsp;?</div>';
  h+='<div class="guided-mit-help">Le score aide à voir les priorités, mais la MIT reste ton choix.</div>';
  h+='<div class="guided-mit-list">';
  sorted.forEach(d=>{
    const isTop=d.id===topId;
    const isSelected=GUIDED_STATE.mitId===d.id;
    h+=`<button class="guided-mit-card ${isTop?'top':''}" style="${isSelected?'border-color:rgba(235,238,245,.55);background:rgba(235,238,245,.08)':''}" onclick="guidedChooseMIT('${d.id}')"><div class="guided-mit-body"><div class="guided-mit-title">${esc(d.title)}</div><div class="guided-mit-meta"><span>Impact ${d.impact}</span><span>Urgence ${d.urgency}</span><span>${fmtMin(d.t)}</span></div></div><span class="guided-mit-score">${d.score}</span></button>`;
  });
  h+='</div>';
  h+='<div class="guided-actions">';
  h+=`<button class="guided-btn" onclick="GUIDED_STATE.step=2;GUIDED_STATE.currentIdx=GUIDED_STATE.drafts.length-1;renderGuidedStep();">← Retour</button>`;
  h+=`<button class="guided-btn ${GUIDED_STATE.mitId?'primary':''}" ${GUIDED_STATE.mitId?'':'disabled style="opacity:.42;cursor:not-allowed"'} onclick="GUIDED_STATE.step=4;renderGuidedStep();">Continuer →</button>`;
  h+='</div>';
  h+='</div>';
  root.innerHTML=h;
}

function guidedChooseMIT(id){
  GUIDED_STATE.mitId=id;
  renderGuidedMITChoice();
}

function renderGuidedMood(){
  const root=$('guided-root');
  // v3.11.1 — Toutes les métriques + contexte rapide
  const PRIMARY_METRICS=[
    {k:'energie',l:'Énergie'},
    {k:'clarte',l:'Clarté mentale'},
    {k:'motivation',l:'Motivation'},
    {k:'optimisme',l:'Optimisme'},
  ];
  const FRICTION_METRICS=[
    {k:'stress',l:'Stress'},
    {k:'dispersion',l:'Dispersion'},
    {k:'humeur',l:'Humeur'},
  ];
  // 6 tags les plus utiles pour ouvrir la journée — le reste reste accessible sur Today
  const QUICK_TAGS=['fatigue','bonne concentration','motivation élevée','anxiété','besoin de récupération','état créatif'];
  if(!GUIDED_STATE.tagsLocal)GUIDED_STATE.tagsLocal=[];

  h+='<div class="guided-title">Avant de commencer, comment es-tu aujourd\'hui&nbsp;?</div>';
  h+='<div class="guided-sub">Lecture brute, pas un jugement. Remplis ce qui te parle, on classera ensuite.</div>';

  // Bloc ressources (positives)
  h+='<div class="guided-eyebrow" style="margin-top:6px">Ressources</div>';
  PRIMARY_METRICS.forEach(m=>{
    const cur=GUIDED_STATE.moodLocal[m.k]||3;
    h+=`<div class="guided-mood-row"><span class="guided-mood-lbl">${m.l}</span><div class="guided-mood-btns">${[1,2,3,4,5].map(v=>`<button class="guided-mood-btn ${cur===v?'on':''}" onclick="guidedSetMoodLocal('${m.k}',${v})">${v}</button>`).join('')}</div></div>`;
  });

  // Bloc frictions
  h+='<div class="guided-eyebrow" style="margin-top:14px">Frictions</div>';
  FRICTION_METRICS.forEach(m=>{
    const cur=GUIDED_STATE.moodLocal[m.k]||3;
    h+=`<div class="guided-mood-row"><span class="guided-mood-lbl">${m.l}</span><div class="guided-mood-btns">${[1,2,3,4,5].map(v=>`<button class="guided-mood-btn ${cur===v?'on':''}" onclick="guidedSetMoodLocal('${m.k}',${v})">${v}</button>`).join('')}</div></div>`;
  });

  // Bloc contexte rapide
  h+='<div class="guided-eyebrow" style="margin-top:14px">Contexte du jour <span style="color:var(--t4);letter-spacing:.04em;text-transform:none">— optionnel</span></div>';
  h+='<div class="guided-chips" style="margin-bottom:10px">';
  QUICK_TAGS.forEach(t=>{
    const on=GUIDED_STATE.tagsLocal.includes(t);
    h+=`<button class="guided-chip ${on?'on':''}" style="flex:0 1 auto;min-width:auto;padding:6px 11px;font-size:.55rem" onclick="guidedToggleTagLocal('${t}')">${t}</button>`;
  });
  h+='</div>';

  // Invitation à continuer sur Today
  h+='<div style="font-size:.55rem;color:var(--t3);line-height:1.65;margin:14px 0 4px;padding:10px 12px;background:rgba(255,255,255,.022);border-left:2px solid var(--border-hi);border-radius:0 6px 6px 0">Pas tout&nbsp;? Pas de souci. Tu peux affiner les autres métriques, ajouter une note libre ou choisir d\'autres contextes directement sur la page <strong style="color:var(--t2)">Jour</strong>.</div>';

  // Détecter friction dans le moodLocal pour proposer un If-Then
  const ml=GUIDED_STATE.moodLocal||{};
  const hasFriction=(ml.stress||0)>=4||(ml.dispersion||0)>=4||(ml.energie||3)<=2;

  h+='<div class="guided-actions">';
  h+=`<button class="guided-btn" onclick="GUIDED_STATE.step=3;renderGuidedStep();">← Retour</button>`;
  if(hasFriction){
    h+=`<button class="guided-btn primary" onclick="GUIDED_STATE.step=5;renderGuidedStep();">Continuer →</button>`;
  } else {
    h+=`<button class="guided-btn primary" onclick="commitGuidedTasksToDay()">Terminer</button>`;
  }
  h+='</div>';
  h+='</div>';
  root.innerHTML=h;
}

function guidedSetMoodLocal(k,v){GUIDED_STATE.moodLocal[k]=v;renderGuidedMood();}
function guidedToggleTagLocal(t){
  if(!GUIDED_STATE.tagsLocal)GUIDED_STATE.tagsLocal=[];
  const i=GUIDED_STATE.tagsLocal.indexOf(t);
  if(i>=0)GUIDED_STATE.tagsLocal.splice(i,1);else GUIDED_STATE.tagsLocal.push(t);
  renderGuidedMood();
}

/* ── Step 5 — Suggestion If-Then basée sur la friction détectée (v3.12) ── */
function renderGuidedIfThenSuggestion(){
  const root=$('guided-root');
  const ml=GUIDED_STATE.moodLocal||{};
  // Détecter friction dominante
  let dominant='dispersion';
  let dominantLbl='dispersion';
  let dominantArticle='la';
  if((ml.stress||0)>=4){dominant='stress';dominantLbl='stress';dominantArticle='au';}
  else if((ml.dispersion||0)>=4){dominant='dispersion';dominantLbl='dispersion';dominantArticle='à la';}
  else if((ml.energie||3)<=2){dominant='energie';dominantLbl='basse énergie';dominantArticle='à la';}

  // Suggestions pré-écrites par friction
  const SUGGESTIONS={
    stress:[
      {trigger:"je sens le stress monter",response:"je prends 3 respirations longues avant de continuer"},
      {trigger:"je me sens dépassé",response:"je réalise une micro-tâche simple pour reprendre l'élan"},
      {trigger:"la tension monte avant la priorité",response:"je découpe la tâche en 1 seule action de 5 min"},
    ],
    dispersion:[
      {trigger:"je commence à scroller sans but",response:"je ferme l'app et j'ouvre la priorité du jour"},
      {trigger:"mon attention saute d'une tâche à l'autre",response:"je note ce qui me distrait, puis je reviens à la priorité"},
      {trigger:"je sens la dispersion arriver",response:"je fais une seule action de 5 min sur la MIT, sans débat"},
    ],
    energie:[
      {trigger:"mon énergie tombe en milieu de journée",response:"je fais une pause de 10 min hors écran avant de reprendre"},
      {trigger:"je commence sans envie",response:"je m'engage juste à ouvrir le fichier, sans rien écrire"},
      {trigger:"je n'ai pas la force d'attaquer la priorité",response:"je fais 1 action liée à la priorité, même infime"},
    ],
  };
  const suggested=SUGGESTIONS[dominant]||SUGGESTIONS.dispersion;
  if(!GUIDED_STATE.ifThenDraft)GUIDED_STATE.ifThenDraft={enabled:false,trigger:'',response:'',pickedIdx:null};
  const draft=GUIDED_STATE.ifThenDraft;

  let h='<div class="guided-modal" onclick="event.stopPropagation()">';
  h+='<button class="guided-close" onclick="closeGuided(false)" aria-label="Fermer">×</button>';
  h+='<div class="guided-eyebrow">Plan If-Then · Optionnel</div>';
  h+=`<div class="guided-title">Prépare une réponse ${dominantArticle} <span style="color:rgba(210,180,140,.9)">${dominantLbl}</span>&nbsp;?</div>`;

  // Explication du système — courte, efficiente, sans jargon
  h+='<div class="guided-sub" style="background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:7px;padding:11px 13px;margin-bottom:14px;line-height:1.7">';
  h+='Un plan <strong style="color:var(--t1);font-weight:400">If-Then</strong> est une phrase courte que tu prépares <em>à froid</em>. ';
  h+='Quand la friction arrive <em>à chaud</em>, tu n\'as plus besoin de décider — tu exécutes. ';
  h+='Ça raccourcit le temps entre la dérive et le retour à l\'action.';
  h+='</div>';

  // Liste de suggestions
  h+='<div class="guided-eyebrow" style="margin-top:6px">Suggestions adaptées</div>';
  h+='<div class="guided-mit-list" style="max-height:32vh">';
  suggested.forEach((s,i)=>{
    const isPicked=draft.pickedIdx===i;
    h+=`<button class="guided-mit-card ${isPicked?'top':''}" style="${isPicked?'border-color:rgba(235,238,245,.55);background:rgba(235,238,245,.08)':''}" onclick="guidedPickIfThenSuggestion(${i},'${dominant}')">`;
    h+='<div class="guided-mit-body">';
    h+=`<div style="font-size:.6rem;color:var(--t3);margin-bottom:3px"><em style="color:var(--t2);font-style:normal">Si</em> ${esc(s.trigger)}</div>`;
    h+=`<div style="font-size:.66rem;color:rgba(228,232,242,.86);line-height:1.4">→ ${esc(s.response)}</div>`;
    h+='</div></button>';
  });
  h+='</div>';

  // Édition libre du plan (si une suggestion est cliquée OU si l'utilisateur veut écrire le sien)
  if(draft.pickedIdx!==null||draft.trigger||draft.response){
    h+='<div class="guided-eyebrow" style="margin-top:14px">Ton plan</div>';
    h+='<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px">';
    h+=`<input class="guided-input" id="guided-it-trigger" type="text" placeholder="Si… (déclencheur observé)" value="${esc(draft.trigger)}" oninput="GUIDED_STATE.ifThenDraft.trigger=this.value"/>`;
    h+=`<input class="guided-input" id="guided-it-response" type="text" placeholder="Alors… (réponse simple, 5 min max)" value="${esc(draft.response)}" oninput="GUIDED_STATE.ifThenDraft.response=this.value"/>`;
    h+='</div>';
  } else {
    h+='<div style="text-align:center;margin:14px 0 4px"><button class="guided-trigger-link" onclick="GUIDED_STATE.ifThenDraft={enabled:false,trigger:\'\',response:\'\',pickedIdx:-1};renderGuidedIfThenSuggestion();">Écrire mon propre plan</button></div>';
  }

  const canSave=(draft.trigger||'').trim().length>=3 && (draft.response||'').trim().length>=3;
  h+='<div class="guided-actions">';
  h+=`<button class="guided-btn" onclick="GUIDED_STATE.step=4;renderGuidedStep();">← Retour</button>`;
  h+=`<button class="guided-btn ghost" onclick="GUIDED_STATE.ifThenDraft={enabled:false,trigger:'',response:'',pickedIdx:null};commitGuidedTasksToDay()">Passer</button>`;
  h+=`<button class="guided-btn ${canSave?'primary':''}" ${canSave?'':'disabled style="opacity:.42;cursor:not-allowed"'} onclick="guidedSaveIfThenAndCommit()">Créer & terminer</button>`;
  h+='</div>';
  h+='</div>';
  root.innerHTML=h;
}

function guidedPickIfThenSuggestion(i,dominant){
  const SUGGESTIONS={
    stress:[
      {trigger:"je sens le stress monter",response:"je prends 3 respirations longues avant de continuer"},
      {trigger:"je me sens dépassé",response:"je réalise une micro-tâche simple pour reprendre l'élan"},
      {trigger:"la tension monte avant la priorité",response:"je découpe la tâche en 1 seule action de 5 min"},
    ],
    dispersion:[
      {trigger:"je commence à scroller sans but",response:"je ferme l'app et j'ouvre la priorité du jour"},
      {trigger:"mon attention saute d'une tâche à l'autre",response:"je note ce qui me distrait, puis je reviens à la priorité"},
      {trigger:"je sens la dispersion arriver",response:"je fais une seule action de 5 min sur la MIT, sans débat"},
    ],
    energie:[
      {trigger:"mon énergie tombe en milieu de journée",response:"je fais une pause de 10 min hors écran avant de reprendre"},
      {trigger:"je commence sans envie",response:"je m'engage juste à ouvrir le fichier, sans rien écrire"},
      {trigger:"je n'ai pas la force d'attaquer la priorité",response:"je fais 1 action liée à la priorité, même infime"},
    ],
  };
  const s=(SUGGESTIONS[dominant]||SUGGESTIONS.dispersion)[i];
  if(!s)return;
  GUIDED_STATE.ifThenDraft={enabled:true,trigger:s.trigger,response:s.response,pickedIdx:i,patternType:dominant};
  renderGuidedIfThenSuggestion();
}

function guidedSaveIfThenAndCommit(){
  const d=GUIDED_STATE.ifThenDraft;
  if(d&&(d.trigger||'').trim().length>=3&&(d.response||'').trim().length>=3){
    const patternMap={stress:'high_stress',dispersion:'high_dispersion',energie:'low_energy'};
    STRATEGIES.push({
      id:uid(),
      trigger:d.trigger.trim(),
      response:d.response.trim(),
      patternType:patternMap[d.patternType]||'',
      createdAt:new Date().toISOString(),
      updatedAt:new Date().toISOString(),
    });
    saveStrategies();
  }
  commitGuidedTasksToDay();
}

function commitGuidedTasksToDay(){
  const date=GUIDED_STATE.date||todayISO();
  const day=getDay(date);
  const now=new Date().toISOString();
  const drafts=GUIDED_STATE.drafts;
  const mitId=GUIDED_STATE.mitId;
  // 1) MIT en premier
  const mitDraft=drafts.find(d=>d.id===mitId);
  let deferred=0;
  if(mitDraft && !day.tasks.some(t=>t.type==='MIT')){
    day.tasks.push({
      id:uid(),type:'MIT',title:mitDraft.title,
      impact:cl(mitDraft.impact||3,0,3),urgency:cl(mitDraft.urgency||2,0,3),
      t:cl(mitDraft.t||TIME_DEFAULT.MIT,5,TIME_CAP.MIT),
      completed:false,createdAt:now,completedAt:null
    });
  }
  // 2) Autres tâches : MICRO si t<=10, sinon SECONDARY. Respecte les limites.
  let secCount=day.tasks.filter(t=>t.type==='SECONDARY').length;
  let microCount=day.tasks.filter(t=>t.type==='MICRO').length;
  drafts.forEach(d=>{
    if(d.id===mitId)return;
    const isMicro=(d.t||30)<=10;
    let type=isMicro?'MICRO':'SECONDARY';
    if(type==='MICRO'&&microCount>=5){deferred++;return;}
    if(type==='SECONDARY'&&secCount>=3){
      // tente MICRO si <=10min, sinon backlog
      if((d.t||30)<=TIME_CAP.MICRO&&microCount<5){type='MICRO';}
      else{deferred++;return;}
    }
    const cappedT=type==='SECONDARY'?Math.min(d.t||TIME_DEFAULT.SECONDARY,TIME_CAP.SECONDARY):Math.min(d.t||TIME_DEFAULT.MICRO,TIME_CAP.MICRO);
    day.tasks.push({
      id:uid(),type,title:d.title,
      impact:cl(d.impact||1,0,3),urgency:cl(d.urgency||1,0,3),
      t:cappedT,
      completed:false,createdAt:now,completedAt:null
    });
    if(type==='MICRO')microCount++;else secCount++;
  });
  // 3) Mood
  if(GUIDED_STATE.moodLocal){
    Object.keys(GUIDED_STATE.moodLocal).forEach(k=>{
      if(typeof GUIDED_STATE.moodLocal[k]==='number')day.mood[k]=GUIDED_STATE.moodLocal[k];
    });
  }
  // 3.bis) Tags contextuels (v3.11.1)
  if(GUIDED_STATE.tagsLocal&&GUIDED_STATE.tagsLocal.length){
    if(!day.tags)day.tags=[];
    GUIDED_STATE.tagsLocal.forEach(t=>{if(!day.tags.includes(t))day.tags.push(t);});
  }
  day.guidedCompleted=true;
  day.guidedDismissed=true;
  day.updatedAt=now;
  saveDays();
  closeGuided(false);
  renderToday();
  renderNavPip();
  if(deferred>0){
    toast(`Journée clarifiée — ${deferred} tâche${deferred>1?'s':''} en attente pour éviter la surcharge.`,3200);
  } else {
    toast("Journée clarifiée.");
  }
}

/* ── INIT ── */
function init(){
  loadDays();
  loadStrategies();
  migrateDays();
  // Inject demo data if empty
  if(Object.keys(DAYS).length<3){
    DAYS=genDemo();saveDays();
    STRATEGIES=DEMO_STRATS;saveStrategies();
  }
  const nd=$('nav-date');
  if(nd){const n=new Date();nd.innerHTML=n.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})+'<br>'+n.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});}
  renderToday();
  renderNavPip();
}
init();
</script>
