<style>
/* ================= TOKENS ================= */
:root,[data-theme="light"]{
  /* ════ DESIGN SYSTEM — MODE CLAIR MAÎTRE (planche minérale) ════
     Lumière commune : haut-gauche → ombres bas-droit. */
  /* canvas & atmosphère */
  --canvas:#F6F7F8; --canvas-deep:#EFF0EE; --atmosphere:#E9EBE8;
  /* surfaces — matériaux */
  --surface-base:#FAFAF9;
  --surface-raised:#FDFDFC;
  --surface-recessed:#ECEEEB;
  --surface-matte:#F1F2F0;
  --glass-thin:rgba(250,250,249,.55);          /* barres : très translucide */
  --surface-glass:rgba(251,251,250,.7);        /* verre régulier : cartes flottantes, sheets */
  --stone-hi:rgba(253,253,252,.93);            /* pierre dépolie : cartes de contenu */
  --stone-lo:rgba(249,249,248,.9);
  --surface-hero-a:#FDFDFC; --surface-hero-b:#F0F1EF;
  /* texte */
  --text-primary:#26282A; --text-secondary:#63675F; --text-tertiary:#9EA29D; --text-disabled:#C6C9C5;
  /* bords & séparations */
  --border-soft:rgba(38,40,38,.08); --border-highlight:rgba(255,255,255,.85); --divider:rgba(38,40,38,.06);
  /* ombres : contact courte + diffuse décalée bas-droit + bord éclairé */
  --shadow-soft:0 1px 2px rgba(30,32,30,.05),1px 6px 16px rgba(30,32,30,.055),inset 0 1px 0 var(--border-highlight);
  --shadow-raised:0 1px 2px rgba(30,32,30,.06),2px 10px 26px rgba(30,32,30,.075),inset 0 1px 0 var(--border-highlight);
  --shadow-hero:0 2px 4px rgba(30,32,30,.06),4px 22px 48px rgba(30,32,30,.10),inset 0 1px 0 rgba(255,255,255,.92);
  --shadow-inset:inset 0 2px 6px rgba(30,32,30,.05);
  /* lumière & reflets */
  --highlight-soft:rgba(255,255,255,.55); --highlight-strong:rgba(255,255,255,.95);
  --reflection:linear-gradient(118deg,rgba(255,255,255,.55),rgba(255,255,255,0) 44%);
  /* accents */
  --accent:#4C4F4B; --accent-2:#6F736E;
  --accent-soft:rgba(76,79,75,.08); --accent-line:rgba(76,79,75,.28);
  --warm:#8A7355; --warm-soft:rgba(138,115,85,.10); --warm-line:rgba(138,115,85,.36);
  --success:var(--warm); --warning:var(--warm);
  /* scène */
  --scene-mist:236,238,240; --scene-form:96,92,84; --scene-hi:255,255,255;
  /* encres des paysages illustrés (du lointain au proche) */
  --sc-i1:#D8DBD9; --sc-i2:#CDD1CE; --sc-i3:#BFC4C0; --sc-i4:#AAAFAA; --sc-i5:#8F948F;
  --sc-strong:#6F736E; --sc-line:#A7ABA7;
  --sc-sand-hi:#EFE9DD; --sc-sand-sh:#DCD2BF; --sc-sand-dk:#C9BCA4;
  --sc-cl-body:#E8EAE9; --sc-cl-hi:#FDFDFC; --sc-cl-sh:#D2D5D3;
  /* rythme */
  --ease:cubic-bezier(.22,.8,.28,1); --spring:cubic-bezier(.34,1.45,.5,1);
  --r:18px; --r-sm:12px; --r-lg:28px;
  /* ── alias de compatibilité (pilotés uniquement par la sémantique) ── */
  --bg:var(--canvas); --bg2:var(--canvas-deep);
  --s1:var(--surface-base); --s2:var(--surface-matte); --s3:var(--surface-recessed);
  --line:var(--border-soft); --line2:var(--divider);
  --t1:var(--text-primary); --t2:var(--text-secondary); --t3:var(--text-tertiary);
  --gold:var(--accent); --gold-2:var(--accent-2);
  --gold-soft:var(--accent-soft); --gold-line:var(--accent-line);
  --amber:var(--warm);
  --e1:var(--shadow-soft); --e2:var(--shadow-raised); --e3:var(--shadow-hero);
  --btn-bg:#26282A; --btn-fg:#F6F7F8;
  --mtn:var(--surface-recessed); --mtn2:var(--surface-matte);
  --shadow:var(--shadow-raised);
}
[data-theme="dark"]{
  /* ════ TRANSPOSITION NOCTURNE — même monde, lumière argentée (base Obsidian) ════ */
  --canvas:#0C0C0E; --canvas-deep:#070708; --atmosphere:#101113;
  --surface-base:#111214;
  --surface-raised:#17181B;
  --surface-recessed:#0E0F11;
  --surface-matte:#15161A;
  --glass-thin:rgba(13,14,16,.52);
  --surface-glass:rgba(18,19,22,.66);
  --stone-hi:rgba(26,27,30,.94);
  --stone-lo:rgba(16,17,19,.92);
  --surface-hero-a:#1A1B1E; --surface-hero-b:#101113;
  --text-primary:#ECEAE6; --text-secondary:#A5A29C; --text-tertiary:#6C6A66; --text-disabled:#45444A;
  --border-soft:rgba(255,255,255,.06); --border-highlight:rgba(255,255,255,.055); --divider:rgba(255,255,255,.05);
  --shadow-soft:0 1px 2px rgba(0,0,0,.28),1px 7px 18px rgba(0,0,0,.28),inset 0 1px 0 var(--border-highlight);
  --shadow-raised:0 2px 4px rgba(0,0,0,.32),2px 12px 30px rgba(0,0,0,.34),inset 0 1px 0 var(--border-highlight);
  --shadow-hero:0 3px 6px rgba(0,0,0,.38),4px 24px 54px rgba(0,0,0,.46),inset 0 1px 0 rgba(255,255,255,.07);
  --shadow-inset:inset 0 2px 8px rgba(0,0,0,.3);
  --highlight-soft:rgba(255,255,255,.05); --highlight-strong:rgba(255,255,255,.1);
  --reflection:linear-gradient(118deg,rgba(255,255,255,.085),rgba(255,255,255,0) 44%);
  --accent:#D3D0C8; --accent-2:#B3B0A8;
  --accent-soft:rgba(211,208,200,.08); --accent-line:rgba(211,208,200,.30);
  --warm:#B7A98C; --warm-soft:rgba(183,169,140,.10); --warm-line:rgba(183,169,140,.34);
  --scene-mist:200,204,210; --scene-form:210,214,222; --scene-hi:236,239,245;
  --sc-i1:#16171A; --sc-i2:#1B1C20; --sc-i3:#222327; --sc-i4:#2A2C30; --sc-i5:#33353A;
  --sc-strong:#43464C; --sc-line:#6C6A66;
  --sc-sand-hi:#2B2922; --sc-sand-sh:#201E19; --sc-sand-dk:#171612;
  --sc-cl-body:#1E2023; --sc-cl-hi:#34373C; --sc-cl-sh:#121316;
  --btn-bg:#ECEAE6; --btn-fg:#0C0C0E;
}

/* ================= BASE ================= */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{background:var(--canvas)}
@media(max-width:440px){#phone{box-shadow:none}}
body{
  background:var(--bg2); color:var(--t1);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font:inherit;font-size:16px;color:var(--t1)}
::selection{background:var(--gold-soft)}
#phone{position:relative;max-width:430px;margin:0 auto;min-height:100dvh;background:var(--bg);
  box-shadow:0 0 0 1px var(--line2)}
.scenery{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);
  z-index:0;pointer-events:none;overflow:hidden}
/* ════ MOTEUR D'AMBIANCE — matière atmosphérique, univers « nuage / voile laiteux » ════
   Système déclinable par variables. Aucun motif répété : les volumes naissent de
   radial-gradients organiques + blur par plan + éclairage directionnel (haut-gauche).
   Déclinaisons futures : surcharger les variables --at-* (désert / montagne / cosmos),
   valeurs indicatives en commentaire en fin de bloc. */
:root,[data-theme="light"]{
  --at-lx:26%; --at-ly:-8%;                    /* source lumineuse haut-gauche */
  --at-form:104,100,92;                        /* volumes : gris minéral chaud */
  --at-hi:255,255,255;                         /* brume blanche */
  --at-light:.5; --at-veil-o:.55;
  --at-blur-d:34px; --at-blur-m:20px; --at-blur-n:13px;
  --at-o-d:.14; --at-o-m:.10; --at-o-n:.11;
  --at-stars:0; --at-dust:.07; --at-grain:0; --at-shade:.1;
  --at-drift:118s;
}
[data-theme="dark"]{
  --at-form:210,214,222; --at-hi:236,239,245;
  --at-light:.07; --at-veil-o:.5;
  --at-o-d:.4; --at-o-m:.3; --at-o-n:.34;
  --at-stars:.05; --at-dust:.12; --at-grain:.02; --at-shade:.3;
}
.scenery>*{position:absolute;inset:0}
.at-sky{background:
  radial-gradient(120% 90% at 30% 8%,rgba(255,255,255,.7),transparent 58%),
  radial-gradient(140% 110% at 82% 30%,rgba(var(--at-form),.06),transparent 62%),
  radial-gradient(150% 120% at 46% 96%,rgba(60,56,48,.08),transparent 66%),
  var(--bg)}
[data-theme="dark"] .at-sky{background:
  radial-gradient(120% 90% at 30% 8%,rgba(255,255,255,.035),transparent 58%),
  radial-gradient(140% 110% at 82% 30%,rgba(var(--at-form),.05),transparent 62%),
  radial-gradient(150% 120% at 46% 96%,rgba(0,0,0,.28),transparent 66%),
  var(--bg)}
.at-light{background:radial-gradient(58% 44% at var(--at-lx) var(--at-ly),rgba(var(--at-hi),var(--at-light)),transparent 72%);
  animation:atbreath 64s ease-in-out infinite alternate}
@keyframes atbreath{from{opacity:.75}to{opacity:1}}
.at-deep{inset:-14%;opacity:var(--at-o-d);filter:blur(var(--at-blur-d));will-change:transform;
  background:
   radial-gradient(46% 30% at 22% 16%,rgba(var(--at-hi),.10),transparent 70%),
   radial-gradient(58% 34% at 74% 24%,rgba(var(--at-form),.12),transparent 72%),
   radial-gradient(64% 36% at 38% 58%,rgba(var(--at-form),.08),transparent 74%),
   radial-gradient(52% 30% at 82% 78%,rgba(var(--at-form),.07),transparent 72%);
  animation:atdrift var(--at-drift) ease-in-out infinite alternate}
.at-veil{background:linear-gradient(184deg,transparent 6%,rgba(var(--at-form),.045) 34%,rgba(var(--at-form),.06) 52%,transparent 82%);
  opacity:var(--at-veil-o)}
.at-mid{inset:-10%;opacity:var(--at-o-m);filter:blur(var(--at-blur-m));will-change:transform;
  background:
   radial-gradient(40% 24% at 24% 20%,rgba(var(--at-hi),.13),transparent 66%),
   radial-gradient(44% 26% at 30% 24%,rgba(var(--at-form),.11),transparent 70%),
   radial-gradient(38% 22% at 72% 40%,rgba(var(--at-hi),.07),transparent 64%),
   radial-gradient(46% 26% at 78% 44%,rgba(var(--at-form),.10),transparent 70%);
  animation:atdrift2 86s ease-in-out infinite alternate}
.at-near{inset:-8%;opacity:var(--at-o-n);filter:blur(var(--at-blur-n));will-change:transform;
  background:
   radial-gradient(52% 26% at 26% 96%,rgba(60,56,48,.14),transparent 70%),
   radial-gradient(44% 22% at 84% 100%,rgba(60,56,48,.11),transparent 68%),
   radial-gradient(34% 16% at 60% 88%,rgba(255,255,255,.5),transparent 66%);
  animation:atdrift 72s ease-in-out infinite alternate-reverse}
[data-theme="dark"] .at-near{background:
   radial-gradient(52% 26% at 26% 96%,rgba(0,0,0,.34),transparent 70%),
   radial-gradient(44% 22% at 84% 100%,rgba(0,0,0,.28),transparent 68%),
   radial-gradient(34% 16% at 60% 88%,rgba(var(--at-form),.09),transparent 66%)}
@keyframes atdrift{from{transform:translate3d(-1.4%,var(--pY,0px),0)}to{transform:translate3d(1.4%,var(--pY,0px),0)}}
@keyframes atdrift2{from{transform:translate3d(1.6%,calc(.3% + var(--pY,0px)),0)}to{transform:translate3d(-1.6%,calc(-.3% + var(--pY,0px)),0)}}
.sc-stars{top:0;height:46%;opacity:var(--at-stars);transition:opacity 1.6s var(--ease)}
.sc-stars circle{fill:var(--t3);animation:sctw 14s ease-in-out infinite}
@keyframes sctw{0%,100%{opacity:.22}42%{opacity:.5}58%{opacity:.34}}
/* couche image — les paysages générés ; les SVG dessous restent le fallback */
.at-img{background-size:cover;background-position:center bottom;background-repeat:no-repeat;
  box-shadow:inset 0 0 0 100vmax color-mix(in srgb,var(--canvas) 13%,transparent);
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 20%);mask-image:linear-gradient(180deg,transparent 0,#000 20%);
  transition:opacity 1s var(--ease),filter 1s var(--ease)}
#phone.u-mount .at-img{background-image:var(--img-mount)}
#phone.u-desert .at-img{background-image:var(--img-desert)}
#phone.u-cloud .at-img{background-image:var(--img-cloud)}
#phone.u-cosmos .at-img{background-image:var(--img-cosmos)}
#phone.intro-on .at-img{background-image:var(--img-mount);box-shadow:none}
#phone.amb-closed .at-img{background-image:var(--img-cosmos)}
/* transposition nocturne : même monde, lumière baissée — pas d'inversion */
[data-theme="dark"] .at-img{filter:brightness(.34) saturate(.82) contrast(1.04)}
[data-theme="dark"] #phone.u-cosmos .at-img,[data-theme="dark"] #phone.amb-closed .at-img{filter:none}
/* la nuit réelle vue depuis le thème clair : voilée pour rester douce */
#phone.u-cosmos .at-img{opacity:.92}
[data-theme="light"] #phone.u-cosmos .at-img,[data-theme="light"] #phone.amb-closed .at-img{opacity:.55}
#phone.amb-focus .at-img{opacity:.5}
/* scènes illustrées : ancrées en bas, fondu vers le canvas en haut */
.sc-art{display:none;top:auto;bottom:0;height:52%;width:100%;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 24%);mask-image:linear-gradient(180deg,transparent 0,#000 24%);
  transition:opacity 1s var(--ease)}
#phone.u-mount .art-mount,#phone.u-desert .art-desert,#phone.u-cloud .art-cloud,#phone.u-cosmos .art-cosmos{display:block}
.art-cloud{height:78%;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 12%);mask-image:linear-gradient(180deg,transparent 0,#000 12%)}
.art-cosmos{height:86%;-webkit-mask-image:none;mask-image:none}
/* la page citation vit dans les montagnes ; la clôture sous les étoiles */
#phone.intro-on .sc-art{display:none}
#phone.intro-on .art-mount{display:block;height:62%}
#phone.amb-closed .sc-art{display:none}
#phone.amb-closed .art-cosmos{display:block}
#phone.amb-closed{--at-stars:.45}
#phone.amb-focus .sc-art{opacity:.45}
.at-dust{opacity:var(--at-dust)}
.at-dust i{position:absolute;border-radius:50%;background:rgba(var(--at-hi),.9);filter:blur(1px);
  animation:atdust 120s linear infinite}
.at-dust i:nth-child(1){left:14%;top:22%;width:2px;height:2px}
.at-dust i:nth-child(2){left:68%;top:12%;width:3px;height:3px;animation-duration:150s;animation-delay:-40s}
.at-dust i:nth-child(3){left:42%;top:38%;width:2px;height:2px;animation-duration:135s;animation-delay:-90s}
.at-dust i:nth-child(4){left:82%;top:54%;width:2px;height:2px;animation-duration:160s;animation-delay:-20s}
.at-dust i:nth-child(5){left:24%;top:66%;width:3px;height:3px;animation-duration:145s;animation-delay:-70s}
.at-dust i:nth-child(6){left:58%;top:80%;width:2px;height:2px;animation-duration:170s;animation-delay:-110s}
@keyframes atdust{0%{transform:translate3d(0,0,0)}50%{transform:translate3d(9px,-14px,0)}100%{transform:translate3d(0,0,0)}}
.at-shade{background:
  radial-gradient(130% 100% at 40% 34%,transparent 56%,rgba(60,54,44,var(--at-shade)) 100%),
  linear-gradient(0deg,rgba(60,54,44,.05),transparent 22%)}
[data-theme="dark"] .at-shade{background:
  radial-gradient(130% 100% at 40% 34%,transparent 52%,rgba(0,0,0,var(--at-shade)) 100%),
  linear-gradient(0deg,rgba(0,0,0,.16),transparent 22%)}
.at-grain{width:100%;height:100%;opacity:var(--at-grain);pointer-events:none}
/* moments de la journée */
#phone.t-day{--at-stars:0}
#phone.t-dawn{--at-stars:.1;--at-hi:242,238,228;--at-light:.08}
#phone.t-dusk{--at-stars:.22;--at-light:.05}
#phone.t-night{--at-stars:.38;--at-light:.035;--at-veil-o:.38;--at-shade:.36}
/* états de la journée */
#phone.amb-focus{--at-light:.03;--at-o-d:.32;--at-o-m:.28;--at-dust:0;--at-shade:.44}
#phone.amb-won{--at-stars:.5}
#phone.amb-won .at-light{background:radial-gradient(58% 44% at var(--at-lx) var(--at-ly),var(--warm-soft),transparent 72%)}
#phone.amb-closed{--at-dust:0;--at-o-m:.3}
/* ── LES 4 UNIVERS — mêmes plans, autres lumières.
   u-cloud = base (aucune surcharge). Posés par initScenery selon le moment.
   Intégration d'images futures (webp/avif locales) : poser assets/scene-<univers>.webp
   (+ variante -dark) en background de .at-deep sous les gradients — masque, voile,
   vignette et grain existants assurent lisibilité et adaptation. Aucun fichier requis :
   le rendu CSS/SVG ci-dessous est le fallback permanent. ── */
#phone.u-desert{--at-form:158,142,116;--at-hi:250,244,230;--at-lx:15%;--at-ly:5%;--at-light:.42;--at-shade:.13;--scene-mist:240,233,220}
[data-theme="dark"] #phone.u-desert{--at-form:196,178,148;--at-hi:238,226,204;--at-light:.06;--at-shade:.3;--scene-mist:206,196,178}
#phone.u-mount{--at-form:118,126,132;--at-hi:246,249,252;--at-blur-m:15px;--at-blur-n:9px;--at-o-n:.24;--at-veil-o:.66;--scene-mist:226,230,234}
[data-theme="dark"] #phone.u-mount{--at-form:176,184,194;--at-hi:226,232,240;--at-o-n:.56;--at-light:.055;--scene-mist:198,204,212}
#phone.u-cosmos{--at-stars:.42;--at-form:128,126,146;--at-light:.28;--at-shade:.2;--at-o-n:.12;--scene-mist:222,220,232}
[data-theme="dark"] #phone.u-cosmos{--at-stars:.55;--at-form:186,182,214;--at-hi:228,224,246;--at-light:.045;--at-shade:.4;--at-o-n:.3;--scene-mist:206,202,224}
.dimmable{transition:opacity .6s var(--ease)}
#phone.amb-focus .dimmable{opacity:.55}
.topbar,main,.tabbar{position:relative;z-index:2;transition:opacity .55s var(--ease)}
#phone.intro-on .topbar,#phone.intro-on main,#phone.intro-on .tabbar{opacity:0;pointer-events:none}
@media(prefers-reduced-motion:reduce){.sc-stars circle,.at-light,.at-deep,.at-mid,.at-near,.at-dust i{animation:none}}
main{padding:14px 20px calc(112px + env(safe-area-inset-bottom));min-height:60dvh}
main.viewfade{animation:viewin .28s var(--ease)}
@keyframes viewin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.hide{display:none!important}

/* ================= TYPO ================= */
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--t3);font-weight:500}
.h1{font-size:28px;line-height:1.18;font-weight:600;letter-spacing:-.02em}
.h2{font-size:19px;font-weight:600;letter-spacing:-.01em}
.sub{font-size:14px;color:var(--t2);line-height:1.5}
.small{font-size:12px;color:var(--t3)}
.gold{color:var(--gold)}

/* ================= BARRES ================= */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top)) 20px 10px;
  background:none;border-bottom:none;padding-bottom:16px}
.brand,.iconbtn{background:var(--surface-glass);
  -webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);
  border:1px solid var(--border-highlight);box-shadow:var(--shadow-soft)}
.brand{padding:8px 15px;border-radius:999px}
.iconbtn{border-radius:999px}
@supports not (backdrop-filter:blur(1px)){.brand,.iconbtn{background:var(--surface-raised)}}
.topbar::before{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,
    color-mix(in srgb,var(--canvas) 92%,transparent) 0%,
    color-mix(in srgb,var(--canvas) 66%,transparent) 62%,
    transparent 100%);
  opacity:.3;transition:opacity .35s var(--ease)}
body.scrolled .topbar::before{opacity:1}
.brand{display:flex;align-items:center;gap:9px}
.brand svg{width:20px;height:14px;stroke:var(--t2)}
.brand span{font-size:13px;letter-spacing:.34em;font-weight:600;color:var(--t1)}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--t2);
  transition:background .2s var(--ease),transform .15s var(--ease)}
.iconbtn:active{transform:scale(.92);background:var(--s2)}
.iconbtn svg{width:19px;height:19px}
.tabbar{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:20;
  display:flex;gap:2px;width:auto;
  padding:5px;border-radius:999px;
  background:var(--surface-glass);
  -webkit-backdrop-filter:blur(20px) saturate(1.2);backdrop-filter:blur(20px) saturate(1.2);
  border:1px solid var(--border-highlight);box-shadow:var(--shadow-raised)}
@supports not (backdrop-filter:blur(1px)){.tabbar{background:var(--surface-raised)}}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--t3);padding:8px 17px;
  border-radius:999px;transition:color .2s,background .25s var(--ease)}
.tab.on{background:linear-gradient(168deg,var(--stone-hi),var(--stone-lo));box-shadow:var(--shadow-soft)}
.tab svg{width:21px;height:21px}
.tab span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.tab.on{color:var(--t1)}
.tab.on svg{color:var(--gold)}
.tab:active{transform:scale(.94)}

/* ================= COMPOSANTS ================= */
.card{position:relative;background:var(--reflection),linear-gradient(168deg,var(--stone-hi) 0%,var(--stone-lo) 60%);
  border:1px solid var(--border-soft);
  border-radius:var(--r);padding:18px;
  box-shadow:var(--shadow-soft)}
.card::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background-image:var(--grain);background-size:cover;opacity:.05}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:var(--btn-bg);color:var(--btn-fg);font-weight:600;font-size:15px;
  padding:15px;border-radius:16px;transition:transform .28s var(--spring),opacity .2s;
  box-shadow:0 4px 14px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.14)}
[data-theme="light"] .btn{box-shadow:0 4px 12px rgba(30,28,24,.16),inset 0 1px 0 rgba(255,255,255,.12)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.35;pointer-events:none}
.btn.ghost{background:transparent;color:var(--t2);border:1px solid var(--line);font-weight:500}
.btn.quiet{background:transparent;color:var(--t3);font-weight:500;padding:10px}
.seg{display:flex;background:var(--s2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-size:13px;color:var(--t3);font-weight:500;
  transition:all .2s var(--ease);white-space:nowrap}
.seg button.on{background:var(--s1);color:var(--t1);box-shadow:0 1px 4px rgba(0,0,0,.18)}
[data-theme="light"] .seg button.on{box-shadow:0 1px 4px rgba(20,24,32,.10)}
.seg.duo button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px}
.seg.duo b{font-size:15px;font-weight:600;line-height:1}
.seg.duo span{font-size:9.5px;letter-spacing:.02em;color:var(--t3);line-height:1.1;white-space:nowrap}
.seg.duo button.on span{color:var(--t2)}
.scorebadge{flex:none;width:23px;height:23px;border-radius:50%;border:1px solid var(--gold-line);color:var(--gold);
  display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
.mscore{margin-top:10px;font-size:11.5px;color:var(--t3);letter-spacing:.02em}
.mscore b{color:var(--gold);font-weight:600}
.chip{display:inline-flex;align-items:center;padding:8px 14px;border-radius:99px;font-size:13px;
  border:1px solid var(--line);color:var(--t2);transition:all .2s var(--ease)}
.chip.on{border-color:var(--gold-line);color:var(--gold);background:var(--gold-soft)}
.chip:active{transform:scale(.95)}
.chk{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);
  display:grid;place-items:center;color:transparent;transition:all .25s var(--ease)}
.chk svg{width:13px;height:13px}
.chk.on{background:var(--gold);border-color:var(--gold);color:#14110A}
.chk:active{transform:scale(.88)}
.trow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line2)}
.trow:last-child{border-bottom:none}
.trow .tt{flex:1;font-size:15px;min-width:0}
.trow.done .tt{color:var(--t3);text-decoration:line-through;text-decoration-color:var(--line)}
.trow .est{font-size:12px;color:var(--t3);font-variant-numeric:tabular-nums;flex:none}
.field{width:100%;background:var(--s2);border:1px solid transparent;border-radius:14px;
  padding:14px 16px;font-size:16px;outline:none;transition:border-color .2s}
.field:focus{border-color:var(--line)}
.field::placeholder{color:var(--t3)}
textarea.field{resize:none;min-height:74px;line-height:1.5}

/* range */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  background:var(--s1);border:1.5px solid var(--gold);margin-top:-10px;
  box-shadow:0 2px 8px rgba(0,0,0,.3)}
input[type=range]::-moz-range-track{height:2px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--s1);border:1.5px solid var(--gold)}

/* ================= FLOW GUIDÉ ================= */
.flow{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;
  display:flex;flex-direction:column;
  opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.flow.open{opacity:1;pointer-events:auto}
.flow-in{width:min(430px,100%);margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;flex:1}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:26px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--line);transition:all .3s var(--ease)}
.dots i.on{background:var(--gold);width:16px;border-radius:3px}
.step{animation:rise .4s var(--ease);display:flex;flex-direction:column;flex:1}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.step-head{margin-bottom:22px}
.step-head .eyebrow{margin-bottom:10px}
.spacer{flex:1;min-height:20px}
.flow-actions{display:flex;flex-direction:column;gap:8px;padding-top:18px}

/* accueil */
.sky{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.sky .haze{position:absolute;inset:0;
  background:radial-gradient(130% 90% at 50% -10%,var(--s2) 0%,transparent 55%),
             radial-gradient(70% 32% at 50% 76%,var(--gold-soft),transparent 72%)}
.sky svg{position:absolute;bottom:0;left:0;width:100%;height:34%}
.greet{position:relative;display:flex;flex-direction:column;flex:1}
.gquote{text-align:left;padding:0 4px}
.gq-mark{font-size:52px;line-height:.6;color:var(--gold);opacity:.55;font-weight:600;margin-bottom:14px}
.gq-text{font-size:27px;line-height:1.34;font-weight:500;letter-spacing:-.018em;max-width:330px}
.gq-rule{width:28px;height:1px;background:var(--gold-line);margin:22px 0 12px}
.gq-author{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--t3);font-weight:600}
.intro{position:fixed;inset:0;z-index:50;display:flex}
.intro.out{opacity:0;transition:opacity .5s var(--ease);pointer-events:none}
.intro.hide{display:none}
.intro-scrim{position:absolute;inset:0;
  background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 16%,transparent) 0%,color-mix(in srgb,var(--bg) 58%,transparent) 46%,var(--bg) 90%)}
.intro-in{position:relative;z-index:1;flex:1;max-width:430px;margin:0 auto;display:flex;flex-direction:column;
  padding:calc(26px + env(safe-area-inset-top)) 26px calc(22px + env(safe-area-inset-bottom))}
.gq-in{opacity:0;animation:gqin .7s var(--ease) forwards}
.gq-mark{animation-delay:.3s}.gq-text{animation-delay:.5s}.gq-rule{animation-delay:.95s}
.gq-author{animation-delay:1.1s}.gq-cta{animation-delay:1.55s}
.intro .gq-in{animation-duration:.9s}
.greet>.gq-in:first-child,.greet .eyebrow.gq-in{animation-delay:.05s}
@keyframes gqin{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.gq-in{animation:none;opacity:1}}
.greet-card{background:color-mix(in srgb,var(--s1) 88%,transparent);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:1px solid var(--line2);border-radius:var(--r);padding:18px;
  font-size:14px;line-height:1.55;color:var(--t2)}

/* clarification */
.clar{background:var(--s1);border:1px solid var(--line2);border-radius:var(--r);padding:15px;margin-bottom:12px}

.mc-eyebrow{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--t3);font-weight:600}

.mc-title{margin-top:12px;font-size:25px;line-height:1.24;font-weight:600;letter-spacing:-.02em;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

.bkdot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--line);margin:0 9px 0 4px}

/* carrousel secondaires */
.deck{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
  padding:6px 24px 12px;margin:0 -20px;scroll-padding-inline:24px;scrollbar-width:none}

.mc-clk.anch{top:58px}
.mc-clk.anch.on{color:var(--gold)}
.sc-title{font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.32;cursor:pointer;padding-right:30px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.alt{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line2);color:var(--t2);font-size:14px}

/* étoiles */
.constel{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line2);
  background:linear-gradient(180deg,var(--bg2),var(--s1))}
.constel svg{display:block;width:100%}
.star{fill:var(--warm)}
.star.big{filter:drop-shadow(0 0 3px var(--warm-soft))}
.tw{animation:tw 5.2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.62}50%{opacity:.95}}

.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}

.cal .hd{font-size:10px;letter-spacing:.1em;color:var(--t3);text-align:center;padding:5px 0;text-transform:uppercase}
.cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  border-radius:11px;font-size:11.5px;color:var(--t3);font-variant-numeric:tabular-nums;transition:background .2s}
.cell:active{background:var(--s2)}
.cell.today{box-shadow:inset 0 0 0 1px var(--line)}
.cell b{font-weight:500}
.dot{width:6px;height:6px;border-radius:50%}
.dot.win{background:var(--warm);box-shadow:0 0 8px var(--warm-soft)}
.dot.part{border:1.2px solid var(--gold-2);background:transparent}
.dot.rest{background:var(--line)}
.dot.none{background:var(--line2)}
.legend{display:flex;gap:16px;margin-top:14px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--t3)}
.bignum{font-size:52px;font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}

/* insights */
.insight{display:flex;gap:13px;align-items:flex-start;padding:15px 0;border-bottom:1px solid var(--line2)}
.insight:last-child{border-bottom:none}
.insight .ic{flex:none;width:34px;height:34px;border-radius:11px;background:var(--s2);
  display:grid;place-items:center;color:var(--gold)}
.insight .ic svg{width:17px;height:17px}
.insight p{font-size:14px;line-height:1.5}
.insight .small{margin-top:3px}
.lockbar{height:4px;border-radius:2px;background:var(--s2);overflow:hidden;margin:14px 0 8px}
.lockbar i{display:block;height:100%;background:var(--gold);border-radius:2px;transition:width .5s var(--ease)}
.demo-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;
  border:1px dashed var(--gold-line);border-radius:14px;padding:11px 14px;margin-bottom:16px;
  font-size:12.5px;color:var(--gold)}
.demo-banner button{color:var(--gold);font-weight:600;font-size:12.5px;text-decoration:underline}

/* ================= SHEET / MODAL ================= */
.sheetbg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:opacity .28s var(--ease);
  display:flex;align-items:flex-end;justify-content:center}
[data-theme="light"] .sheetbg{background:rgba(20,24,32,.32)}
.sheetbg.open{opacity:1;pointer-events:auto}
.sheet{width:min(430px,100%);background:var(--surface-glass);
  -webkit-backdrop-filter:blur(22px) saturate(1.2);backdrop-filter:blur(22px) saturate(1.2);
  border-radius:22px 22px 0 0;
  border-top:1px solid var(--border-highlight);box-shadow:var(--shadow-hero);padding:10px 22px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(24px);transition:transform .32s var(--ease);max-height:86dvh;overflow-y:auto}
.sheetbg.open .sheet{transform:none}
@supports not (backdrop-filter:blur(1px)){.sheet{background:var(--surface-raised)}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 16px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;
  border-bottom:1px solid var(--line2);font-size:14.5px}
.srow:last-child{border-bottom:none}
.srow .sub{font-size:12px;margin-top:2px}
.srow.dis{opacity:.45}
.linkbtn{color:var(--t1);font-weight:600;font-size:13.5px;padding:9px 14px;border:1px solid var(--line);border-radius:11px;white-space:nowrap}
.linkbtn:active{transform:scale(.95)}
.linkbtn.danger{color:var(--amber);border-color:transparent}

/* toast */
/* scène de validation — brève, interruptible */
.vwin{position:fixed;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .4s var(--ease)}
.vwin.on{opacity:1;pointer-events:auto}
.vwin-scrim{position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 55%,transparent);
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.vwin-card{position:relative;max-width:330px;margin:0 28px;padding:26px 26px 22px;text-align:center;
  background:linear-gradient(172deg,var(--s2),var(--s1) 58%);border:1px solid var(--line2);
  border-radius:24px;box-shadow:var(--e3);
  transform:translateY(10px) scale(.97);transition:transform .45s var(--spring)}
.vwin.on .vwin-card{transform:none}
.vw-chk{width:40px;height:40px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;
  color:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold-line)}
.vw-chk svg{width:17px;height:17px}
.vw-text{font-family:'Fraunces',serif;font-size:19px;line-height:1.42;letter-spacing:-.01em;color:var(--t1)}
.vw-rule{width:26px;height:1px;background:var(--gold-line);margin:14px auto 10px}
.vw-author{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--t3)}
.vw-sub{margin-top:10px;font-size:12px;color:var(--t2);font-variant-numeric:tabular-nums}
.vw-sub:empty{display:none}
@media(prefers-reduced-motion:reduce){.vwin,.vwin-card{transition:opacity .2s linear}}
#toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(8px);
  z-index:80;background:var(--s3);color:var(--t1);font-size:13.5px;padding:11px 18px;border-radius:99px;
  border:1px solid var(--line2);opacity:0;pointer-events:none;transition:all .3s var(--ease);white-space:nowrap;
  box-shadow:0 8px 30px rgba(0,0,0,.35)}
#toast.show{opacity:1;transform:translateX(-50%)}

/* divers */
.recap-status{font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.qrow{display:flex;gap:8px}
.qrow .field{flex:1}
.addbtn{flex:none;width:50px;border-radius:14px;background:var(--btn-bg);color:var(--btn-fg);
  display:grid;place-items:center}
.addbtn svg{width:18px;height:18px}
.addbtn:active{transform:scale(.94)}
.del{color:var(--t3);width:30px;height:30px;display:grid;place-items:center;flex:none}
.del svg{width:15px;height:15px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* capteur de diagnostic — affiche toute erreur fatale à l'écran (à retirer en prod) */
try{window.addEventListener('error',function(e){try{
 var d=document.getElementById('__err')||document.body.appendChild(document.createElement('div'));
 d.id='__err';
 d.style.cssText='position:fixed;left:10px;right:10px;bottom:10px;z-index:99999;background:#3a1214;color:#ffb4ad;font:12px/1.5 -apple-system,monospace;padding:12px 14px;border-radius:12px;white-space:pre-wrap;max-height:45vh;overflow:auto';
 d.textContent+=(d.textContent?'\n':'')+'⚠ '+(e.message||e.type)+(e.lineno?' · ligne '+e.lineno:'');
}catch(x){}},true);}catch(x){}
/* ============================================================
   MINDWAY v2 — prototype "app mobile premium"
   Fichier unique · vanilla JS · stockage local avec fallback
   ============================================================ */

/* ── UTILS ── */
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtLong=iso=>new Date(iso+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const fmtShort=iso=>new Date(iso+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
const fmtMin=m=>{if(!m||m<60)return (m||0)+' min';const h=Math.floor(m/60),r=m%60;return r?h+'h'+String(r).padStart(2,'0'):h+'h'};
const hash=s=>{let h=0;for(let i=0;i<s.length;i++){h=(h<<5)-h+s.charCodeAt(i);h|=0}return Math.abs(h)};
function toast(m,ms=2200){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),ms)}

/* ── SCORE ── */
const CAP={SECN:3,QUICKN:5,DAYMIN:360};
function plannedMin(d){return((d.mit&&d.mit.est)||0)+(d.tasks||[]).reduce((s,t)=>s+(t.est||0),0)+(d.quick||[]).reduce((s,t)=>s+(t.est||0),0)}
function computeParts(d,estim){
 const mit=d.mit&&d.mit.done?60:0;
 const org=((d.tasks||[]).length<=CAP.SECN&&(d.quick||[]).length<=CAP.QUICKN&&plannedMin(d)<=CAP.DAYMIN)?15:0;
 const tt=d.tasks||[];let sec;
 if(!tt.length)sec=d.mit&&d.mit.done?15:0;
 else sec=Math.round(tt.filter(t=>t.done).length/tt.length*15);
 const est=estim==='juste'?10:estim==='court'?5:0;
 const score=mit+org+sec+est;
 const status=score>=70?'gagnante':score>0?'partielle':'repos';
 return{score,status,parts:{mit,org,sec,est}};
}

/* ── INSIGHTS ── */
function closedDays(){return Object.values(D.days).filter(d=>d.review&&!d.off).sort((a,b)=>a.date<b.date?-1:1)}
function computeInsights(){
 const cd=closedDays();
 if(cd.length<7)return{locked:true,have:cd.length,need:7};
 const wins=cd.filter(d=>d.review.status==='gagnante'),oth=cd.filter(d=>d.review.status!=='gagnante');
 const out=[];
 const mean=(a,f)=>a.length?a.reduce((s,x)=>s+f(x),0)/a.length:0;
 // 1 · charge planifiée
 if(wins.length>=3&&oth.length>=3){
  const mW=mean(wins,d=>(d.tasks||[]).length),mO=mean(oth,d=>(d.tasks||[]).length);
  if(mW+0.6<mO)out.push({ic:I.flag,txt:`Tu réussis mieux lorsque tu prévois <b>${Math.max(1,Math.round(mW))} tâche${Math.round(mW)>1?'s':''} secondaire${Math.round(mW)>1?'s':''} ou moins</b> en plus de ta priorité.`,sub:`${mW.toFixed(1)} en moyenne les jours gagnants · ${mO.toFixed(1)} les autres jours`});
 }
 // 2 · durée MIT
 const A=cd.filter(d=>d.mit&&(d.mit.est||60)<=90),B=cd.filter(d=>d.mit&&(d.mit.est||60)>90);
 if(A.length>=4&&B.length>=3){
  const rA=Math.round(mean(A,d=>d.mit.done?1:0)*100),rB=Math.round(mean(B,d=>d.mit.done?1:0)*100);
  if(rA>=rB+12)out.push({ic:I.clock,txt:`Tes priorités de <b>90 minutes ou moins</b> aboutissent ${rA} % du temps, contre ${rB} % au-delà.`,sub:`Découper les grosses tâches te réussit`});
 }
 // 3 · matin
 const E=cd.filter(d=>d.startedHour!=null&&d.startedHour<9),L=cd.filter(d=>d.startedHour!=null&&d.startedHour>=9);
 if(E.length>=3&&L.length>=3){
  const wE=Math.round(mean(E,d=>d.review.status==='gagnante'?1:0)*100),wL=Math.round(mean(L,d=>d.review.status==='gagnante'?1:0)*100);
  if(wE>=wL+15)out.push({ic:I.sun,txt:`Commencer <b>avant 9 h</b> t'aide : ${wE} % de journées gagnantes, contre ${wL} % quand tu clarifies plus tard.`,sub:null});
 }
 // 4 · clarté
 const wc=wins.filter(d=>d.mindset),oc=oth.filter(d=>d.mindset);
 if(wc.length>=3&&oc.length>=3){
  const cW=mean(wc,d=>d.mindset.clarte),cO=mean(oc,d=>d.mindset.clarte);
  if(cW>=cO+0.6)out.push({ic:I.brain,txt:`Ton niveau de <b>clarté mentale</b> pèse directement sur tes journées : ${cW.toFixed(1)}/5 les jours gagnants, ${cO.toFixed(1)}/5 les autres.`,sub:`La calibration du matin n'est pas décorative`});
 }
 // 5 · calibration des estimations — mesuré, pas déclaré (est vs spent des tâches chronométrées)
 const sp=[];
 cd.forEach(d=>[d.mit].concat(d.tasks||[],d.quick||[]).forEach(t=>{
  if(t&&t.done&&t.spent>0&&t.est>0)sp.push(t.spent/t.est)}));
 if(sp.length>=8){
  const ratio=sp.reduce((s,x)=>s+x,0)/sp.length;
  if(ratio>=1.25)out.push({ic:I.clock,txt:`Tu sous-estimes tes durées d'environ <b>${Math.round((ratio-1)*100)} %</b> : une tâche annoncée à 30 min t'en prend ${Math.round(30*ratio)}.`,sub:`Mesuré sur ${sp.length} tâches chronométrées — prévois large, tu tiendras mieux tes journées`});
  else if(ratio<=0.78)out.push({ic:I.clock,txt:`Tu surestimes tes durées : tes tâches prennent <b>${Math.round((1-ratio)*100)} % de moins</b> que prévu.`,sub:`Mesuré sur ${sp.length} tâches — tu peux viser un peu plus grand`});
 }
 // 6 · ce qui traîne : évitement plutôt que manque de temps
 const stale=(D.backlog||[]).filter(b=>b.from&&daysAgo(b.from)>=7);
 if(stale.length>=2)out.push({ic:I.warn,txt:`<b>${stale.length} tâches</b> attendent depuis plus d'une semaine.`,sub:`Reporter est un choix ; découper en est un autre. Rarement une question de temps`});
 // 7 · charge mentale
 const wch=wins.filter(d=>d.mindset&&d.mindset.charge!=null),och=oth.filter(d=>d.mindset&&d.mindset.charge!=null);
 if(wch.length>=3&&och.length>=3){
  const a=mean(wch,d=>d.mindset.charge),b=mean(och,d=>d.mindset.charge);
  if(b>=a+0.6)out.push({ic:I.brain,txt:`Tes journées gagnantes arrivent quand ta <b>charge mentale</b> est plus basse : ${a.toFixed(1)}/5 contre ${b.toFixed(1)}/5 les autres jours.`,sub:`Alléger la veille compte autant que planifier le matin`});
 }
 // 8 · élan
 const wel=wins.filter(d=>d.mindset&&d.mindset.elan!=null),oel=oth.filter(d=>d.mindset&&d.mindset.elan!=null);
 if(wel.length>=3&&oel.length>=3){
  const a=mean(wel,d=>d.mindset.elan),b=mean(oel,d=>d.mindset.elan);
  if(a>=b+0.6)out.push({ic:I.zap,txt:`Ton <b>élan</b> du matin annonce la journée : ${a.toFixed(1)}/5 les jours gagnants, ${b.toFixed(1)}/5 les autres.`,sub:`Quand il est bas, une priorité plus petite vaut mieux qu'une ambitieuse`});
 }
 const pts=cd.filter(d=>d.mindset).map(d=>({x:d.mindset.clarte,y:d.review.score}));
 return{locked:false,list:out,pts,n:cd.length,wins:wins.length};
}

/* ── DÉMO (30 jours plausibles, corrélations volontaires) ── */
function seedRng(seed){let s=seed;return()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff}}
const DEMO_MIT=["Tourner la vidéo Dropp","Finaliser la landing Icarus","Préparer le plan de la semaine","Écrire le script YouTube","Corriger le bug de sync","Enregistrer la voix off","Structurer l'offre Guard","Monter la démo produit"];
const DEMO_SEC=["Répondre aux mails","Relancer le comptable","Mettre à jour le repo","Préparer le post X","Ranger le bureau","Faire la veille marché","Appeler maman","Aller courir"];
const DEMO_Q=["Payer la facture","Réserver le créneau","Répondre à Théo","Sauvegarder le projet","Commander les câbles"];
const CTX=['Calme','Motivé','Chargé','Fatigué','Distrait','Sous pression'];
/* charge et élan sont additifs : les journées d'avant n'en ont pas, la lecture les tolère */
function blankMindset(){return{clarte:3,energie:3,charge:3,elan:3,ctx:[],note:''}}
function genDemo(){
 const r=seedRng(20260842),days={},now=new Date();
 for(let i=32;i>=1;i--){
  if(r()<0.13)continue;
  const dt=new Date(now);dt.setDate(now.getDate()-i);
  const iso=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
  if(i===9||i===23){const d=mkDay(iso);d.off=true;d.review={score:0,status:'repos',parts:{mit:0,org:0,sec:0,est:0},note:'',closedAt:iso};days[iso]=d;continue}
  const d=mkDay(iso);
  const clarte=1+Math.floor(r()*5),energie=1+Math.floor(r()*5);
  const nSec=Math.floor(r()*4);            // 0..3
  const est=[30,45,60,90,120,150,240][Math.floor(r()*7)];
  d.startedHour=7+Math.floor(r()*5);       // 7..11
  let p=0.14+0.10*clarte+(est<=90?0.15:0)+(nSec<=1?0.10:nSec===2?0.02:-0.10)+(d.startedHour<9?0.14:0);
  const mitDone=r()<Math.max(0.08,Math.min(0.88,p));
  d.mit={id:uid(),title:DEMO_MIT[Math.floor(r()*DEMO_MIT.length)],est,done:mitDone};
  const pool=[...DEMO_SEC].sort(()=>r()-0.5);
  for(let j=0;j<nSec;j++)d.tasks.push({id:uid(),title:pool[j],est:[20,30,45,60][Math.floor(r()*4)],done:r()<(mitDone?0.62:0.36)});
  const nQ=Math.floor(r()*3);
  for(let j=0;j<nQ;j++)d.quick.push({id:uid(),title:DEMO_Q[Math.floor(r()*DEMO_Q.length)],est:10,done:r()<0.55});
  d.mindset={clarte,energie,ctx:[CTX[Math.floor(r()*CTX.length)]],note:''};
  const estim=r()<0.42?'juste':r()<0.78?'court':'rate';
  const c=computeParts(d,estim);
  d.review={score:c.score,status:c.status,parts:c.parts,estim,note:'',closedAt:iso};
  days[iso]=d;
 }
 return days;
}

 let kept=true;try{if(store.ok&&localStorage.getItem(BAK)!==snap)kept=false}catch(e){kept=false}
 if(!kept&&hasReal){toast('Impossible de mettre tes données à l’abri — démo annulée');return}
 const nd=blank();nd.settings={...D.settings,demo:true};nd.days=genDemo();
 D=nd;normalize();save();closeSheet();S.month=todayISO().slice(0,7);render();

function demoOff(){

 [store.get(BAK),store.get(DBAK)].forEach(b=>{if(restored||!b)return;try{const q=JSON.parse(b);if(isObj(q)&&!(q.settings&&q.settings.demo))restored=q}catch(e){}});
 if(restored){D=restored;D.settings=D.settings||{};D.settings.demo=false;normalize();store.del(BAK);save();backupNow();closeSheet();render();toast('Données réelles restaurées');return}

}

function importV1(){
 try{
  const raw=store.get('mindway_v1');
  if(!raw){toast('Aucune donnée Mindway v1 trouvée');return}
  const old=JSON.parse(raw);let n=0;
  Object.values(old).forEach(od=>{
   if(!od||!od.date||D.days[od.date])return;
   const d=mkDay(od.date);
   const cl3=v=>Math.max(0,Math.min(3,+v||0));
   const mit=(od.tasks||[]).find(t=>t.type==='MIT');
   if(mit&&mit.title)d.mit={id:mit.id||uid(),title:mit.title,est:mit.t||60,imp:cl3(mit.impact),urg:cl3(mit.urgency),done:!!mit.completed};
   (od.tasks||[]).filter(t=>t.type==='SECONDARY'&&t.title).slice(0,3).forEach(t=>d.tasks.push({id:t.id||uid(),title:t.title,est:t.t||45,imp:cl3(t.impact),urg:cl3(t.urgency),done:!!t.completed}));
   (od.tasks||[]).filter(t=>t.type==='MICRO'&&t.title).slice(0,5).forEach(t=>d.quick.push({id:t.id||uid(),title:t.title,est:t.t||10,done:!!t.completed}));
   /* v1 avait 7 dimensions : on récupère celles que la v2 sait lire (stress→charge, motivation→élan) */
   if(od.mood)d.mindset={clarte:od.mood.clarte||3,energie:od.mood.energie||3,
    charge:od.mood.stress||3,elan:od.mood.motivation||3,
    ctx:(od.tags||[]).slice(0,3),note:od.dailyNote||''};
   const any=(od.tasks||[]).some(t=>t.completed);
   if(any||od.guidedCompleted){const c=computeParts(d,null);d.review={score:c.score,status:c.status,parts:c.parts,estim:null,note:od.dailyNote||'',closedAt:od.date,imported:true}}
   D.days[od.date]=d;n++;
  });
  try{const sr=store.get('mindway_it_v1');if(sr){JSON.parse(sr).forEach(s=>{if(s&&s.trigger)D.plans.push({id:s.id||uid(),ifTxt:s.trigger,thenTxt:s.response||'',uses:0})})}}catch(e){}
  save();backupNow();render();toast(n?n+' journée'+(n>1?'s':'')+' importée'+(n>1?'s':''):'Rien de nouveau à importer');
 }catch(e){toast("Import impossible — format v1 non reconnu")}
}

/* ── EXPORT / IMPORT JSON ── */
function exportJSON(){
 const blob=new Blob([JSON.stringify(D,null,1)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download='mindway-'+todayISO()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
function importJSON(inp){
 const f=inp.files&&inp.files[0];if(!f)return;
 const rd=new FileReader();
 rd.onload=()=>{try{const nd=JSON.parse(rd.result);if(!isObj(nd)||!isObj(nd.days))throw 0;
  backupNow();                                   /* l'état actuel est sauvegardé AVANT d'être remplacé */
  D=nd;normalize();D.settings.demo=false;        /* un export fait en démo ne réactive pas la démo */
  save();closeSheet();render();toast('Sauvegarde importée')}catch(e){toast('Fichier invalide')}};
 rd.readAsText(f);inp.value='';
}

  {id:'q144',text:"J'ai appris que le courage n'est pas l'absence de peur, mais la capacité de la vaincre.",author:"Nelson Mandela",cat:'victoire',p:['antifragile_day','optimisme_high']},

  {id:'q172',text:"C'est le doute seul qui provoque l'expérience.",author:"Claude Bernard",cat:'science',p:['high_clarity_success']},
  {id:'q173',text:"Nous ne voyons qu'à courte distance devant nous, mais nous y voyons beaucoup de choses à faire.",author:"Alan Turing",cat:'science',p:['high_dispersion_low_mit','micro_tasks_over_mit']},
  {id:'q174',text:"L'ignorance engendre plus souvent la confiance que ne fait le savoir.",author:"Charles Darwin",cat:'science',p:['low_impact_productivity']},

  {id:'q179',text:"Plus l'art est contrôlé, limité, travaillé, et plus il est libre.",author:"Igor Stravinsky",cat:'creation',p:['high_dispersion_low_mit']},

  {id:'q181',text:"Je travaille opiniâtrement, j'entrevois la Terre Promise.",author:"Paul Cézanne",cat:'creation',p:['antifragile_day']},
  {id:'q182',text:"Quand tu ne sais pas ce que tu fais et que ce que tu fais est le meilleur, c'est cela l'inspiration.",author:"Robert Bresson",cat:'creation',p:['low_impact_productivity']},
  {id:'q183',text:"C'est par la logique qu'on démontre, c'est par l'intuition qu'on invente.",author:"Henri Poincaré",cat:'science',p:['high_clarity_success']},
  {id:'q184',text:"Douter de tout ou tout croire, ce sont deux solutions également commodes, qui l'une et l'autre nous dispensent de réfléchir.",author:"Henri Poincaré",cat:'science',p:['high_dispersion_low_mit']},

/* moteur de citations contextuelles — audit éditorial à prévoir */
const Q_CTX={reveil:'ouverture',stoicisme:'ouverture',sagesse_asiatique:'ouverture',proverbes:'ouverture',mindway:'ouverture',
 creation:'focus',science:'focus',antifragilite:'focus',contemporain:'focus',
 victoire:'gagnante',optimisme:'gagnante',
 permission:'difficile',psychologie:'difficile',poesie_persane:'difficile',
 philosophie:'reflexion',poesie_arabe:'reflexion'};
const QA=QUOTES.filter(q=>!/mindway/i.test(q.author));
function qPick(ctx){
 const pool=QA.filter(q=>Q_CTX[q.cat]===ctx);
 const P=pool.length?pool:QA;
 return P[hash(todayISO()+ctx)%P.length];
}
function greeting(){const h=new Date().getHours();return h<5?'Bonsoir':h<12?'Bonjour':h<18?'Bon après-midi':'Bonsoir'}

function startFlow(){
 S.flow={step:1,items:[],mitId:null,secIds:[],keptLong:[],mindset:blankMindset()};
 renderFlow();$('flow').classList.add('open');
}
function closeFlow(){$('flow').classList.remove('open');S.flow=null}
function flowGo(n){if(n===2&&S.flow.pg==null)S.flow.pg=0;S.flow.step=n;renderFlow();$('flow').scrollTop=0}

function dots(cur){const tot=6;let h='<div class="dots">';for(let i=0;i<tot;i++)h+='<i class="'+(i<=cur?'on':'')+'"></i>';return h+'</div>'}

function renderFlow(){
 const F=S.flow;if(!F)return;
 const el=$('flowIn');let h='';
 /* ── 0 · ACCUEIL ── */
 /* ── 1 · VIDER ── */
 if(F.step===1){
  h=`<div class="step">${dots(0)}
   <div class="step-head">
    <div class="eyebrow">1 · Vider</div>
    <div class="h1">Qu'est-ce qui occupe ton esprit&nbsp;?</div>
    <p class="sub" style="margin-top:10px">Vide tout, sans trier. On classera ensuite.</p>
   </div>
   <div class="qrow">
    <input class="field" id="capIn" placeholder="Écris ici…" enterkeyhint="done" onkeydown="if(event.key==='Enter')addCap()"/>
    <button class="addbtn" onclick="addCap()" aria-label="Ajouter">${I.plus}</button>
   </div>
   ${(D.backlog||[]).length?`<div class="eyebrow" style="margin:14px 0 6px">Suggestions d'hier</div>
   <div class="sugg">${[...D.backlog].sort((a,b)=>(a.when==='tomorrow'?0:1)-(b.when==='tomorrow'?0:1)).slice(0,4).map(b=>
    `<button class="suggchip" onclick="pickSugg('${b.id}')">${I.plus}<span>${esc(b.title)}</span></button>`).join('')}</div>`:''}
   <div style="margin-top:8px">
    ${F.items.map(it=>`<div class="trow"><div class="tt">${esc(it.title)}</div>
      <button class="del" onclick="delCap('${it.id}')">${I.x}</button></div>`).join('')||'<p class="small" style="padding:16px 2px">Rien pour l\u2019instant — même une seule chose suffit.</p>'}
   </div>
   <div class="spacer"></div>
   <div class="flow-actions"><button class="btn" onclick="flowGo(2)" ${F.items.length?'':'disabled'}>Continuer</button></div>
  </div>`;
 }
 /* ── 2 · COMPRENDRE (une tâche par page) ── */
 else if(F.step===2){
  const n=F.items.length,pg=F.pg||0;
  h=`<div class="step">${dots(1)}
   <div class="step-head">
    <div class="eyebrow">2 · Comprendre</div>
    <div class="h1">Un élément à la fois</div>
    <p class="sub" style="margin-top:10px">Impact réel, temps honnête. Fais défiler.</p>
   </div>
   <div class="pgtop">
    <div class="pgbars" id="pgB">${F.items.map((_,i)=>`<i class="${i<=pg?'on':''}"></i>`).join('')}</div>
    <div class="pgcount" id="pgC">${pg+1} / ${n}</div>
   </div>
   <div class="pager" id="pager" onscroll="pagerScroll(this)">
    ${F.items.map(it=>{const preset=EST_PRESETS.includes(it.est);
     return`<div class="page"><div class="pcard" id="pc-${it.id}">
      <div class="name">${esc(it.title)}</div>
      <div class="lbl" style="margin-top:14px">Impact</div>
      <div class="seg duo">${[0,1,2,3].map(v=>`<button class="${it.imp===v?'on':''}" data-v="${v}" onclick="setLvl('${it.id}','imp',${v},this)"><b>${v}</b><span>${IMPACT_LBL[v]}</span></button>`).join('')}</div>
      <div class="lbl" style="margin-top:14px">Urgence</div>
      <div class="seg duo">${[0,1,2,3].map(v=>`<button class="${it.urg===v?'on':''}" data-v="${v}" onclick="setLvl('${it.id}','urg',${v},this)"><b>${v}</b><span>${URG_LBL[v]}</span></button>`).join('')}</div>
      <div class="lbl" style="margin-top:16px">Temps estimé <span class="gold" style="float:right;font-variant-numeric:tabular-nums" id="tvs-${it.id}">${fmtMin(it.est)}</span></div>
      <div class="presets" id="pr-${it.id}">${EST_PRESETS.map(v=>`<button class="pchip ${it.est===v?'on':''}" data-v="${v}" onclick="setEstPreset('${it.id}',${v},this)">${v<60?v+' min':fmtMin(v)}</button>`).join('')}<button class="pchip ${preset?'':'on'}" data-v="autre" onclick="showRail('${it.id}',this)">Autre</button></div>
      <div class="railwrap ${preset?'hide':''}" id="rw-${it.id}">
       <div class="tval" id="tv-${it.id}">${fmtTval(it.est)}</div>
       <div class="railrow">
        <button class="nud" onclick="nudge('${it.id}',-1)">−</button>
        <div class="rail" data-id="${it.id}"><div class="ticks" id="tk-${it.id}" style="background-position-x:${Math.round(it.est*2.6)}px"></div><div class="pin"></div></div>
        <button class="nud" onclick="nudge('${it.id}',1)">+</button>
       </div>
      </div>
      <div class="hrbox" id="hb-${it.id}">
       ${it.at?`<div class="hr-set"><span class="atchip" style="font-size:12px">${it.at}</span>
         <button class="chip ${it.remind?'on':''}" onclick="togItRemind('${it.id}',this)">Me rappeler</button>
         <button class="linkbtn" onclick="clearItAt('${it.id}')">Retirer</button></div>`
       :`<button class="linkbtn" onclick="showHours('${it.id}')">+ Ajouter une heure</button>
        <div class="hrpresets hide" id="hp-${it.id}">${hourPresets().map(hh=>`<button class="pchip" onclick="setItAt('${it.id}','${hh}')">${hh}</button>`).join('')}<button class="pchip" onclick="$('hc-${it.id}').classList.remove('hide');$('hc-${it.id}').focus()">Personnalisé</button><input type="time" class="field hide" id="hc-${it.id}" style="max-width:120px" onchange="if(this.value)setItAt('${it.id}',this.value)"/></div>`}
      </div>
     </div></div>`}).join('')}
   </div>
   <div class="spacer"></div>
   <div class="flow-actions" style="flex-direction:row;gap:10px">
    <button class="btn ghost" id="pgPrev" style="flex:0 0 42%" onclick="pagerPrev()" ${pg===0?'disabled':''}>Précédent</button>
    <button class="btn" id="pgBtn" style="flex:1" onclick="pagerNext()">${pg>=n-1?'Continuer':'Suivant'}</button>
   </div>
  </div>`;
 }
 /* ── 3 · CHOISIR ── */
 else if(F.step===3){
  const sorted=sortItems(F.items);
  const mit=F.items.find(i=>i.id===F.mitId)||sorted[0];
  const others=sorted.filter(i=>i.id!==mit.id);
  h=`<div class="step">${dots(2)}
   <div class="step-head" style="text-align:center">
    <div class="eyebrow">3 · Choisir</div>
    <div class="h2" style="margin-top:10px">Si tu ne termines qu'une seule chose aujourd'hui…</div>
    <p class="small" style="margin-top:10px">Sa durée n'entre pas en compte : faite, elle rend la journée gagnante. L'impact et l'urgence t'orientent — tu décides.</p>
   </div>
   <div class="mitwrap" style="text-align:left">
    <div class="mitcard">
     <div class="mc-eyebrow">Ta priorité</div>
     <div class="mc-title">${esc(mit.title)}</div>
     <div class="mc-meta">${fmtMin(mit.est)} · impact + urgence <span class="gold" style="font-weight:600">${tScore(mit)}/6</span> — ${IMPACT_LBL[mit.imp||0]}, ${URG_LBL[mit.urg||0]}</div>
    </div>
    ${mit.est>180?`<div class="warn">${I.warn}<span>Ambitieuse — pense à découper, ou prévois des vraies pauses.</span></div>`:''}
   </div>
   <div class="spacer"></div>
   ${others.length?`<div class="eyebrow" style="margin:10px 0 4px">Ou choisis une autre</div>
    <div>${others.map(o=>`<button class="alt" style="width:100%;text-align:left" onclick="S.flow.mitId='${o.id}';renderFlow()"><span class="r"></span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(o.title)}</span><span class="scorebadge">${tScore(o)}</span><span class="est">${fmtMin(o.est)}</span></button>`).join('')}</div>`:''}
   <div class="flow-actions"><button class="btn" onclick="S.flow.mitId='${mit.id}';prepSec();flowGo(4)">Choisir cette priorité</button></div>
  </div>`;
 }
 /* ── 4 · CONSTRUIRE ── */
 else if(F.step===4){
  const rest=F.items.filter(i=>i.id!==F.mitId);
  const sel=F.secIds;
  const mitEst=(F.items.find(i=>i.id===F.mitId)||{}).est||0;
  const tot=mitEst+rest.reduce((s,i)=>s+(sel.includes(i.id)?i.est:(i.est<=15?i.est:0)),0);
  h=`<div class="step">${dots(3)}
   <div class="step-head">
    <div class="eyebrow">4 · Construire</div>
    <div class="h1">Le reste de la journée</div>
    <p class="sub" style="margin-top:10px">3 secondaires max (45 min ou moins conseillé), 5 micro-tâches (10 min ou moins). Le reste part en suggestions pour demain — rien n'est perdu.</p>
    <p class="small" style="margin-top:8px">Ces ordres de grandeur gardent la journée tenable : c'est ce qui te permet de recommencer demain sans t'user.</p>
   </div>
   ${rest.length?`<div class="card" style="padding:6px 16px">

 const lines=raw.split('\n').map(s=>s.replace(/^[\s•\-*–—]+/,'').replace(/^\d+[.)]\s*/,'').trim()).filter(s=>s.length);
 if(!lines.length){toast('Écris au moins une chose');return}
 S.exp.items=lines.slice(0,30).map((title,i)=>{
  const role=i===0?'mit':i<=3?'sec':i<=8?'micro':'later';

 S.exp.step=2;renderExpress();

 let next=order[(order.indexOf(it.role)+1)%4],msg='';
 for(let k=0;k<4;k++){
  if(next==='sec'&&expCount('sec',id)>=3){msg='3 secondaires maximum — c’est le principe';next='micro';continue}
  if(next==='micro'&&expCount('micro',id)>=5){msg='5 micro-tâches maximum — peu, mais tenu';next='later';continue}
  break;
 }
 if(next==='mit'){const cur=S.exp.items.find(x=>x.role==='mit'&&x.id!==id);
  if(cur){if(expCount('sec',id)>=3){cur.role='later';msg='L’ancienne priorité part pour plus tard'}else cur.role='sec'}}
 it.role=next;if(it.est===ROLE_EST[order[(order.indexOf(next)+3)%4]])it.est=ROLE_EST[next];
 renderExpress();if(msg)toast(msg);
}

/* ============================================================
   SESSIONS — chronomètre intégré à la carte + alarme
   ============================================================ */
let AC=null,tickIv=null;
function initAudio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function chime(){if(!AC)return;try{const t0=AC.currentTime;
 [[880,0],[1174.66,.18],[880,.66],[1174.66,.84],[880,1.32],[1174.66,1.5]].forEach(([f,dt])=>{
  const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;
  g.gain.setValueAtTime(0,t0+dt);g.gain.linearRampToValueAtTime(.2,t0+dt+.02);g.gain.exponentialRampToValueAtTime(.001,t0+dt+.5);
  o.connect(g);g.connect(AC.destination);o.start(t0+dt);o.stop(t0+dt+.55)})}catch(e){}}
function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(ms)}catch(e){}}
function findTask(d,kind,id){if(kind==='m')return d.mit&&d.mit.id===id?d.mit:null;
 const arr=kind==='t'?d.tasks:d.quick;return(arr||[]).find(x=>x.id===id)}
function timerElapsed(t){return t.acc+(t.paused?0:Date.now()-t.start)}
function startTimer(kind,id){const d=day(todayISO());if(!d)return;
 if(d.timer){if(d.timer.tid!==id)toast('Une session est déjà en cours');return}
 const task=findTask(d,kind,id);if(!task||task.done)return;
 initAudio();
 d.timer={tid:id,kind,start:Date.now(),acc:0,paused:false,planned:task.est||30,alarmed:false};
 if(stopAtEnd())maybeAskNotif();
 save();render();scheduleTimerAlarm()}
function pauseTimer(){const d=day(todayISO()),t=d&&d.timer;if(!t)return;
 if(t.stopped)return;
 if(t.paused){t.start=Date.now();t.paused=false}else{t.acc+=Date.now()-t.start;t.paused=true}
 save();scheduleTimerAlarm();if(t.kind==='m')paintTimer();else render()}
/* ── ALARME DE FIN DE SESSION ──
   Le chrono s'arrête au temps prévu (réglable) : son, vibration, notification.
   La tâche n'est jamais cochée à la place de l'utilisateur — il choisit Terminé ou Continuer. */
function stopAtEnd(){return !(D&&D.settings&&D.settings.stopAtEnd===false)}
function setStopAtEnd(v){
 D.settings.stopAtEnd=!!v;save();
 if(v)maybeAskNotif();
 const d=day(todayISO());
 if(!v&&d&&d.timer&&d.timer.stopped)resumeOver();
 openSettings();scheduleTimerAlarm();
 toast(v?'Le chrono s’arrêtera au temps prévu':'Le chrono continuera au-delà du temps prévu')}
let almTO=null;
function clearTimerAlarm(){if(almTO){clearTimeout(almTO);almTO=null}}
function scheduleTimerAlarm(){
 clearTimerAlarm();
 try{
  const d=day(todayISO()),t=d&&d.timer;
  if(!t||t.paused||t.stopped||t.alarmed)return;
  const rem=t.planned*60000-timerElapsed(t);
  if(rem<=0||rem>12*3600*1000)return;
  /* on repasse par paintTimer : un seul chemin décide du gel ET de l'alerte, jamais deux fois */
  almTO=setTimeout(()=>{almTO=null;paintTimer()},rem);
 }catch(e){}
}
function fireTimerAlarm(title){
 try{initAudio()}catch(e){}          /* l'AudioContext peut être suspendu (arrière-plan iOS) ou perdu (rechargement) */
 try{chime()}catch(e){}
 buzz([30,80,30]);
 try{
  if('Notification' in window&&Notification.permission==='granted')
   new Notification('Temps prévu atteint',{body:title?title+' — à toi de décider : terminé, ou tu continues ?':'À toi de décider : terminé, ou tu continues ?',tag:'mw-session'});
 }catch(e){}
}
/* reprendre après l'arrêt : le décompte repart du temps prévu, en dépassement */
function resumeOver(){
 const d=day(todayISO()),t=d&&d.timer;if(!t||!t.stopped)return;
 t.stopped=false;t.paused=false;t.start=Date.now();
 save();render()}
function finishTimer(){const d=day(todayISO()),t=d&&d.timer;if(!t)return;
 const task=findTask(d,t.kind,t.tid);const mins=Math.max(1,Math.round(timerElapsed(t)/60000));
 if(task){task.done=true;task.spent=mins}
 const wasMit=t.kind==='m';delete d.timer;clearTimerAlarm();
 if(wasMit)S.justWon=true;buzz(wasMit?[14,60,20]:12);
 save();render();
 if(!wasMit)vShow('Accomplie \u00b7 '+fmtMin(mins))}
function abandonTimer(){const d=day(todayISO());if(!d||!d.timer)return;
 delete d.timer;clearTimerAlarm();save();render()}
function ensureTick(){if(!tickIv)tickIv=setInterval(paintTimer,500)}
function stopTick(){if(tickIv){clearInterval(tickIv);tickIv=null}}
const MC_C=364.42;
function fmtClock(ms){const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;
 return(h?h+':'+String(m).padStart(2,'0'):String(m))+':'+String(ss).padStart(2,'0')}
function paintTimer(){
 const d=day(todayISO()),t=d&&d.timer;
 if(!t){stopTick();return}
 let el=timerElapsed(t),tot=t.planned*60000,rem=tot-el;
 /* fin de session : on gèle le chrono au temps prévu et on alerte — la décision reste à l'utilisateur */
 /* `alarmed` garde ce bloc : une session n'est gelée qu'UNE fois — sinon « Continuer » serait annulé aussitôt */
 if(rem<=0&&!t.stopped&&!t.alarmed&&stopAtEnd()&&!t.paused){
  const d2=day(todayISO());
  t.acc=tot;t.paused=true;t.stopped=true;t.alarmed=true;
  const task=findTask(d2,t.kind,t.tid);fireTimerAlarm(task?task.title:'');
  clearTimerAlarm();save();render();return;
 }
 const over=rem<=0;
 if(t.stopped)stopTick();                        /* affichage figé : inutile de repeindre 2×/s */
 if(over&&!t.alarmed&&!t.stopped){t.alarmed=true;save();const task=findTask(d,t.kind,t.tid);fireTimerAlarm(task?task.title:'')}
 const txt=t.stopped?fmtClock(0):(over?'+':'')+fmtClock(over?el-tot:rem);
 const fr=over?1:Math.max(0,rem/tot);
 if(t.kind==='m'){
  const c=$('mitCard');if(!c)return;
  c.classList.toggle('paused',!!t.paused&&!t.stopped);c.classList.toggle('over',over);
  const s=$('mcS');if(s)s.textContent=t.stopped?'Temps écoulé':over?'Temps dépassé':(t.paused?'En pause':'Session en cours');
  const tt=$('mcT');if(tt)tt.textContent=txt;
  const lb=$('mcLbl');if(lb)lb.textContent=t.stopped?fmtMin(t.planned)+' prévues':over?'continue ou termine':(t.paused?'en pause':'restant');
  const a=$('mcArc');if(a)a.style.strokeDashoffset=MC_C*(1-fr);
  const p=$('mcPill');if(p&&!t.stopped)p.innerHTML=t.paused?I.play+'<span>Reprendre</span>':I.pause+'<span>Pause</span>';
 }else{
  const rt=$('rowT');if(rt)rt.textContent=t.stopped?'Temps écoulé':txt;
 }
}
/* — carte MIT (pièce maîtresse) — */

/* ── ajouter une tâche en cours de journée ──
   Les règles du flow s'appliquent : ≤10 min → micro (5 max), secondaire (3 max, ≤45 min conseillé).
   Au-delà de 45 min → recommandation avec choix explicites (garder / priorité / reporter) ;
   limites atteintes → reprogrammation explicite. Jamais de correction silencieuse. */
function openAddTask(){

 S.addT={est:15};
 openSheet(`<div class="h2" style="margin-bottom:4px">Ajouter une tâche</div>

function addDayTask(){

 const title=($('adT')&&$('adT').value||'').trim();
 if(!title){toast('Donne-lui un nom');return}
 const est=Math.max(1,S.addT&&S.addT.est||15);
 const it={id:uid(),title,est,done:false};
 if(est<=10&&d.quick.length<5){d.quick.push(it);save();closeSheet();render();toast('Micro-tâche ajoutée');return}

 if(est>45){dayTaskOpts(it);return}

function dayTaskOpts(it){

 const canMit=!d.timer&&(!d.mit||!d.mit.done);

/* ── reporter une tâche du jour / remplacer la priorité ── */
function deferTask(kind,id,when){
 const d=day(todayISO());if(!d||d.review)return;
 if(d.timer&&d.timer.tid===id){toast('Termine ou abandonne la session d\u2019abord');return}
 const arr=kind==='t'?d.tasks:d.quick;
 const ix=arr.findIndex(x=>x.id===id);if(ix<0)return;
 const t=arr[ix];arr.splice(ix,1);
 D.backlog.push({id:t.id,title:t.title,est:t.est,imp:t.imp||1,urg:t.urg||1,when,from:todayISO()});
 save();closeSheet();render();
 toast(when==='tomorrow'?'Reportée à demain — ta journée reste tenable':'Gardée pour une autre fois')}
function openSwapMit(){

 openSheet(`<div class="h2" style="margin-bottom:4px">Remplacer la priorité</div>

}
function swapSecToMit(id){

 d.mit={id:sec.id,title:sec.title,est:sec.est,imp:sec.imp||1,urg:sec.urg||1,at:sec.at||null,remind:!!sec.remind,done:false};

/* ── ancrer une tâche existante en rituel ──
   Le rituel hérite du titre, de l'heure, du rappel, de l'estimation
   et du score impact/urgence de la tâche. Il est proposé les jours cochés. */
function anchored(title){return(D.rituals||[]).find(r=>r.title.trim().toLowerCase()===String(title||'').trim().toLowerCase())}
function openAnchor(kind,id){
 const d=day(todayISO());if(!d)return;
 const t=findTask(d,kind,id);if(!t)return;
 const ex=anchored(t.title);
 if(!ex&&(D.rituals||[]).length>=3){
  openSheet(`<div class="h2" style="margin-bottom:6px">Trois ancres maximum</div>
   <p class="sub" style="margin-bottom:16px">C'est le principe : peu d'ancres, tenues. Retire un rituel pour en ancrer un nouveau.</p>
   <div style="display:flex;flex-direction:column;gap:8px">
    <button class="btn ghost" onclick="openRituals()">Gérer mes rituels</button>
    <button class="btn quiet" onclick="closeSheet()">Annuler</button>
   </div>`);return}
 const dow=((new Date().getDay()+6)%7)+1;
 S.anch={kind,id,rid:ex?ex.id:null,days:ex?[...(ex.days||[])]:[dow],remind:ex?!!ex.remind:!!t.remind};
 openSheet(`<div class="h2" style="margin-bottom:4px">${ex?'Ancre de rituel':'Ancrer en rituel'}</div>
  <p class="small" style="margin-bottom:14px">${esc(t.title)}${t.imp!=null?` · reprend son impact (${IMPACT_LBL[t.imp]}) et son urgence (${URG_LBL[t.urg||0]})`:''}</p>
  <div class="eyebrow" style="margin-bottom:8px">Proposée les jours</div>
  <div class="dayc">${RIT_D.map((l,i)=>`<button class="${S.anch.days.includes(i+1)?'on':''}" onclick="togAnchDay(${i+1},this)">${l}</button>`).join('')}</div>
  <div class="eyebrow" style="margin:16px 0 6px">Heure — facultative</div>
  <div style="display:flex;gap:10px;align-items:center">
   <input class="field" id="anH" type="time" value="${(ex?ex.time:t.at)||''}" style="max-width:140px"/>
   <button class="linkbtn" onclick="$('anH').value=''">Effacer</button>
  </div>
  <div style="margin-top:14px"><button class="chip ${S.anch.remind?'on':''}" id="anR" onclick="S.anch.remind=!S.anch.remind;this.classList.toggle('on')">Rappel à l'heure dite</button></div>
  <div style="margin-top:20px;display:flex;flex-direction:column;gap:8px">
   <button class="btn" onclick="saveAnchor()">${ex?'Enregistrer':'Ancrer ce rituel'}</button>
   ${ex?`<button class="btn quiet" style="color:var(--t3)" onclick="removeAnchor('${ex.id}')">Retirer l'ancre</button>`:''}
   <button class="btn quiet" onclick="closeSheet()">Annuler</button>
  </div>`)}
function togAnchDay(n,btn){const a=S.anch.days;const ix=a.indexOf(n);
 if(ix>=0)a.splice(ix,1);else a.push(n);btn.classList.toggle('on')}
function saveAnchor(){
 const A=S.anch;if(!A)return;
 const d=day(todayISO());const t=d&&findTask(d,A.kind,A.id);if(!t)return;
 const time=($('anH')&&$('anH').value)||null;
 const days=A.days.length?A.days.slice().sort((a,b)=>a-b):[((new Date().getDay()+6)%7)+1];
 const remind=!!(time&&A.remind);
 D.rituals=D.rituals||[];
 if(A.rid){const ix=D.rituals.findIndex(x=>x.id===A.rid);
  if(ix>=0)D.rituals[ix]={...D.rituals[ix],title:t.title,time,days,remind}}
 else D.rituals.push({id:uid(),title:t.title,time,days,remind,est:t.est,imp:t.imp,urg:t.urg,from:A.id});
 if(remind)maybeAskNotif();
 save();closeSheet();render();scheduleWebNotifs();
 toast(A.rid?'Ancre mise à jour':'Ancrée — proposée les jours cochés')}
function removeAnchor(rid){
 D.rituals=(D.rituals||[]).filter(x=>x.id!==rid);
 Object.values(D.days).forEach(d=>{if(d.ritualsDone)d.ritualsDone=d.ritualsDone.filter(x=>x!==rid)});
 save();closeSheet();render();toast('Ancre retirée')}

/* ============================================================
   À REPROGRAMMER — rien n'est perdu
   ============================================================ */
function bkFind(id){return(D.backlog||[]).find(x=>x.id===id)}
function bkWhen(id,w){const b=bkFind(id);if(!b)return;b.when=w;save();closeSheet();render();
 toast(w==='tomorrow'?'Proposée pour demain':'Gardée pour plus tard')}
function bkDel(id){D.backlog=D.backlog.filter(x=>x.id!==id);save();closeSheet();render()}
function bkToMit(id){const b=bkFind(id);if(!b)return;
 const d=day(todayISO());if(!d){toast('Construis d\u2019abord ta journée');return}
 if(d.review){toast('Journée déjà clôturée');return}
 if(d.timer){toast('Termine ta session d\u2019abord');return}
 if(d.mit&&!d.mit.done)D.backlog.push({id:d.mit.id,title:d.mit.title,est:d.mit.est,imp:d.mit.imp,urg:d.mit.urg,when:'tomorrow',from:todayISO()});
 d.mit={id:b.id,title:b.title,est:b.est||60,imp:b.imp||2,urg:b.urg||1,done:false};
 D.backlog=D.backlog.filter(x=>x.id!==id);
 save();closeSheet();render();toast('Nouvelle priorité du jour')}
function openBk(id){const b=bkFind(id);if(!b)return;
 openSheet(`<div class="h2" style="margin-bottom:4px">${esc(b.title)}</div>
  <p class="small" style="margin-bottom:14px">${fmtMin(b.est||0)} · notée le ${b.from||'—'}</p>
  <div style="display:flex;flex-direction:column;gap:8px">
   <button class="btn ghost" onclick="bkWhen('${b.id}','tomorrow')">Proposer demain</button>
   <button class="btn ghost" onclick="bkWhen('${b.id}','later')">Conserver pour plus tard</button>
   <button class="btn ghost" onclick="bkToMit('${b.id}')">En faire ma priorité du jour</button>
   <button class="btn quiet" style="color:var(--t3)" onclick="bkDel('${b.id}')">Supprimer</button>
  </div>`)}
function bkSection(){
 const bk=D.backlog||[];if(!bk.length)return'';
 const sorted=[...bk].sort((a,b)=>(a.when==='tomorrow'?0:1)-(b.when==='tomorrow'?0:1));
 return`<div class="sect"><div class="sect-h"><span class="eyebrow">À reprogrammer</span><span class="count">${bk.length}</span></div>
  <div class="card" style="padding:4px 16px">${sorted.slice(0,5).map(b=>`
   <div class="trow" style="cursor:pointer" onclick="openBk('${b.id}')">
    <span class="bkdot ${b.when==='tomorrow'?'soon':''}"></span>
    <div class="tt">${esc(b.title)}<div class="small" style="margin-top:2px">${b.when==='tomorrow'?'Proposée demain':'Plus tard'}</div></div>
    <span class="est">${fmtMin(b.est||0)}</span></div>`).join('')}
  </div>${bk.length>5?`<p class="small" style="margin-top:8px;padding:0 2px">+ ${bk.length-5} autres en réserve</p>`:''}</div>`}

}

 const r=S.ritEdit;r.title=($('ritT').value||'').trim();r.time=$('ritH').value||null;

 else{if(D.rituals.length>=3){toast('3 rituels maximum — c\u2019est le principe');return}
  D.rituals.push({id:uid(),title:r.title,time:r.time,days:r.days,remind:r.remind})}
 save();openRituals();render()}

/* ── JOUR ── */
function viewJour(){
 const iso=todayISO(),d=day(iso);
 let h=`<div class="eyebrow" style="margin:6px 0 4px;text-transform:capitalize">${fmtLong(iso)}</div>`;
 if(!d||( !d.mit && !d.tasks.length && !d.off)){
  return h+`<div class="h1" style="margin-bottom:22px">Ta journée n'est pas encore construite.</div>
   <div class="card"><p class="sub">Quelques minutes suffisent : vider, choisir une priorité, calibrer. Le reste suit.</p>
   <div style="margin-top:16px;display:flex;flex-direction:column;gap:8px">
    <button class="btn" onclick="startFlow()">Clarifier ma journée</button>
    <button class="btn ghost" onclick="startExpress()">Chemin express — tout coller d'un coup</button>
    <button class="btn quiet" onclick="dayOff()">Journée off</button>
    <button class="linkbtn" style="align-self:center;margin-top:2px" onclick="openSystem()">Comment ça marche</button>
   </div></div>`;
 }
 if(d.off){
  return h+`<div class="h1">Journée off.</div><p class="sub" style="margin-top:10px">Le repos fait partie du système. À demain.</p>
  <div style="margin-top:18px"><button class="btn ghost" onclick="undoOff()">Finalement, construire ma journée</button></div>`;
 }
 if(d.review){
  const r=d.review;
  h+=`<div class="h1" style="margin-bottom:6px">Journée clôturée</div>
  <div class="card" style="margin-top:14px">${scoreRing(r.score,r.status==='gagnante')}
   <div style="text-align:center;margin-top:6px" class="recap-status ${r.status==='gagnante'?'gold':''}">${r.status==='gagnante'?'Journée gagnante !':r.status==='partielle'?'Journée partielle':'Journée difficile'}</div>
   ${breakdown(r)}${r.note?`<p class="sub" style="margin-top:14px;border-top:1px solid var(--line2);padding-top:14px">${esc(r.note)}</p>`:''}
  </div>
  <div style="margin-top:14px"><button class="btn ghost" onclick="setTab('etoiles')">Voir la constellation</button></div>`;
  return h;
 }
 /* journée active */
 const m=d.mit;
 h+=`<div class="h1">Ma journée</div>`;
 if(d.mindset)h+=`<div class="note-chip dimmable" style="margin-top:12px">
   <span class="mchip">Clarté <b>${d.mindset.clarte}/5</b></span>
   <span class="mchip">Énergie <b>${d.mindset.energie}/5</b></span>
   ${d.mindset.charge!=null?`<span class="mchip">Charge <b>${d.mindset.charge}/5</b></span>`:''}
   ${d.mindset.elan!=null?`<span class="mchip">Élan <b>${d.mindset.elan}/5</b></span>`:''}
   ${d.mindset.ctx.map(c=>`<span class="mchip">${esc(c)}</span>`).join('')}
  </div>`;
 if(d.mindset&&(d.mindset.note||'').trim())h+=`<p class="small dimmable" style="margin-top:8px;padding:0 2px;font-style:italic">${esc(d.mindset.note.trim())}</p>`;
 if(!d.review)h+=`<div class="dimmable" style="margin-top:${d.mindset?'6px':'12px'}"><button class="linkbtn" onclick="openMindset()">${d.mindset?'Ajuster ma calibration':'Calibrer mon état d’esprit'}</button></div>`;
 if(m)h+=`<div class="mitwrap" style="margin-top:16px">${mitCard(d)}</div>`;
 if(d.tasks.length){
  h+=`<div class="sect dimmable"><div class="sect-h"><span class="eyebrow">Tâches secondaires</span><span class="count">${d.tasks.filter(t=>t.done).length}/${d.tasks.length}</span></div>
  <div class="deck" id="deck" data-dots="deckDots" onscroll="deckScroll(this)">${d.tasks.map(t=>scard(t,'t')).join('')}</div>
  ${d.tasks.length>1?`<div class="deck-dots" id="deckDots">${d.tasks.map((_,i)=>`<i class="${i===0?'on':''}"></i>`).join('')}</div>`:''}</div>`;
 }
 if(d.quick.length){
  h+=`<div class="sect dimmable"><div class="sect-h"><span class="eyebrow">Micro-tâches</span><span class="count">${d.quick.filter(t=>t.done).length}/${d.quick.length}</span></div>
  <div class="deck" id="deckQ" data-dots="deckDotsQ" onscroll="deckScroll(this)">${d.quick.map(t=>scard(t,'q')).join('')}</div>
  ${d.quick.length>2?`<div class="deck-dots" id="deckDotsQ">${d.quick.map((_,i)=>`<i class="${i===0?'on':''}"></i>`).join('')}</div>`:''}</div>`;
 }
 if(!d.review)h+=`<div class="sect dimmable" style="margin-top:14px"><button class="btn ghost" onclick="openAddTask()">+ Ajouter une tâche</button></div>`;
 const rits=todaysRituals();
 if(rits.length){
  const done=d.ritualsDone||[];
  h+=`<div class="sect dimmable"><div class="sect-h"><span class="eyebrow">Rituels</span><button class="linkbtn" onclick="openRituals()">Gérer</button></div>
  <div class="anchors">${rits.map(r=>{const on=done.includes(r.id);
   return`<button class="anchor ${on?'on':''}" onclick="togRitual('${r.id}')" aria-pressed="${on}">
    <span class="an-chk">${I.check}</span>
    <span class="an-name">${esc(r.title)}</span>
    <span class="an-time">${r.time||''}${(r.remind&&r.time)?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 9a6 6 0 1 0-12 0c0 6-2.4 7-2.4 7h16.8S18 15 18 9Z"/><path d="M10.2 20a2 2 0 0 0 3.6 0"/></svg>':''}</span>
   </button>`}).join('')}</div></div>`;
 }else if(!(D.rituals||[]).length){
  h+=`<button class="small" style="display:block;margin-top:22px;padding:2px;color:var(--t3)" onclick="openRituals()">+ Ajouter un rituel — lecture, sport, planification…</button>`;
 }
 h+=`<div class="dimmable">`+bkSection()+`</div>`;
 h+=`<button class="friction dimmable" onclick="openDerive()">${I.warn}<span><b style="color:var(--t1)">Je décroche</b> — revenir à l'action</span></button>`;
 h+=`<div class="dimmable" style="margin-top:26px"><button class="btn" onclick="startBilan()">Terminer la journée</button></div>`;
 return h;
}
function scard(t,kind='t'){
 const d=day(todayISO()),running=d&&d.timer&&d.timer.tid===t.id;
 let state;
 const stp=running&&d.timer.stopped;
 if(running)state=`<div class="sc-run"><span class="rowtime" id="rowT">${stp?'Temps écoulé':'…'}</span>
   ${stp?`<button class="minib" onclick="resumeOver()" aria-label="Continuer">${I.play}</button>`
        :`<button class="minib" onclick="pauseTimer()" aria-label="Pause">${d.timer.paused?I.play:I.pause}</button>`}
   <button class="minib gold" onclick="finishTimer()" aria-label="Terminer">${I.check}</button>
   <button class="minib" onclick="abandonTimer()" aria-label="Abandonner">${I.x}</button></div>`;
 else if(t.done)state=`<div class="sc-done">${I.check}<span>Fait${t.spent?' · '+fmtMin(t.spent):''}</span>
   <button class="linkbtn" onclick="togTask('${kind}','${t.id}')" aria-label="Décocher">Annuler</button></div>`;
 else state=`<button class="sc-start" onclick="startTimer('${kind}','${t.id}')">${I.play}<span>Démarrer</span></button>`;
 const an=anchored(t.title);
 return`<div class="scard ${kind==='q'?'q':''} ${t.done?'don':''} ${running?'run':''}">
  <button class="sc-anch ${an?'on':''}" aria-label="Ancrer en rituel" aria-pressed="${!!an}" onclick="openAnchor('${kind}','${t.id}')">${an?`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="8.6"/><path d="M8.4 12.2l2.4 2.4 4.8-5"/></svg>`:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="8.6" stroke-dasharray="2.6 3.4"/><path d="M12 8.6v6.8M8.6 12h6.8"/></svg>`}</button>

function togTask(kind,id){const d=day(todayISO());if(!d)return;const arr=kind==='t'?d.tasks:d.quick;

function commitDerive(k){
